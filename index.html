<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memoria de Labores</title>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb',
                        secondary: '#475569',
                    }
                }
            }
        }
    </script>

    <!-- Icons: Lucide (using unpkg specifically for browser) -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- PDF Libs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <!-- Recharts (via CDN for React) -->
    <script src="https://unpkg.com/recharts/umd/Recharts.js"></script>

    <!-- Excel & Word Libs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docx@8.2.2/build/index.js"></script>

    <style>
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>

<body class="bg-gray-50 text-slate-800 font-sans antialiased">
    <div id="global-error"
        style="display:none; position:fixed; top:0; left:0; right:0; background:#ef4444; color:white; padding:1rem; z-index:9999;">
    </div>
    <script>
        window.onerror = function (msg, url, line) {
            const el = document.getElementById('global-error');
            el.style.display = 'block';
            el.innerText = "Error: " + msg + " (Línea " + line + ")";
        };
    </script>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, createContext, useContext } = React;

        // Safe Recharts import
        const R = window.Recharts || {};
        const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, BarChart, Bar, PieChart, Pie, Cell } = R;
        // Mock components if Recharts fails
        const SafeBarChart = BarChart || (() => null);
        const SafeBar = Bar || (() => null);
        const SafeXAxis = XAxis || (() => null);
        const SafeYAxis = YAxis || (() => null);
        const SafeTooltip = Tooltip || (() => null);
        const SafeCartesianGrid = CartesianGrid || (() => null);
        const SafeResponsiveContainer = ResponsiveContainer || (({ children }) => <div>{children}</div>);
        const SafePieChart = PieChart || (() => null);
        const SafePie = Pie || (() => null);
        const SafeCell = Cell || (() => null);

        // --- ICONS WRAPPER ---

        // --- ICONS WRAPPER ---
        // Lucide icons are injected globally by the script, but for React we usually need components.
        // We will create a helper component to render Lucide icons dynamically.
        const Icon = ({ name, size = 24, className = "" }) => {
            const ref = React.useRef(null);

            useEffect(() => {
                if (ref.current) {
                    // Force Lucide to only replace the <i> tag inside THIS component
                    lucide.createIcons({
                        root: ref.current,
                        nameAttr: 'data-lucide',
                        attrs: {
                            class: className,
                            width: size,
                            height: size
                        }
                    });
                }
            }, [name, size, className]);

            // React renders a SPAN. Inside is an I tag on first render.
            // Lucide replaces the I tag with SVG.
            // React still controls the SPAN, so it can safely remove the SPAN when unmounting.
            return (
                <span ref={ref} className="inline-flex items-center justify-center">
                    <i data-lucide={name}></i>
                </span>
            );
        };

        // --- MOCK DATA / STORAGE UTILS ---
        const Storage = {
            get: (key, def) => {
                try {
                    const item = localStorage.getItem(key);
                    return item ? JSON.parse(item) : def;
                } catch (e) { return def; }
            },
            set: (key, val) => {
                try {
                    localStorage.setItem(key, JSON.stringify(val));
                } catch (e) {
                    if (e.name === 'QuotaExceededError' || e.code === 22) {
                        alert("¡Espacio lleno! No se pueden guardar más datos o imágenes grandes. Intenta borrar algunas actividades antiguas o usar imágenes más pequeñas.");
                    } else {
                        console.error("Storage Error:", e);
                    }
                }
            }
        };

        const compressImage = (file, maxWidth = 800, quality = 0.7) => {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > maxWidth) {
                                height *= maxWidth / width;
                                width = maxWidth;
                            }
                        } else {
                            if (height > maxWidth) {
                                width *= maxWidth / height;
                                height = maxWidth;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                };
                reader.readAsDataURL(file);
            });
        };



        // --- STORAGE (IndexedDB) ---
        const DB_NAME = 'MemoriaLaboresDB';
        const DB_VERSION = 4; // Incremented to add 'notes' store

        const DB = {
            open: () => {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(DB_NAME, DB_VERSION);
                    request.onerror = () => reject(request.error);
                    request.onsuccess = () => resolve(request.result);
                    request.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains('users')) db.createObjectStore('users', { keyPath: 'id' });
                        if (!db.objectStoreNames.contains('activities')) db.createObjectStore('activities', { keyPath: 'id' });
                        if (!db.objectStoreNames.contains('documents')) db.createObjectStore('documents', { keyPath: 'id' });
                        if (!db.objectStoreNames.contains('news')) db.createObjectStore('news', { keyPath: 'id' });
                        if (!db.objectStoreNames.contains('beneficiaries')) db.createObjectStore('beneficiaries', { keyPath: 'id' });
                        if (!db.objectStoreNames.contains('notes')) db.createObjectStore('notes', { keyPath: 'id' });
                    };
                });
            },
            getAll: async (storeName) => {
                const db = await DB.open();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(storeName, 'readonly');
                    const store = tx.objectStore(storeName);
                    const request = store.getAll();
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
            },
            put: async (storeName, data) => {
                const db = await DB.open();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(storeName, 'readwrite');
                    const store = tx.objectStore(storeName);
                    const request = store.put(data);
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
            },
            delete: async (storeName, id) => {
                const db = await DB.open();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(storeName, 'readwrite');
                    const store = tx.objectStore(storeName);
                    const request = store.delete(id);
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
            }
        };

        // --- CONTEXT ---
        const AppContext = React.createContext();

        const AppProvider = ({ children }) => {
            const [user, setUser] = useState(null);
            const [activities, setActivities] = useState([]);
            const [documents, setDocuments] = useState([]);
            const [news, setNews] = useState([]);
            const [beneficiaries, setBeneficiaries] = useState([]);
            const [notes, setNotes] = useState([]);
            const [usersDB, setUsersDB] = useState([]);
            const [loading, setLoading] = useState(true);

            // Initial Load
            useEffect(() => {
                const initData = async () => {
                    try {
                        // Ensure DB is open/upgraded first
                        await DB.open();

                        const [loadedUsers, loadedActivities, loadedDocs, loadedNews, loadedBeneficiaries, loadedNotes] = await Promise.all([
                            DB.getAll('users'),
                            DB.getAll('activities'),
                            DB.getAll('documents'),
                            DB.getAll('news'),
                            DB.getAll('beneficiaries'),
                            DB.getAll('notes')
                        ]);
                        setUsersDB(loadedUsers || []);
                        setActivities(loadedActivities || []);
                        setDocuments(loadedDocs || []);
                        setNews(loadedNews || []);
                        setBeneficiaries(loadedBeneficiaries || []);
                        setNotes(loadedNotes || []);

                        // Auto-login last active user if needed, or just persist session in simpler way
                        // For now we just load the DB. User needs to login.
                        // Ideally we check localStorage for a 'lastUserId'
                        const lastUserId = localStorage.getItem('lastUserId');
                        if (lastUserId && loadedUsers) {
                            const currentUser = loadedUsers.find(u => u.id === lastUserId);
                            if (currentUser) setUser(currentUser);
                        }
                    } catch (err) {
                        console.error("DB Init Error:", err);
                    } finally {
                        setLoading(false);
                    }
                };
                initData();
            }, []);

            const login = async (email, password) => {
                const found = usersDB.find(u => u.email === email && u.password === password);
                if (found) {
                    setUser(found);
                    localStorage.setItem('lastUserId', found.id);
                    return true;
                }
                return false;
            };

            const register = async (userData) => {
                if (usersDB.find(u => u.email === userData.email)) return false;
                const newUser = { ...userData, id: Date.now().toString() };

                await DB.put('users', newUser);
                setUsersDB([...usersDB, newUser]);
                setUser(newUser);
                localStorage.setItem('lastUserId', newUser.id);
                return true;
            };

            const logout = () => {
                setUser(null);
                localStorage.removeItem('lastUserId');
            };

            const addActivity = async (act) => {
                const newAct = { ...act, id: Date.now().toString(), dateCreated: new Date().toISOString() };
                await DB.put('activities', newAct);
                setActivities(prev => [...prev, newAct]);
            };

            const updateActivity = async (act) => {
                await DB.put('activities', act);
                setActivities(prev => prev.map(a => a.id === act.id ? act : a));
            };

            const deleteActivity = async (id) => {
                await DB.delete('activities', id);
                setActivities(prev => prev.filter(a => a.id !== id));
            };

            const addDocument = async (doc) => {
                const newDoc = { ...doc, id: Date.now().toString(), date: new Date().toISOString().split('T')[0] };
                await DB.put('documents', newDoc);
                setDocuments(prev => [...prev, newDoc]);
            };

            const deleteDocument = async (id) => {
                await DB.delete('documents', id);
                setDocuments(prev => prev.filter(d => d.id !== id));
            };

            const handleUpdateUser = async (updatedData) => {
                await DB.put('users', updatedData);
                setUser(updatedData);
                setUsersDB(prev => prev.map(u => u.id === updatedData.id ? updatedData : u));
            };

            const addNews = async (item) => {
                const newItem = { ...item, id: Date.now().toString(), date: new Date().toISOString().split('T')[0] };
                await DB.put('news', newItem);
                setNews(prev => [...prev, newItem]);
            };

            const updateNews = async (item) => {
                await DB.put('news', item);
                setNews(prev => prev.map(n => n.id === item.id ? item : n));
            };

            const deleteNews = async (id) => {
                await DB.delete('news', id);
                setNews(prev => prev.filter(n => n.id !== id));
            };

            const addBeneficiary = async (item) => {
                const newItem = { ...item, id: Date.now().toString(), dateCreated: new Date().toISOString() };
                await DB.put('beneficiaries', newItem);
                setBeneficiaries(prev => [...prev, newItem]);
            };

            const updateBeneficiary = async (item) => {
                await DB.put('beneficiaries', item);
                setBeneficiaries(prev => prev.map(b => b.id === item.id ? item : b));
            };

            const deleteBeneficiary = async (id) => {
                await DB.delete('beneficiaries', id);
                setBeneficiaries(prev => prev.filter(b => b.id !== id));
            };

            // NOTES CRUD
            const addNote = async (note) => {
                const newNote = { ...note, id: Date.now().toString(), date: new Date().toISOString() };
                await DB.put('notes', newNote);
                setNotes(prev => [newNote, ...prev]);
            };

            const updateNote = async (note) => {
                await DB.put('notes', note);
                setNotes(prev => prev.map(n => n.id === note.id ? note : n));
            };

            const deleteNote = async (id) => {
                await DB.delete('notes', id);
                setNotes(prev => prev.filter(n => n.id !== id));
            };

            const exportData = async () => {
                try {
                    const [users, activities, documents, news, beneficiaries] = await Promise.all([
                        DB.getAll('users'),
                        DB.getAll('activities'),
                        DB.getAll('documents'),
                        DB.getAll('news'),
                        DB.getAll('beneficiaries'),
                        DB.getAll('notes')
                    ]);

                    const data = {
                        timestamp: new Date().toISOString(),
                        version: 1,
                        users, activities, documents, news, beneficiaries, notes
                    };

                    const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `backup_memoria_labores_${new Date().toISOString().split('T')[0]}.json`;
                    a.click();
                    URL.revokeObjectURL(url);
                    alert('Copia de seguridad descargada exitosamente.');
                } catch (err) {
                    console.error(err);
                    alert('Error al exportar datos.');
                }
            };

            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gray-100 flex-col">
                        <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mb-4"></div>
                        <p className="text-gray-600">Cargando base de datos...</p>
                    </div>
                );
            }

            return (
                <AppContext.Provider value={{
                    user, activities, documents, news,
                    login, register, logout,
                    addActivity, updateActivity, deleteActivity, updateUser: handleUpdateUser,
                    addDocument, deleteDocument,
                    addNews, updateNews, deleteNews,
                    beneficiaries, addBeneficiary, updateBeneficiary, deleteBeneficiary,
                    notes, addNote, updateNote, deleteNote,
                    exportData
                }}>
                    {children}
                </AppContext.Provider>
            );
        };

        // --- COMPONENTS: AUTH ---
        const LoginScreen = () => {
            const { login, register } = useContext(AppContext);
            const [isRegister, setIsRegister] = useState(false);
            const [formData, setFormData] = useState({
                name: '', institution: '', direction: '', office: '',
                email: '', password: '',
                institutionLogo: null, userPhoto: null
            });

            // Base64 helper
            const handleFile = async (e, field) => {
                const file = e.target.files[0];
                if (!file) return;
                try {
                    const compressed = await compressImage(file, 600, 0.6); // Aggressive compression for profile
                    setFormData(prev => ({ ...prev, [field]: compressed }));
                } catch (err) {
                    console.error("Error compressing image", err);
                }
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (isRegister) {
                    if (await register(formData)) alert('Bienvenido!');
                    else alert('El correo ya existe');
                } else {
                    const success = await login(formData.email, formData.password);
                    if (!success) alert('Credenciales incorrectas');
                }
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-500 to-indigo-700 flex items-center justify-center p-4">
                    <div className="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden">
                        <div className="p-8">
                            <h2 className="text-3xl font-bold text-center text-gray-800 mb-2">
                                {isRegister ? 'Registro' : 'Iniciar Sesión'}
                            </h2>
                            <p className="text-center text-gray-500 mb-8">Memoria de Labores</p>

                            <form onSubmit={handleSubmit} className="space-y-4">
                                {isRegister && (
                                    <>
                                        <input required className="w-full p-3 border rounded-lg" placeholder="Nombre Completo" value={formData.name} onChange={e => setFormData({ ...formData, name: e.target.value })} />
                                        <input required className="w-full p-3 border rounded-lg" placeholder="Institución" value={formData.institution} onChange={e => setFormData({ ...formData, institution: e.target.value })} />
                                        <div className="grid grid-cols-2 gap-2">
                                            <input required className="w-full p-3 border rounded-lg" placeholder="Dirección" value={formData.direction} onChange={e => setFormData({ ...formData, direction: e.target.value })} />
                                            <input required className="w-full p-3 border rounded-lg" placeholder="Oficina" value={formData.office} onChange={e => setFormData({ ...formData, office: e.target.value })} />
                                        </div>
                                        <div className="space-y-2">
                                            <label className="block text-sm text-gray-600">Logo Institución</label>
                                            <input type="file" onChange={e => handleFile(e, 'institutionLogo')} className="w-full text-sm" />
                                        </div>
                                        <div className="space-y-2">
                                            <label className="block text-sm text-gray-600">Foto Usuario</label>
                                            <input type="file" onChange={e => handleFile(e, 'userPhoto')} className="w-full text-sm" />
                                        </div>
                                    </>
                                )}
                                <input required type="email" className="w-full p-3 border rounded-lg" placeholder="Correo Electrónico" value={formData.email} onChange={e => setFormData({ ...formData, email: e.target.value })} />
                                <input required type="password" className="w-full p-3 border rounded-lg" placeholder="Contraseña" value={formData.password} onChange={e => setFormData({ ...formData, password: e.target.value })} />

                                <button type="submit" className="w-full bg-blue-600 text-white p-3 rounded-lg font-bold hover:bg-blue-700 transition">
                                    {isRegister ? 'Registrarse' : 'Entrar'}
                                </button>
                            </form>


                            <div className="mt-6 text-center">
                                <button onClick={() => setIsRegister(!isRegister)} className="text-blue-600 hover:underline">
                                    {isRegister ? '¿Ya tienes cuenta? Inicia sesión' : '¿No tienes cuenta? Regístrate'}
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const BIBLE_PROMISES = [
            { text: "Porque yo sé los pensamientos que tengo acerca de vosotros, dice Jehová, pensamientos de paz, y no de mal, para daros el fin que esperáis.", ref: "Jeremías 29:11" },
            { text: "Mira que te mando que te esfuerces y seas valiente; no temas ni desmayes, porque Jehová tu Dios estará contigo en dondequiera que vayas.", ref: "Josué 1:9" },
            { text: "Todo lo puedo en Cristo que me fortalece.", ref: "Filipenses 4:13" },
            { text: "Y sabemos que a los que aman a Dios, todas las cosas les ayudan a bien.", ref: "Romanos 8:28" },
            { text: "Jehová es mi pastor; nada me faltará.", ref: "Salmos 23:1" },
            { text: "Fíate de Jehová de todo tu corazón, Y no te apoyes en tu propia prudencia.", ref: "Proverbios 3:5" },
            { text: "No temas, porque yo estoy contigo; no desmayes, porque yo soy tu Dios que te esfuerzo.", ref: "Isaías 41:10" }
        ];

        const HomeView = () => {
            const { user, exportData } = useContext(AppContext);
            const today = new Date().toLocaleDateString('es-GT', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            const verse = useMemo(() => BIBLE_PROMISES[Math.floor(Math.random() * BIBLE_PROMISES.length)], []);

            return (
                <div className="max-w-4xl mx-auto space-y-8 animate-fade-in">
                    <div className="flex justify-between items-center">
                        <div className="bg-gradient-to-r from-blue-600 to-indigo-700 rounded-2xl p-8 text-white shadow-xl relative overflow-hidden flex-1 mr-4">
                            <div className="relative z-10">
                                <h1 className="text-4xl font-bold mb-2">¡Bienvenido, {user.name.split(' ')[0]}!</h1>
                                <p className="text-blue-100 text-lg mb-6 capitalize">{today}</p>
                                <p className="max-w-xl text-blue-50 opacity-90">
                                    Estás en el Sistema de Memoria de Labores. Aquí puedes registrar, gestionar y reportar todas tus actividades diarias.
                                </p>
                            </div>
                            <div className="absolute right-0 bottom-0 opacity-10 transform translate-x-10 translate-y-10">
                                <Icon name="book-open" size={200} />
                            </div>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div className="bg-white rounded-xl shadow-lg border-l-4 border-amber-400 p-8 relative overflow-hidden">
                            <div className="absolute top-0 right-0 p-4 opacity-5">
                                <Icon name="sun" size={100} className="text-amber-500" />
                            </div>
                            <h3 className="text-amber-600 font-bold uppercase tracking-wide text-sm mb-3 flex items-center gap-2">
                                <Icon name="sparkles" size={16} />
                                Promesa del Día
                            </h3>
                            <blockquote className="text-2xl font-serif text-gray-700 italic mb-4 relative z-10">
                                "{verse.text}"
                            </blockquote>
                            <p className="text-right font-bold text-gray-900">— {verse.ref}</p>
                        </div>

                        <div className="bg-white rounded-xl shadow-lg border-l-4 border-green-500 p-8 flex flex-col justify-center items-center text-center">
                            <div className="bg-green-100 p-4 rounded-full mb-4 text-green-600">
                                <Icon name="download" size={32} />
                            </div>
                            <h3 className="font-bold text-gray-800 text-lg mb-2">Respaldo de Información</h3>
                            <p className="text-gray-500 text-sm mb-4">Descarga una copia de seguridad de todos tus registros para mantenerlos seguros.</p>
                            <button onClick={exportData} className="bg-green-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-green-700 transition w-full shadow-md">
                                Descargar Copia
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const ProfileView = () => {
            const { user, updateUser } = useContext(AppContext);
            const [formData, setFormData] = useState({ ...user });
            const [isSaved, setIsSaved] = useState(false);

            const handleFile = async (e, field) => {
                const file = e.target.files[0];
                if (!file) return;
                try {
                    const compressed = await compressImage(file, 600, 0.6);
                    setFormData(prev => ({ ...prev, [field]: compressed }));
                } catch (err) {
                    console.error("Error compression", err);
                }
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                await updateUser(formData);
                setIsSaved(true);
                alert("Perfil actualizado correctamente");
                setTimeout(() => setIsSaved(false), 3000);
            };

            return (
                <div className="max-w-2xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden">
                    <div className="bg-gray-50 p-6 border-b flex justify-between items-center">
                        <h2 className="text-xl font-bold text-gray-800">Editar Perfil</h2>
                        {isSaved && <span className="text-green-600 text-sm font-bold flex items-center gap-1"><Icon name="check" size={16} /> Guardado</span>}
                    </div>
                    <form onSubmit={handleSubmit} className="p-8 space-y-6">
                        <div className="flex items-center space-x-6 mb-6">
                            <div className="relative group cursor-pointer">
                                {formData.userPhoto ?
                                    <img src={formData.userPhoto} className="w-24 h-24 rounded-full object-cover border-4 border-white shadow-md" /> :
                                    <div className="w-24 h-24 rounded-full bg-gray-200 flex items-center justify-center text-gray-400"><Icon name="user" size={40} /></div>
                                }
                                <input type="file" onChange={e => handleFile(e, 'userPhoto')} className="absolute inset-0 opacity-0 cursor-pointer z-20" />
                                <div className="absolute inset-0 bg-black/30 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition text-white text-xs pointer-events-none z-10">Cambiar</div>
                            </div>
                            <div className="flex-1">
                                <label className="block text-sm font-medium text-gray-700 mb-1">Nombre Completo</label>
                                <input required className="w-full p-3 border rounded-lg" value={formData.name} onChange={e => setFormData({ ...formData, name: e.target.value })} />
                            </div>
                        </div>

                        <div className="grid grid-cols-2 gap-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Correo Electrónico</label>
                                <input required type="email" className="w-full p-3 border rounded-lg bg-gray-50" value={formData.email} disabled />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                                <input required type="password" className="w-full p-3 border rounded-lg" value={formData.password} onChange={e => setFormData({ ...formData, password: e.target.value })} />
                            </div>
                        </div>

                        <hr className="border-dashed" />

                        <div className="space-y-4">
                            <h3 className="font-bold text-gray-900">Información Institucional</h3>

                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Nombre Institución</label>
                                <input required className="w-full p-3 border rounded-lg" value={formData.institution} onChange={e => setFormData({ ...formData, institution: e.target.value })} />
                            </div>

                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Dirección / Área</label>
                                    <input required className="w-full p-3 border rounded-lg" value={formData.direction} onChange={e => setFormData({ ...formData, direction: e.target.value })} />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Oficina</label>
                                    <input required className="w-full p-3 border rounded-lg" value={formData.office} onChange={e => setFormData({ ...formData, office: e.target.value })} />
                                </div>
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Logo Institucional</label>
                                <div className="flex items-center space-x-4 border rounded-lg p-3">
                                    {formData.institutionLogo && <img src={formData.institutionLogo} className="h-12 w-12 object-contain" />}
                                    <input type="file" onChange={e => handleFile(e, 'institutionLogo')} className="text-sm text-gray-500" />
                                </div>
                            </div>
                        </div>

                        <div className="pt-4 flex justify-end">
                            <button type="submit" className="bg-blue-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-blue-700 transition shadow-lg">
                                Guardar Cambios
                            </button>
                        </div>
                    </form>
                </div>
            );
        };


        // --- APP SHELL ---
        const Dashboard = () => {
            const { user, logout } = useContext(AppContext);
            const [view, setView] = useState('home'); // home, activities, report, calendar, news, profile, documents, settings
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

            // Re-render icons when DOM updates
            useEffect(() => { lucide.createIcons(); });

            const NavItem = ({ id, label, icon }) => (
                <button
                    onClick={() => { setView(id); setIsMobileMenuOpen(false); }}
                    className={`flex items-center space-x-3 w-full p-3 rounded-lg hover:bg-white/10 transition mb-1 ${view === id ? 'bg-white/20 text-white font-bold' : 'text-blue-100'}`}
                >
                    <Icon name={icon} size={20} />
                    <span>{label}</span>
                </button>
            );

            return (
                <div className="flex h-screen overflow-hidden bg-gray-100">
                    {/* Sidebar */}
                    <aside className={`fixed inset-y-0 left-0 z-50 w-64 bg-slate-900 text-white transform transition-transform duration-300 md:relative md:translate-x-0 flex flex-col ${isMobileMenuOpen ? 'translate-x-0' : '-translate-x-full'}`}>
                        <div className="p-6 flex flex-col items-center border-b border-gray-700 cursor-pointer" onClick={() => setView('home')}>
                            {user.institutionLogo ?
                                <img src={user.institutionLogo} className="h-16 w-16 object-contain mb-2 rounded bg-white p-1" /> :
                                <div className="h-16 w-16 bg-gray-700 rounded-full mb-2 flex items-center justify-center"><Icon name="building-2" /></div>
                            }
                            <h2 className="font-bold text-center leading-tight text-sm">{user.institution}</h2>
                        </div>

                        <nav className="flex-1 p-4 overflow-y-auto">
                            <NavItem id="home" label="Inicio" icon="home" />
                            <NavItem id="calendar" label="Calendario" icon="calendar" />
                            <NavItem id="activities" label="Actividades" icon="list" />
                            <NavItem id="report" label="Reportes" icon="bar-chart-2" />
                            <NavItem id="documents" label="Documentos" icon="file-text" />
                            <NavItem id="beneficiaries" label="Beneficiarios" icon="users" />
                            <NavItem id="news" label="Noticias" icon="bell" />
                            <NavItem id="notes" label="Notas" icon="edit-3" />
                            <NavItem id="directory" label="Directorio" icon="phone" />
                            <div className="my-2 border-t border-gray-700"></div>
                            <NavItem id="settings" label="Configuración" icon="settings" />
                        </nav>

                        <div className="p-4 border-t border-gray-700 bg-black/20">
                            <button onClick={() => setView('profile')} className={`flex items-center space-x-3 w-full p-2 hover:bg-white/10 rounded-lg transition mb-2 ${view === 'profile' ? 'bg-white/10' : ''}`}>
                                {user.userPhoto ?
                                    <img src={user.userPhoto} className="w-8 h-8 rounded-full object-cover border-2 border-white" /> :
                                    <div className="bg-blue-500 rounded-full p-1.5 w-8 h-8 flex items-center justify-center"><Icon name="user" size={16} /></div>
                                }
                                <div className="flex-1 text-left overflow-hidden">
                                    <p className="text-sm font-bold truncate">{user.name}</p>
                                    <p className="text-xs text-blue-300 truncate">Ver Perfil</p>
                                </div>
                            </button>
                            <button onClick={logout} className="flex items-center space-x-2 text-red-300 hover:text-red-100 hover:bg-red-900/30 w-full p-2 rounded-lg text-sm font-bold transition">
                                <Icon name="log-out" size={16} />
                                <span>Cerrar Sesión</span>
                            </button>
                        </div>
                    </aside>

                    {/* Main Content */}
                    <div className="flex-1 flex flex-col h-screen overflow-hidden relative">
                        {/* Header */}
                        <header className="bg-white shadow-sm h-16 flex items-center justify-between px-6 z-10 md:hidden">
                            <span className="font-bold text-gray-800 text-lg">Memoria de Labores</span>
                            <button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} className="p-2 bg-gray-100 rounded-lg text-gray-600">
                                <Icon name="menu" />
                            </button>
                        </header>

                        <main className="flex-1 overflow-y-auto p-4 md:p-8 bg-gray-100">
                            {view === 'home' && <HomeView />}
                            {view === 'profile' && <ProfileView />}
                            {view === 'activities' && <ActivitiesView />}
                            {view === 'report' && <ReportView />}
                            {view === 'calendar' && <CalendarView />}
                            {view === 'beneficiaries' && <BeneficiariesView />}
                            {view === 'documents' && <DocumentsView />}
                            {view === 'news' && <NewsView />}
                            {view === 'notes' && <NotesView />}
                            {view === 'directory' && <DirectoryView />}
                            {view === 'settings' && <SettingsView />}
                        </main>
                    </div>

                    {/* Mobile Overlay */}
                    {isMobileMenuOpen && (
                        <div className="fixed inset-0 bg-black/50 z-40 md:hidden" onClick={() => setIsMobileMenuOpen(false)}></div>
                    )}
                </div>
            );
        };

        const DocumentsView = () => {
            const { documents, addDocument, deleteDocument } = useContext(AppContext);

            const handleUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                if (file.size > 2 * 1024 * 1024) { // 2MB Limit
                    alert("El archivo es demasiado grande. El límite es 2MB para evitar saturar el almacenamiento local.");
                    return;
                }

                if (file.type !== 'application/pdf') {
                    alert("Solo se permiten archivos PDF.");
                    return;
                }

                const reader = new FileReader();
                reader.onload = () => {
                    addDocument({
                        name: file.name,
                        size: (file.size / 1024).toFixed(0) + ' KB',
                        data: reader.result
                    });
                };
                reader.readAsDataURL(file);
            };

            const openPdf = (data) => {
                const win = window.open();
                win.document.write('<iframe src="' + data + '" frameborder="0" style="border:0; top:0px; left:0px; bottom:0px; right:0px; width:100%; height:100%;" allowfullscreen></iframe>');
            };

            return (
                <div className="max-w-5xl mx-auto space-y-6">
                    <div className="flex justify-between items-center">
                        <div>
                            <h2 className="text-2xl font-bold text-gray-800">Documentos de Referencia</h2>
                            <p className="text-gray-500 text-sm">Sube guías, normativas o formatos PDF (Máx 2MB)</p>
                        </div>
                        <div className="relative">
                            <input type="file" accept="application/pdf" onChange={handleUpload} className="absolute inset-0 opacity-0 cursor-pointer w-full h-full" />
                            <button className="bg-blue-600 text-white px-4 py-2 rounded-lg flex items-center space-x-2 shadow hover:bg-blue-700 transition">
                                <Icon name="upload" size={18} />
                                <span>Subir PDF</span>
                            </button>
                        </div>
                    </div>

                    {documents.length === 0 ? (
                        <div className="text-center py-20 bg-white rounded-xl border border-dashed border-gray-300">
                            <Icon name="file-text" size={48} className="mx-auto text-gray-300 mb-4" />
                            <p className="text-gray-500">No hay documentos subidos.</p>
                        </div>
                    ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            {documents.map(doc => (
                                <div key={doc.id} className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 hover:shadow-md transition flex flex-col justify-between">
                                    <div className="flex items-start space-x-4 mb-4">
                                        <div className="bg-red-100 p-3 rounded-lg text-red-600">
                                            <Icon name="file-text" size={24} />
                                        </div>
                                        <div className="overflow-hidden">
                                            <h3 className="font-bold text-gray-800 truncate" title={doc.name}>{doc.name}</h3>
                                            <p className="text-xs text-gray-500">{doc.date} • {doc.size}</p>
                                        </div>
                                    </div>
                                    <div className="flex space-x-2 border-t pt-3">
                                        <button onClick={() => openPdf(doc.data)} className="flex-1 text-blue-600 hover:bg-blue-50 py-2 rounded text-sm font-medium transition">
                                            Abrir
                                        </button>
                                        <button onClick={() => { if (confirm('¿Borrar archivo?')) deleteDocument(doc.id) }} className="flex-1 text-red-600 hover:bg-red-50 py-2 rounded text-sm font-medium transition">
                                            Eliminar
                                        </button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        const BeneficiariesView = () => {
            const { beneficiaries, addBeneficiary, updateBeneficiary, deleteBeneficiary, user } = useContext(AppContext);
            const [viewMode, setViewMode] = useState('list'); // list | form
            const [editingItem, setEditingItem] = useState(null);

            const downloadPDF = () => {
                try {
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF();

                    // Header
                    if (user.institutionLogo) {
                        doc.addImage(user.institutionLogo, 'JPEG', 15, 10, 20, 20);
                    }
                    doc.setFontSize(18);
                    doc.text(user.institution, 40, 20);
                    doc.setFontSize(12);
                    doc.text("Reporte de Beneficiarios", 40, 28);
                    doc.text(`Generado por: ${user.name}`, 40, 34);
                    doc.text(`Fecha: ${new Date().toLocaleDateString()}`, 40, 40);

                    doc.line(15, 45, 195, 45);

                    const tableData = [];
                    beneficiaries.forEach(b => {
                        const familyData = `Esposa: ${b.spouseName || "N/A"}${b.spouseAge ? " (" + b.spouseAge + " años)" : ""}\nHijos: ${b.children?.length > 0 ? b.children.map(c => `${c.name} (${c.age})`).join(", ") : "Ninguno"}`;
                        const observations = b.observations ? `\n\nOBS: ${b.observations}` : "";

                        tableData.push([
                            b.churchName,
                            { content: `Pastor: ${b.pastorName}\nTel: ${b.pastorPhone}\nEdad: ${b.pastorAge || "N/A"}\nDenom: ${b.denomination}`, styles: { fontSize: 9 } },
                            { content: familyData + observations, styles: { fontSize: 8 } },
                            b.address
                        ]);

                        const imgs = [...(b.photos || [])];
                        if (b.pastorPhoto) imgs.push(b.pastorPhoto);

                        if (imgs.length > 0) {
                            const imgW = 40;
                            const imgH = 30;
                            const perRow = 4;
                            const numRows = Math.ceil(imgs.length / perRow);
                            const rowH = (imgH + 5) * numRows + 5;

                            tableData.push([
                                {
                                    content: '',
                                    colSpan: 4,
                                    styles: { minCellHeight: rowH },
                                    _images: imgs,
                                    _config: { w: imgW, h: imgH, gap: 5, perRow: perRow }
                                }
                            ]);
                        }
                    });

                    doc.autoTable({
                        startY: 55,
                        head: [['Iglesia', 'Pastor / Denom', 'Familia / Observaciones', 'Dirección']],
                        body: tableData,
                        didDrawCell: (data) => {
                            if (data.cell.raw && data.cell.raw._images && data.column.index === 0 && data.cell.section === 'body') {
                                const { _images, _config } = data.cell.raw;
                                _images.forEach((img, i) => {
                                    const rowIdx = Math.floor(i / _config.perRow);
                                    const colIdx = i % _config.perRow;
                                    const xPos = data.cell.x + 2 + colIdx * (_config.w + _config.gap);
                                    const yPos = data.cell.y + 2 + rowIdx * (_config.h + _config.gap);
                                    try {
                                        doc.addImage(img, 'JPEG', xPos, yPos, _config.w, _config.h);
                                    } catch (err) { console.error("PDF image error", err); }
                                });
                            }
                        }
                    });

                    doc.save(`reporte_beneficiarios.pdf`);
                } catch (e) {
                    alert("Error al generar el PDF de beneficiarios.");
                    console.error(e);
                }
            };

            const downloadExcel = () => {
                try {
                    const data = [];
                    beneficiaries.forEach(b => {
                        // Flat row for basic info
                        const row = {
                            'Iglesia': b.churchName,
                            'Dirección': b.address,
                            'Denominación': b.denomination,
                            'Pastor': b.pastorName,
                            'Tel Pastor': b.pastorPhone,
                            'Edad Pastor': b.pastorAge,
                            'Esposa': b.spouseName,
                            'Edad Esposa': b.spouseAge,
                            'Tel Esposa': b.spousePhone,
                            'Observaciones': b.observations,
                            'Hijos': b.children?.map(c => `${c.name} (${c.age} años - ${c.education})`).join('; ') || ''
                        };
                        data.push(row);
                    });
                    const ws = XLSX.utils.json_to_sheet(data);
                    const wb = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(wb, ws, "Beneficiarios");
                    XLSX.writeFile(wb, `beneficiarios.xlsx`);
                } catch (e) {
                    alert("Error al generar Excel.");
                    console.error(e);
                }
            };

            const downloadWord = async () => {
                try {
                    const docxLib = window.docx;
                    if (!docxLib) throw new Error("Librería de Word no cargada");
                    const { Document, Packer, Paragraph, TextRun, Table, TableRow, TableCell, WidthType } = docxLib;

                    const childrenTableContents = (children) => {
                        if (!children || children.length === 0) return [new Paragraph("Sin hijos registrados")];

                        const tableRows = [
                            new TableRow({
                                children: [
                                    new TableCell({ children: [new Paragraph({ children: [new TextRun({ text: "Nombre", bold: true })] })] }),
                                    new TableCell({ children: [new Paragraph({ children: [new TextRun({ text: "Edad", bold: true })] })] }),
                                    new TableCell({ children: [new Paragraph({ children: [new TextRun({ text: "Escolaridad", bold: true })] })] }),
                                ]
                            })
                        ];

                        children.forEach(c => {
                            tableRows.push(new TableRow({
                                children: [
                                    new TableCell({ children: [new Paragraph(c.name || "")] }),
                                    new TableCell({ children: [new Paragraph(c.age ? c.age.toString() : "")] }),
                                    new TableCell({ children: [new Paragraph(c.education || "")] }),
                                ]
                            }));
                        });

                        return [new Table({ width: { size: 100, type: WidthType.PERCENTAGE }, rows: tableRows })];
                    };

                    const docChildren = [
                        new Paragraph({ children: [new TextRun({ text: "INFORME DETALLADO DE BENEFICIARIOS", bold: true, size: 36 })] }),
                        new Paragraph({ text: `Generado por: ${user.name}` }),
                        new Paragraph({ text: "" }),
                    ];

                    beneficiaries.forEach(b => {
                        docChildren.push(
                            new Paragraph({ children: [new TextRun({ text: b.churchName, bold: true, size: 28, color: "2563eb" })] }),
                            new Paragraph({ text: `Dirección: ${b.address}` }),
                            new Paragraph({ text: `Denominación: ${b.denomination || "N/A"}` }),
                            new Paragraph({ text: "" }),
                            new Paragraph({ children: [new TextRun({ text: "DATOS DEL PASTOR", bold: true })] }),
                            new Paragraph({ text: `Nombre: ${b.pastorName} (${b.pastorAge || "?"} años)` }),
                            new Paragraph({ text: `Teléfono: ${b.pastorPhone}` }),
                            new Paragraph({ text: "" }),
                            new Paragraph({ children: [new TextRun({ text: "DATOS FAMILIARES", bold: true })] }),
                            new Paragraph({ text: `Esposa: ${b.spouseName || "N/A"} (${b.spouseAge || "?"} años) - Tel: ${b.spousePhone || "N/A"}` }),
                            new Paragraph({ text: "Hijos:" }),
                            ...childrenTableContents(b.children),
                            new Paragraph({ text: "" }),
                            new Paragraph({ children: [new TextRun({ text: "OBSERVACIONES", bold: true })] }),
                            new Paragraph({ text: b.observations || "Sin observaciones" }),
                            new Paragraph({ text: "_________________________________________________________________________" }),
                            new Paragraph({ text: "" })
                        );
                    });

                    const doc = new Document({
                        sections: [{
                            properties: {},
                            children: docChildren
                        }]
                    });

                    const blob = await Packer.toBlob(doc);
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    a.href = url;
                    a.download = `beneficiarios.docx`;
                    a.click();
                    URL.revokeObjectURL(url);
                } catch (e) {
                    alert("Error al generar Word: " + e.message);
                    console.error(e);
                }
            };

            const handleEdit = (item) => {
                setEditingItem(item);
                setViewMode('form');
            };

            const handleDelete = (id) => {
                if (confirm('¿Está seguro de eliminar este registro?')) {
                    deleteBeneficiary(id);
                }
            };

            if (viewMode === 'form') {
                return (
                    <BeneficiaryForm
                        initialData={editingItem}
                        onSubmit={(data) => {
                            if (editingItem) updateBeneficiary(data);
                            else addBeneficiary(data);
                            setViewMode('list');
                            setEditingItem(null);
                        }}
                        onCancel={() => {
                            setViewMode('list');
                            setEditingItem(null);
                        }}
                    />
                );
            }

            return (
                <div className="space-y-6">
                    <div className="flex justify-between items-center">
                        <div>
                            <h2 className="text-2xl font-bold text-gray-800">Registro de Beneficiarios (Iglesias)</h2>
                            <p className="text-gray-500">Censo y control de iglesias y pastores</p>
                        </div>
                        <div className="flex space-x-2">
                            <div className="flex bg-slate-800 rounded-lg p-1">
                                <button onClick={() => downloadPDF()} title="PDF" className="text-white p-2 hover:bg-red-600 rounded transition">
                                    <Icon name="file-text" size={18} />
                                </button>
                                <button onClick={() => downloadExcel()} title="Excel" className="text-white p-2 hover:bg-emerald-600 rounded transition">
                                    <Icon name="file-spreadsheet" size={18} />
                                </button>
                                <button onClick={() => downloadWord()} title="Word" className="text-white p-2 hover:bg-blue-600 rounded transition">
                                    <Icon name="file-text" size={18} />
                                </button>
                            </div>
                            <button onClick={() => { setEditingItem(null); setViewMode('form'); }} className="bg-blue-600 text-white px-4 py-2 rounded-lg flex items-center space-x-2 shadow hover:bg-blue-700 transition">
                                <Icon name="plus" size={18} />
                                <span>Nuevo Registro</span>
                            </button>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        {beneficiaries.map(b => (
                            <div key={b.id} className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-md transition">
                                <div className="h-32 bg-gray-200 relative">
                                    {b.photos && b.photos.length > 0 ? (
                                        <img src={b.photos[0]} className="w-full h-full object-cover" />
                                    ) : (
                                        <div className="flex items-center justify-center h-full text-gray-400">
                                            <Icon name="image" size={40} />
                                        </div>
                                    )}
                                    <div className="absolute top-2 right-2 bg-white/90 p-1 rounded-lg backdrop-blur text-xs font-bold shadow-sm">
                                        ID: {b.id.slice(-4)}
                                    </div>
                                </div>
                                <div className="p-5">
                                    <h3 className="font-bold text-lg text-gray-800 mb-1">{b.churchName}</h3>
                                    <p className="text-sm text-gray-500 mb-4 flex items-center gap-1"><Icon name="map-pin" size={12} /> {b.address}</p>

                                    <div className="space-y-2 text-sm text-gray-600">
                                        <div className="flex justify-between">
                                            <span className="font-medium">Pastor:</span>
                                            <span>{b.pastorName}</span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span className="font-medium">Teléfono:</span>
                                            <span>{b.pastorPhone}</span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span className="font-medium">Denominación:</span>
                                            <span>{b.denomination}</span>
                                        </div>
                                    </div>

                                    <div className="mt-4 pt-4 border-t flex justify-between items-center">
                                        {b.location && b.location.lat ? (
                                            <a href={`https://www.google.com/maps?q=${b.location.lat},${b.location.lng}`} target="_blank" className="text-blue-600 text-xs font-bold flex items-center gap-1 hover:underline">
                                                <Icon name="map" size={12} /> Ver Mapa
                                            </a>
                                        ) : <span className="text-gray-400 text-xs">Sin ubicación</span>}

                                        <div className="flex space-x-2">
                                            <button onClick={() => handleEdit(b)} title="Editar" className="p-2 text-blue-600 hover:bg-blue-50 rounded-full transition"><Icon name="edit" size={16} /></button>
                                            <button onClick={() => handleDelete(b.id)} title="Eliminar" className="p-2 text-red-600 hover:bg-red-50 rounded-full transition"><Icon name="trash-2" size={16} /></button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const BeneficiaryForm = ({ initialData, onSubmit, onCancel }) => {
            const [form, setForm] = useState(initialData || {
                churchName: '', address: '', denomination: '',
                location: { lat: null, lng: null },
                pastorName: '', pastorPhone: '', pastorAge: '', pastorPhoto: null,
                spouseName: '', spouseAge: '', spousePhone: '',
                children: [], // { name, age, education }
                photos: [],
                observations: ''
            });

            // Tabs: 'church', 'pastor', 'family'
            const [activeTab, setActiveTab] = useState('church');

            const handleLocation = () => {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(position => {
                        setForm(prev => ({
                            ...prev,
                            location: {
                                lat: position.coords.latitude,
                                lng: position.coords.longitude
                            }
                        }));
                        alert("Ubicación capturada correctamente.");
                    }, (err) => {
                        alert("Error obteniendo ubicación. Asegúrese de dar permisos.");
                        console.error(err);
                    });
                } else {
                    alert("Su navegador no soporta geolocalización.");
                }
            };

            const handlePhotos = async (e) => {
                const files = Array.from(e.target.files);
                if (files.length > 0) {
                    const compressed = await Promise.all(files.map(f => compressImage(f, 800, 0.7)));
                    setForm(prev => ({ ...prev, photos: [...prev.photos, ...compressed] }));
                }
            };

            const handlePastorPhoto = async (e) => {
                const file = e.target.files[0];
                if (file) {
                    const compressed = await compressImage(file, 600, 0.6);
                    setForm(prev => ({ ...prev, pastorPhoto: compressed }));
                }
            };

            const addChild = () => {
                setForm(prev => ({ ...prev, children: [...prev.children, { name: '', age: '', education: '' }] }));
            };

            const updateChild = (index, field, value) => {
                const newChildren = [...form.children];
                newChildren[index][field] = value;
                setForm(prev => ({ ...prev, children: newChildren }));
            };

            const removeChild = (index) => {
                const newChildren = form.children.filter((_, i) => i !== index);
                setForm(prev => ({ ...prev, children: newChildren }));
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                onSubmit(form);
            };

            const TabButton = ({ id, label, icon }) => (
                <button type="button" onClick={() => setActiveTab(id)}
                    className={`flex-1 p-3 text-sm font-bold flex items-center justify-center gap-2 border-b-2 transition ${activeTab === id ? 'border-blue-600 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700'}`}>
                    <Icon name={icon} size={16} /> {label}
                </button>
            );

            return (
                <div className="max-w-4xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden">
                    <div className="bg-gray-50 p-4 border-b flex justify-between items-center">
                        <h2 className="font-bold text-gray-800 text-lg">
                            {initialData ? 'Editar Registro' : 'Nuevo Registro de Beneficiario'}
                        </h2>
                        <button onClick={onCancel} className="text-gray-500 hover:text-gray-700"><Icon name="x" /></button>
                    </div>

                    <div className="flex border-b">
                        <TabButton id="church" label="Datos Iglesia" icon="home" />
                        <TabButton id="pastor" label="Datos Pastor" icon="user" />
                        <TabButton id="family" label="Familia" icon="users" />
                    </div>

                    <form onSubmit={handleSubmit} className="p-6">
                        {activeTab === 'church' && (
                            <div className="space-y-4 animate-fade-in">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Nombre de la Iglesia</label>
                                    <input required className="w-full p-2 border rounded-lg" value={form.churchName} onChange={e => setForm({ ...form, churchName: e.target.value })} />
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">Dirección</label>
                                        <input required className="w-full p-2 border rounded-lg" value={form.address} onChange={e => setForm({ ...form, address: e.target.value })} />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">Denominación</label>
                                        <input className="w-full p-2 border rounded-lg" value={form.denomination} onChange={e => setForm({ ...form, denomination: e.target.value })} />
                                    </div>
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Ubicación GPS</label>
                                    <div className="flex items-center space-x-3">
                                        <button type="button" onClick={handleLocation} className="bg-green-600 text-white px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-2 hover:bg-green-700 transition">
                                            <Icon name="map-pin" size={16} /> Capturar Ubicación
                                        </button>
                                        {form.location.lat && <span className="text-sm text-green-600 font-medium">Lat: {form.location.lat.toFixed(5)}, Lng: {form.location.lng.toFixed(5)}</span>}
                                    </div>
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Fotos de la Iglesia</label>
                                    <div className="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center cursor-pointer hover:bg-gray-50 relative">
                                        <input type="file" multiple onChange={handlePhotos} className="absolute inset-0 opacity-0 cursor-pointer" />
                                        <Icon name="camera" className="mx-auto text-gray-400 mb-2" />
                                        <p className="text-sm text-gray-500">Click para subir fotos</p>
                                    </div>
                                    {form.photos.length > 0 && (
                                        <div className="flex gap-2 mt-2 overflow-x-auto pb-2">
                                            {form.photos.map((p, i) => (
                                                <img key={i} src={p} className="h-20 w-20 object-cover rounded shadow-md border" />
                                            ))}
                                        </div>
                                    )}
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Observaciones Generales</label>
                                    <textarea className="w-full p-2 border rounded-lg h-24" value={form.observations} onChange={e => setForm({ ...form, observations: e.target.value })}></textarea>
                                </div>
                            </div>
                        )}

                        {activeTab === 'pastor' && (
                            <div className="space-y-4 animate-fade-in">
                                <div className="flex items-start gap-6">
                                    <div className="text-center">
                                        <div className="relative group w-32 h-32 mx-auto bg-gray-200 rounded-full overflow-hidden mb-2">
                                            {form.pastorPhoto ?
                                                <img src={form.pastorPhoto} className="w-full h-full object-cover" /> :
                                                <div className="flex items-center justify-center h-full text-gray-400"><Icon name="user" size={48} /></div>
                                            }
                                            <input type="file" onChange={handlePastorPhoto} className="absolute inset-0 opacity-0 cursor-pointer" />
                                            <div className="absolute inset-0 bg-black/30 flex items-center justify-center opacity-0 group-hover:opacity-100 transition text-white text-xs pointer-events-none">Cambiar</div>
                                        </div>
                                        <span className="text-sm text-gray-500">Foto Pastor</span>
                                    </div>
                                    <div className="flex-1 space-y-4">
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">Nombre Completo del Pastor</label>
                                            <input required className="w-full p-2 border rounded-lg" value={form.pastorName} onChange={e => setForm({ ...form, pastorName: e.target.value })} />
                                        </div>
                                        <div className="grid grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-sm font-medium text-gray-700 mb-1">Número de Celular</label>
                                                <input className="w-full p-2 border rounded-lg" value={form.pastorPhone} onChange={e => setForm({ ...form, pastorPhone: e.target.value })} />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-medium text-gray-700 mb-1">Edad</label>
                                                <input type="number" className="w-full p-2 border rounded-lg" value={form.pastorAge} onChange={e => setForm({ ...form, pastorAge: e.target.value })} />
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div className="border-t pt-4">
                                    <h3 className="font-bold text-gray-800 mb-3 flex items-center gap-2"><Icon name="heart" size={16} /> Datos de la Esposa</h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">Nombre Completo</label>
                                            <input className="w-full p-2 border rounded-lg" value={form.spouseName} onChange={e => setForm({ ...form, spouseName: e.target.value })} />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">Edad</label>
                                            <input type="number" className="w-full p-2 border rounded-lg" value={form.spouseAge} onChange={e => setForm({ ...form, spouseAge: e.target.value })} />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">Celular</label>
                                            <input className="w-full p-2 border rounded-lg" value={form.spousePhone} onChange={e => setForm({ ...form, spousePhone: e.target.value })} />
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'family' && (
                            <div className="space-y-4 animate-fade-in">
                                <div className="flex justify-between items-center mb-2">
                                    <h3 className="font-bold text-gray-800">Hijos del Pastor</h3>
                                    <button type="button" onClick={addChild} className="text-blue-600 font-bold text-sm flex items-center gap-1 hover:underline">
                                        <Icon name="plus" size={16} /> Agregar Hijo
                                    </button>
                                </div>

                                {form.children.length === 0 ? (
                                    <div className="text-center py-8 bg-gray-50 rounded-lg text-gray-400 text-sm">
                                        No se han registrado hijos
                                    </div>
                                ) : (
                                    <div className="space-y-3">
                                        {form.children.map((child, index) => (
                                            <div key={index} className="flex gap-2 items-start bg-gray-50 p-2 rounded-lg">
                                                <div className="flex-1">
                                                    <input placeholder="Nombre Completo" className="w-full p-2 border rounded text-sm mb-1" value={child.name} onChange={e => updateChild(index, 'name', e.target.value)} />
                                                </div>
                                                <div className="w-20">
                                                    <input type="number" placeholder="Edad" className="w-full p-2 border rounded text-sm" value={child.age} onChange={e => updateChild(index, 'age', e.target.value)} />
                                                </div>
                                                <div className="w-1/3">
