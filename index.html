                        <InventoryForm initialData={editingItem} onSubmit={handleSave} onCancel={() => setMode('list')} />
                    </div>
                );
            }

            return (
                <div className="max-w-6xl mx-auto">
                    <div className="flex justify-between items-center mb-6">
                        <div>
                            <h2 className="text-2xl font-bold text-gray-800">Inventario y Activos</h2>
                            <p className="text-gray-500">Control de equipos, vehículos y mobiliario</p>
                        </div>
                        <button onClick={() => { setEditingItem(null); setMode('form'); }} className="bg-blue-600 text-white px-4 py-2 rounded-lg flex items-center space-x-2 shadow hover:bg-blue-700 transition transform hover:scale-105">
                            <Icon name="plus" size={18} />
                            <span>Agregar Activo</span>
                        </button>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        {inventory.map(item => (
                            <div key={item.id} className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-md transition">
                                <div className="h-40 bg-gray-200 relative">
                                    {item.photos && item.photos.length > 0 ? (
                                        <img src={item.photos[0]} className="w-full h-full object-cover" />
                                    ) : (
                                        <div className="flex items-center justify-center h-full text-gray-400 bg-slate-100">
                                            <Icon name="box" size={48} />
                                        </div>
                                    )}
                                    <div className={`absolute top-2 right-2 px-2 py-1 rounded-full text-[10px] font-bold uppercase ${item.status === 'Normal' ? 'bg-green-100 text-green-700' :
                                        item.status === 'Reparación' ? 'bg-yellow-100 text-yellow-700' : 'bg-red-100 text-red-700'
                                        }`}>
                                        {item.status}
                                    </div>
                                </div>
                                <div className="p-5">
                                    <h3 className="font-bold text-gray-800">{item.name}</h3>
                                    <p className="text-xs text-blue-600 font-bold mb-3">{item.code || 'S/C'}</p>
                                    <div className="space-y-1 text-sm text-gray-600 mb-4">
                                        <div className="flex justify-between"><span>Categoría:</span><span className="font-medium">{item.category}</span></div>
                                        <div className="flex justify-between"><span>Responsable:</span><span className="font-medium truncate ml-2">{item.responsible}</span></div>
                                        <div className="flex justify-between"><span>Ubicación:</span><span className="font-medium truncate ml-2">{item.location}</span></div>
                                    </div>
                                    <div className="flex justify-end space-x-2 pt-3 border-t">
                                        <button onClick={() => { setEditingItem(item); setMode('form'); }} className="p-2 text-blue-600 hover:bg-blue-50 rounded-lg transition"><Icon name="edit" size={16} /></button>
                                        <button onClick={() => confirm('¿Eliminar activo?') && deleteInventory(item.id)} className="p-2 text-red-600 hover:bg-red-50 rounded-lg transition"><Icon name="trash-2" size={16} /></button>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const InventoryForm = ({ initialData, onSubmit, onCancel }) => {
            const [form, setForm] = useState(initialData || {
                name: '', code: '', category: 'Oficina', status: 'Normal',
                responsible: '', location: '', lastMaintenance: '', photos: [], observations: ''
            });

            const handlePhotos = async (e) => {
                const files = Array.from(e.target.files);
                const compressed = await Promise.all(files.map(f => compressImage(f, 800, 0.7)));
                setForm({ ...form, photos: [...form.photos, ...compressed] });
            };

            return (
                <form onSubmit={(e) => { e.preventDefault(); onSubmit(form); }} className="space-y-6">
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div className="md:col-span-2">
                            <label className="block text-sm font-medium mb-1">Nombre del Activo</label>
                            <input required className="w-full p-2 border rounded-lg" value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} placeholder="Ej: Laptop HP Pro, Camión recolector..." />
                        </div>
                        <div>
                            <label className="block text-sm font-medium mb-1">Código de Inventario</label>
                            <input className="w-full p-2 border rounded-lg" value={form.code} onChange={e => setForm({ ...form, code: e.target.value })} placeholder="Ej: MUN-001-2024" />
                        </div>
                        <div>

            const getDeadlineInfo = (requestDate) => {
                const start = new Date(requestDate);
                const deadline = new Date(start);
                deadline.setDate(start.getDate() + 10);
                const today = new Date();
                const diffTime = deadline - today;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                return { deadline, diffDays };

        const ReportView = () => {
            const { activities, user } = useContext(AppContext);

            // Date Filter State
            const [dateRange, setDateRange] = useState({
                start: new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString().split('T')[0],
                end: new Date().toISOString().split('T')[0]
            });

            // Filter Logic
            const filteredActivities = useMemo(() => {
                return activities.filter(a => a.date >= dateRange.start && a.date <= dateRange.end);
            }, [activities, dateRange]);

            // Calculate Stats
            const stats = useMemo(() => {
                const results = {
                    total: filteredActivities.length,
                    beneficiaries: filteredActivities.reduce((acc, curr) => acc + (curr.beneficiaries || 0), 0),
                    cost: filteredActivities.reduce((acc, curr) => acc + (curr.cost || 0), 0),
                    avgProgress: filteredActivities.length > 0
                        ? filteredActivities.reduce((acc, curr) => acc + (parseInt(curr.physicalProgress) || 0), 0) / filteredActivities.length
                        : 0,
                    men: filteredActivities.reduce((acc, curr) => acc + (parseInt(curr.beneficiariesMen) || 0), 0),
                    women: filteredActivities.reduce((acc, curr) => acc + (parseInt(curr.beneficiariesWomen) || 0), 0),
                    children: filteredActivities.reduce((acc, curr) => acc + (parseInt(curr.beneficiariesChildren) || 0), 0),
                };
                return results;
            }, [filteredActivities]);

            // Chart Data
            const chartData = useMemo(() => {
                const dates = {};
                filteredActivities.forEach(a => {
                    const d = a.date.substring(5); // MM-DD
                    dates[d] = (dates[d] || 0) + 1;
                });
                return Object.keys(dates).sort().map(k => ({ name: k, count: dates[k] }));
            }, [filteredActivities]);

            const fundingData = useMemo(() => {
                const sources = {};
                filteredActivities.forEach(a => {
                    const src = a.fundingSource || 'Otro / No esp.';
                    sources[src] = (sources[src] || 0) + (parseFloat(a.cost) || 0);
                });
                return Object.keys(sources).map(key => ({ name: key, value: sources[key] }));
            }, [filteredActivities]);

            const demographicData = [
                { name: 'Hombres', value: stats.men, fill: '#3b82f6' },
                { name: 'Mujeres', value: stats.women, fill: '#ec4899' },
                { name: 'Niños/Jóvenes', value: stats.children, fill: '#10b981' }
            ].filter(d => d.value > 0);

            const downloadPDF = () => {
                try {
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF('l', 'mm', 'a4'); // Landscape orientation

                    // Header
                    if (user.institutionLogo) {
                        doc.addImage(user.institutionLogo, 'JPEG', 15, 10, 25, 25);
                    }

                    doc.setFont("helvetica", "bold");
                    doc.setFontSize(16);
                    doc.text(user.institution.toUpperCase(), 45, 18);

                    doc.setFontSize(10);
                    doc.setFont("helvetica", "normal");
                    doc.text("GOBIERNO DE LA REPÚBLICA DE GUATEMALA", 45, 24);
                    doc.text(`OFICINA: ${user.office.toUpperCase()}`, 45, 29);

                    doc.setFont("helvetica", "bold");
                    doc.setFontSize(14);
                    doc.text("REPORTE DE RENDICIÓN DE CUENTAS - MEMORIA DE LABORES", 150, 45, { align: 'center' });

                    doc.setFontSize(9);
                    doc.setFont("helvetica", "normal");
                    doc.text(`Art. 10 Numeral 15, 16, 19 y 23 - Ley de Acceso a la Información Pública`, 150, 50, { align: 'center' });
                    doc.text(`Período reportado: ${dateRange.start} al ${dateRange.end}`, 15, 60);
                    doc.text(`Fecha de generación: ${new Date().toLocaleDateString()}`, 240, 60);

                    // Stats Summary
                    doc.setDrawColor(200);
                    doc.line(15, 63, 280, 63);

                    // Table Data
                    const tableData = [];
                    filteredActivities.forEach((a, index) => {
                        const activityDetails = `${a.title}\n\nResponsable: ${a.responsiblePerson || user.name}\nEje: ${a.strategicAxis || "N/A"}`;
                        const transparency = `Renglón: ${a.budgetLine || "N/A"}\nNOG/NPG: ${a.nogNpg || "N/A"}\nSNIP: ${a.snipCode || "N/A"}\nFuente: ${a.fundingSource || "N/A"}`;
                        const impact = `Total: ${a.beneficiaries}\n(H:${a.beneficiariesMen || 0} / M:${a.beneficiariesWomen || 0} / N:${a.beneficiariesChildren || 0})`;

                        tableData.push([
                            index + 1,
                            a.date,
                            activityDetails,
                            a.community || "Muni Barrios",
                            transparency,
                            impact,
                            `Q${(a.cost || 0).toLocaleString()}`,
                            `${a.physicalProgress || 0}%`
                        ]);

                        // Evidence Images Row
                        const imgs = a.images && a.images.length > 0 ? a.images : [];
                        if (imgs.length > 0) {
                            const imgW = 45;
                            const imgH = 34;
                            const perRow = 5;
                            const numRows = Math.ceil(imgs.length / perRow);
                            const rowH = (imgH + 5) * numRows + 5;

                            tableData.push([
                                {
                                    content: 'EVIDENCIA FOTOGRÁFICA DE CAMPO:',
                                    colSpan: 8,
                                    styles: { minCellHeight: rowH, fontSize: 7, fontStyle: 'bold', fillColor: [245, 247, 250] },
                                    _images: imgs,
                                    _config: { w: imgW, h: imgH, gap: 5, perRow: perRow }
                                }
                            ]);
                        }
                    });

                    doc.autoTable({
                        startY: 65,
                        head: [['No.', 'Fecha', 'Actividad / Proyecto', 'Comunidad', 'Datos Legales (CGC)', 'Metas / Benef.', 'Monto (Q)', 'Avance']],
                        body: tableData,
                        theme: 'grid',
                        styles: { fontSize: 8, cellPadding: 3, overflow: 'linebreak' },
                        headStyles: { fillColor: [15, 23, 42], textColor: 255, fontStyle: 'bold', halign: 'center' },
                        columnStyles: {
                            0: { halign: 'center', cellWidth: 10 },
                            1: { halign: 'center', cellWidth: 20 },
                            3: { cellWidth: 30 },
                            4: { fontSize: 7, cellWidth: 45 },
                            5: { halign: 'center', cellWidth: 25 },
                            6: { halign: 'right', cellWidth: 25 },
                            7: { halign: 'center', cellWidth: 15 }
                        },
                        didDrawPage: (data) => {
                            // Footer / Signatures on Last Page
                            const pageCount = doc.internal.getNumberOfPages();
                            if (pageCount === doc.internal.getCurrentPageInfo().pageNumber) {
                                const finalY = data.cursor.y + 30;
                                if (finalY < 180) {
                                    doc.line(30, finalY, 90, finalY);
                                    doc.text("F. Elaborado por", 60, finalY + 5, { align: 'center' });
                                    doc.text(user.name, 60, finalY + 10, { align: 'center' });

                                    doc.line(110, finalY, 170, finalY);
                                    doc.text("F. Gestión / Oficina", 140, finalY + 5, { align: 'center' });
                                    doc.text(user.office, 140, finalY + 10, { align: 'center' });

                                    doc.line(190, finalY, 250, finalY);
                                    doc.text("Vo.Bo. Autoridad Superior", 220, finalY + 5, { align: 'center' });
                                }
                            }
                        },
                        didDrawCell: (data) => {
                            if (data.cell.raw && data.cell.raw._images) {
                                const { _images, _config } = data.cell.raw;
                                _images.forEach((img, i) => {
                                    const rowIdx = Math.floor(i / _config.perRow);
                                    const colIdx = i % _config.perRow;
                                    const xPos = data.cell.x + 5 + colIdx * (_config.w + _config.gap);
                                    const yPos = data.cell.y + 10 + rowIdx * (_config.h + _config.gap);
                                    try {
                                        doc.addImage(img, 'JPEG', xPos, yPos, _config.w, _config.h);
                                    } catch (err) { console.error("PDF Image Error", err); }
                                });
                            }
                        }
                    });

                    doc.save(`memoria_labores_${dateRange.start}_${dateRange.end}.pdf`);
                } catch (e) {
                    alert("Error al generar PDF.");
                    console.error(e);
                }
            };

            const downloadExcel = () => {
                try {
                    const data = filteredActivities.map(a => ({
                        'Fecha': a.date,
                        'Hora': a.time || '',
                        'Lugar/Comunidad': a.community || '',
                        'Actividad / Proyecto': a.title,
                        'Responsable': a.responsiblePerson || '',
                        'Renglón Presupuestario': a.budgetLine || '',
                        'NOG / NPG': a.nogNpg || '',
                        'Fuente Financiamiento': a.fundingSource || '',
                        'Código SNIP': a.snipCode || '',
                        'Eje PDM-OT': a.strategicAxis || '',
                        '% Avance Físico': (a.physicalProgress || 0) + '%',
                        'Descripción Circunstanciada': a.description || '',
                        'Beneficiarios Total': a.beneficiaries || 0,
                        'Hombres': a.beneficiariesMen || 0,
                        'Mujeres': a.beneficiariesWomen || 0,
                        'Niños/Jóvenes': a.beneficiariesChildren || 0,
                        'Costo (Q)': a.cost,
                        'Tipo': a.costType,
                        'Donante / Cooperación': a.donor || '',
                        'Instituciones Colaboradoras': a.collaborators || '',
                        'Estado Auditoría': a.status
                    }));
                    const ws = XLSX.utils.json_to_sheet(data);
                    const wb = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(wb, ws, "Actividades");
                    XLSX.writeFile(wb, `actividades_${dateRange.start}_${dateRange.end}.xlsx`);
                } catch (e) {
                    alert("Error al generar Excel.");
                    console.error(e);
                }
            };

            const downloadWord = async () => {
                try {
                    const docxLib = window.docx;
                    if (!docxLib) throw new Error("Librería de Word no cargada");
                    const { Document, Packer, Paragraph, TextRun, Table, TableRow, TableCell, WidthType } = docxLib;

                    const rows = [
                        new TableRow({
                            children: [
                                new TableCell({ children: [new Paragraph({ children: [new TextRun({ text: "Fecha / Lugar", bold: true })] })] }),
                                new TableCell({ children: [new Paragraph({ children: [new TextRun({ text: "Actividad / Datos Legales (CGC)", bold: true })] })] }),
                                new TableCell({ children: [new Paragraph({ children: [new TextRun({ text: "Metas / Impacto", bold: true })] })] }),
                                new TableCell({ children: [new Paragraph({ children: [new TextRun({ text: "Finanzas / Avance", bold: true })] })] }),
                            ],
                        }),
                    ];

                    filteredActivities.forEach(a => {
                        rows.push(new TableRow({
                            children: [
                                new TableCell({ children: [new Paragraph(`${a.date}\n${a.community || "Puerto Barrios"}`)] }),
                                new TableCell({
                                    children: [new Paragraph({
                                        children: [
                                            new TextRun({ text: a.title, bold: true }),
                                            new TextRun({ text: `\n\nResponsable: ${a.responsiblePerson || user.name}\nRenglón: ${a.budgetLine || "N/A"}\nNOG/NPG: ${a.nogNpg || "N/A"}\nFuente: ${a.fundingSource || ""}\nSNIP: ${a.snipCode || ""}`, size: 18 })
                                        ]
                                    })]
                                }),
                                new TableCell({ children: [new Paragraph(`Total: ${a.beneficiaries}\n(H:${a.beneficiariesMen}/M:${a.beneficiariesWomen}/N:${a.beneficiariesChildren})`)] }),
                                new TableCell({ children: [new Paragraph(`Q${a.cost.toLocaleString()}\n${a.physicalProgress}% Avance Físico`)] }),
                            ],
                        }));
                    });

                    const doc = new Document({
                        sections: [{
                            properties: {
                                page: {
                                    margin: { top: 720, right: 720, bottom: 720, left: 720 },
                                },
                            },
                            children: [
                                new Paragraph({
                                    children: [new TextRun({ text: user.institution, bold: true, size: 32 })],
                                }),
                                new Paragraph({
                                    children: [new TextRun({ text: "Reporte de Actividades", bold: true, size: 28 })],
                                }),
                                new Paragraph({ text: `Período: ${dateRange.start} a ${dateRange.end}` }),
                                new Paragraph({ text: "" }),
                                new Table({
                                    width: { size: 100, type: WidthType.PERCENTAGE },
                                    rows: rows,
                                }),
                            ],
                        }],
                    });

                    const blob = await Packer.toBlob(doc);
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    a.href = url;
                    a.download = `actividades_${dateRange.start}_${dateRange.end}.docx`;
                    a.click();
                    URL.revokeObjectURL(url);
                } catch (e) {
                    alert("Error al generar Word: " + e.message);
                    console.error(e);
                }
            };

            return (
                <div className="space-y-6 max-w-6xl mx-auto">
                    <div className="flex flex-col md:flex-row justify-between items-end gap-4">
                        <div>
                            <h2 className="text-2xl font-bold text-gray-800">Resumen y Estadísticas CGC</h2>
                            <p className="text-sm text-gray-500">Indicadores de transparencia y gestión municipal</p>
                        </div>

                        <div className="flex items-center space-x-2 bg-white p-2 rounded-lg shadow-sm border">
                            <input type="date" value={dateRange.start} onChange={e => setDateRange({ ...dateRange, start: e.target.value })} className="border rounded p-1 text-sm" />
                            <span className="text-gray-400">-</span>
                            <input type="date" value={dateRange.end} onChange={e => setDateRange({ ...dateRange, end: e.target.value })} className="border rounded p-1 text-sm" />
                        </div>

                        <div className="flex items-center space-x-2">
                            <button onClick={downloadPDF} title="PDF" className="bg-red-600 text-white p-2 rounded-lg hover:bg-red-700 transition shadow-md">
                                <Icon name="file-text" size={20} />
                            </button>
                            <button onClick={downloadExcel} title="Excel" className="bg-emerald-600 text-white p-2 rounded-lg hover:bg-emerald-700 transition shadow-md">
                                <Icon name="file-spreadsheet" size={20} />
                            </button>
                            <button onClick={downloadWord} title="Word" className="bg-blue-600 text-white p-2 rounded-lg hover:bg-blue-700 transition shadow-md">
                                <Icon name="file-text" size={20} />
                            </button>
                            <span className="text-xs font-bold text-gray-500 uppercase ml-2">Exportar</span>
                        </div>
                    </div>

                    {/* Stats Grid */}
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                            <div className="flex items-center gap-4">
                                <div className="p-3 bg-blue-100 rounded-lg text-blue-600"><Icon name="activity" /></div>
                                <div>
                                    <p className="text-sm text-gray-500 font-medium whitespace-nowrap">Actividades</p>
                                    <p className="text-2xl font-bold text-gray-900">{stats.total}</p>
                                </div>
                            </div>
                        </div>
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                            <div className="flex items-center gap-4">
                                <div className="p-3 bg-emerald-100 rounded-lg text-emerald-600"><Icon name="users" /></div>
                                <div>
                                    <p className="text-sm text-gray-500 font-medium whitespace-nowrap">Beneficiarios</p>
                                    <p className="text-2xl font-bold text-gray-900">{stats.beneficiaries.toLocaleString()}</p>
                                </div>
                            </div>
                        </div>
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                            <div className="flex items-center gap-4">
                                <div className="p-3 bg-purple-100 rounded-lg text-purple-600"><Icon name="banknote" /></div>
                                <div>
                                    <p className="text-sm text-gray-500 font-medium whitespace-nowrap">Inversión (Q)</p>
                                    <p className="text-2xl font-bold text-gray-900">Q{stats.cost.toLocaleString()}</p>
                                </div>
                            </div>
                        </div>
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                            <div className="flex items-center gap-4">
                                <div className="p-3 bg-orange-100 rounded-lg text-orange-600"><Icon name="trending-up" /></div>
                                <div>
                                    <p className="text-sm text-gray-500 font-medium whitespace-nowrap">% Avance Físico</p>
                                    <p className="text-2xl font-bold text-gray-900">{Math.round(stats.avgProgress)}%</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Charts Grid */}
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        {/* Demo/Stats Chart */}
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                            <h3 className="font-bold text-gray-700 mb-6 flex items-center gap-2">
                                <Icon name="users" size={18} className="text-emerald-500" />
                                Impacto Demográfico (Metas)
                            </h3>
                            <div className="h-64 w-full">
                                <SafeResponsiveContainer width="100%" height="100%">
                                    <SafeBarChart data={demographicData}>
                                        <SafeCartesianGrid strokeDasharray="3 3" vertical={false} />
                                        <SafeXAxis dataKey="name" />
                                        <SafeYAxis />
                                        <SafeTooltip />
                                        <SafeBar dataKey="value" radius={[4, 4, 0, 0]} />
                                    </SafeBarChart>
                                </SafeResponsiveContainer>
                            </div>
                        </div>

                        {/* Funding Chart */}
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                            <h3 className="font-bold text-gray-700 mb-6 flex items-center gap-2">
                                <Icon name="pie-chart" size={18} className="text-blue-500" />
                                Distribución de Inversión por Fuente
                            </h3>
                            <div className="h-64 w-full">
                                <SafeResponsiveContainer width="100%" height="100%">
                                    <SafePieChart>
                                        <SafePie
                                            data={fundingData}
                                            innerRadius={60}
                                            outerRadius={80}
                                            paddingAngle={5}
                                            dataKey="value"
                                        >
                                            {fundingData.map((entry, index) => (
                                                <SafeCell key={`cell-${index}`} fill={['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6'][index % 5]} />
                                            ))}
                                        </SafePie>
                                        <SafeTooltip formatter={(val) => `Q${val.toLocaleString()}`} />
                                    </SafePieChart>
                                </SafeResponsiveContainer>
                            </div>
                            <div className="grid grid-cols-2 gap-2 mt-2">
                                {fundingData.map((d, i) => (
                                    <div key={i} className="flex items-center gap-2 text-[10px] text-gray-500">
                                        <div className="w-2 h-2 rounded-full" style={{ backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6'][i % 5] }}></div>
                                        <span className="truncate">{d.name}: Q{d.value.toLocaleString()}</span>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Original Timeline Chart - Full Width */}
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100 lg:col-span-2">
                            <h3 className="font-bold text-gray-700 mb-6 flex items-center gap-2">
                                <Icon name="calendar" size={18} className="text-blue-600" />
                                Frecuencia de Actividades por Fecha
                            </h3>
                            <div className="h-64 w-full">
                                <SafeResponsiveContainer width="100%" height="100%">
                                    <SafeBarChart data={chartData}>
                                        <SafeCartesianGrid strokeDasharray="3 3" vertical={false} />
                                        <SafeXAxis dataKey="name" />
                                        <SafeYAxis allowDecimals={false} />
                                        <SafeTooltip />
                                        <SafeBar dataKey="count" fill="#3b82f6" radius={[4, 4, 0, 0]} />
                                    </SafeBarChart>
                                </SafeResponsiveContainer>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const NotesView = () => {
            const { notes, addNote, updateNote, deleteNote } = useContext(AppContext);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editingNote, setEditingNote] = useState(null);
            const [search, setSearch] = useState('');

            const colors = [
                { name: 'Amarillo', bg: 'bg-yellow-100', border: 'border-yellow-200', text: 'text-yellow-800' },
                { name: 'Azul', bg: 'bg-blue-100', border: 'border-blue-200', text: 'text-blue-800' },
                { name: 'Verde', bg: 'bg-emerald-100', border: 'border-emerald-200', text: 'text-emerald-800' },
                { name: 'Rosa', bg: 'bg-rose-100', border: 'border-rose-200', text: 'text-rose-800' },
                { name: 'Morado', bg: 'bg-purple-100', border: 'border-purple-200', text: 'text-purple-800' }
            ];

            const [form, setForm] = useState({
                content: '',
                color: colors[0].bg,
                pinned: false
            });

            const filteredNotes = useMemo(() => {
                const results = notes.filter(n =>
                    n.content.toLowerCase().includes(search.toLowerCase())
                );
                return results.sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));
            }, [notes, search]);

            const openModal = (note = null) => {
                if (note) {
                    setEditingNote(note);
                    setForm(note);
                } else {
                    setEditingNote(null);
                    setForm({ content: '', color: colors[0].bg, pinned: false });
                }
                setIsModalOpen(true);
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (editingNote) {
                    updateNote(form);
                } else {
                    addNote(form);
                }
                setIsModalOpen(false);
            };

            const togglePin = (note) => {
                updateNote({ ...note, pinned: !note.pinned });
            };

            return (
                <div className="max-w-6xl mx-auto space-y-6">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <h2 className="text-2xl font-bold text-gray-800">Notas y Recordatorios</h2>
                            <p className="text-gray-500">Manten tus ideas y pendientes organizados.</p>
                        </div>
                        <div className="flex items-center gap-2 w-full md:w-auto">
                            <div className="relative flex-1 md:w-64">
                                <Icon name="search" size={18} className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" />
                                <input
                                    type="text"
                                    placeholder="Buscar notas..."
                                    className="w-full pl-10 pr-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                    value={search}
                                    onChange={e => setSearch(e.target.value)}
                                />
                            </div>
                            <button onClick={() => openModal()} className="bg-blue-600 text-white px-4 py-2 rounded-lg flex items-center gap-2 shadow-lg hover:bg-blue-700 transition">
                                <Icon name="plus" size={18} />
                                <span className="hidden sm:inline">Nueva Nota</span>
                            </button>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                        {filteredNotes.length === 0 ? (
                            <div className="col-span-full py-20 bg-white rounded-2xl border-2 border-dashed border-gray-200 flex flex-col items-center justify-center text-center">
                                <div className="p-4 bg-gray-50 rounded-full mb-4">
                                    <Icon name="edit-3" size={48} className="text-gray-300" />
                                </div>
                                <p className="text-gray-500 font-medium">No hay notas encontradas.</p>
                                <button onClick={() => openModal()} className="mt-4 text-blue-600 font-bold hover:underline">Crear mi primera nota</button>
                            </div>
                        ) : filteredNotes.map(note => {
                            const colorScheme = colors.find(c => c.bg === note.color) || colors[0];
                            return (
                                <div
                                    key={note.id}
                                    className={`${colorScheme.bg} ${colorScheme.border} border-2 rounded-2xl p-5 shadow-sm hover:shadow-md transition relative group animate-fade-in flex flex-col min-h-[160px]`}
                                >
                                    <div className="flex justify-between items-start mb-2">
                                        <button
                                            onClick={() => togglePin(note)}
                                            className={`${note.pinned ? 'text-blue-600' : 'text-gray-400 opacity-0 group-hover:opacity-100'} transition`}
                                        >
                                            <Icon name="pin" size={18} />
                                        </button>
                                        <div className="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition">
                                            <button onClick={() => openModal(note)} className="p-1 hover:bg-black/5 rounded text-gray-600"><Icon name="edit-2" size={16} /></button>
                                            <button onClick={() => { if (confirm('¿Eliminar nota?')) deleteNote(note.id) }} className="p-1 hover:bg-black/5 rounded text-red-600"><Icon name="trash-2" size={16} /></button>
                                        </div>
                                    </div>
                                    <div className={`whitespace-pre-wrap flex-1 ${colorScheme.text} text-sm font-medium leading-relaxed`}>
                                        {note.content}
                                    </div>
                                    <div className="mt-4 text-[10px] uppercase tracking-wider opacity-40 font-bold">
                                        {new Date(note.date).toLocaleDateString()} {new Date(note.date).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                    {isModalOpen && (
                        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
                            <div className="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden animate-scale-in">
                                <div className="p-6 border-b flex justify-between items-center bg-gray-50">

                            <button onClick={() => setShowBubble(false)} className="absolute -top-2 -right-2 bg-gray-200 rounded-full p-1 text-gray-500 hover:bg-gray-300">
                                <Icon name="x" size={12} />

                    <button

                    >
                        <div className="absolute inset-0 bg-white/20 opacity-0 group-hover:opacity-100 transition"></div>
                        <Icon name="shield-check" size={32} className="relative z-10" />
                        <div className="absolute -top-1 -right-1 w-5 h-5 bg-red-500 rounded-full border-2 border-white animate-pulse"></div>

                </div>

        };
        const DirectoryView = () => {

                { category: 'emergency', name: 'Policía Nacional Civil (PNC)', phone: '110', extra: 'Emergencias Nacional', official: 'Comisaría 61 Izabal', social: { fb: 'https://www.facebook.com/pncdeguatemala/' } },

                { category: 'emergency', name: 'IGSS Emergencias', phone: '1522', extra: 'Hospital Hosp. Puerto Barrios: 7948-7696', official: 'Seguridad Social', social: { fb: 'https://www.facebook.com/noticiasigss/' } },
                { category: 'emergency', name: 'Comando Naval del Caribe', phone: '7960-0855', extra: 'Marina de Guerra', official: 'Puerto Barrios', social: { fb: 'https://www.facebook.com/EjercitoGt/' } },

                // GOVERNMENT
                { category: 'gov', name: 'Municipalidad de Puerto Barrios', phone: '7948-0785', extra: '15 calle 5ta. y 6ta. Ave.', official: 'Alcalde Hugo Sarceño', social: { fb: 'https://www.facebook.com/munipuertobarrios/', ig: 'https://www.instagram.com/munipuertobarrios/' } },
                { category: 'gov', name: 'Gobernación Departamental Izabal', phone: '7790-9300', extra: '7ma. calle, 1ra. ave. final', official: 'Gobernador Departamental', social: { fb: 'https://www.facebook.com/GobernacionIzabal/' } },
                { category: 'gov', name: 'DIDEDUC Izabal (Educación)', phone: '7948-0009', extra: '20 ave. entre 13 y 14 calle', official: 'Director Departamental', social: { fb: 'https://www.facebook.com/AsesorisDideducIzabal/' } },
                { category: 'gov', name: 'Ministerio Público (MP)', phone: '7956-0650', extra: '9a. Ave. entre 9a. y 10a. Calle', official: 'Fiscalía de Distrito', social: { fb: 'https://www.facebook.com/mpguatemala/' } },
                { category: 'gov', name: 'Dirección Área de Salud Izabal', phone: '7948-7355', extra: '15 Calle 14 y 15 Avenue', official: 'MSPAS', social: { fb: 'https://www.facebook.com/MSPASGuate/' } },
                { category: 'gov', name: 'MAGA (Agricultura)', phone: '7948-6553', extra: '5a. Ave. 19 calle Esquina', official: 'Delegación Izabal', social: { fb: 'https://www.facebook.com/Magaguate/' } },
                { category: 'gov', name: 'Administración Complejo Judicial', phone: '7942-9218', extra: '13 calle 8ª avenida', official: 'Organismo Judicial', social: { fb: 'https://www.facebook.com/organismojudicial/' } }

            return (

                            <select

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

                            <div key={idx} className={`bg-white rounded-2xl border-l-4 ${contact.category === 'emergency' ? 'border-l-red-500 shadow-red-50' : 'border-l-blue-500 shadow-blue-50'} shadow-lg p-5 flex flex-col hover:scale-[1.02] transition duration-300 group`}>
                                <div className="flex justify-between items-start mb-3">
                                    <div className={`p-2 rounded-lg ${contact.category === 'emergency' ? 'bg-red-100 text-red-600' : 'bg-blue-100 text-blue-600'}`}>

                                <div className="mt-auto pt-4 border-t border-gray-100">

                    {filteredContacts.length === 0 && (

                        </div>
                    )}
                </div>
            );
        };


        const CalendarView = () => {
            const { activities, addActivity } = useContext(AppContext);
            const today = new Date();
            const [currentMonth, setCurrentMonth] = useState(today.getMonth());
            const [currentYear, setCurrentYear] = useState(today.getFullYear());
            const [selectedDateModal, setSelectedDateModal] = useState(null);

            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            const firstDay = new Date(currentYear, currentMonth, 1).getDay(); // 0 = Sun

            const days = [];
            for (let i = 0; i < firstDay; i++) days.push(null);
            for (let i = 1; i <= daysInMonth; i++) days.push(i);

            const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

            const getActsForDay = (day) => {
                if (!day) return [];
                const dStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                // More robust comparison in case date has time info or is slightly different format
                return activities.filter(a => a.date && (a.date === dStr || a.date.startsWith(dStr)));
            };

            const changeMonth = (delta) => {
                let newM = currentMonth + delta;
                let newY = currentYear;
                if (newM < 0) { newM = 11; newY--; }
                if (newM > 11) { newM = 0; newY++; }
                setCurrentMonth(newM);
                setCurrentYear(newY);
            };

            const handleDayClick = (day) => {
                if (!day) return;
                const dStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                setSelectedDateModal(dStr);
            };

            return (
                <div className="bg-white rounded-xl shadow-lg overflow-hidden h-full flex flex-col relative">
                    <div className="p-4 bg-gray-50 border-b flex justify-between items-center">
                        <h2 className="text-xl font-bold text-gray-800 capitalize">{monthNames[currentMonth]} {currentYear}</h2>
                        <div className="space-x-2">
                            <button onClick={() => changeMonth(-1)} className="p-2 hover:bg-gray-200 rounded-full"><Icon name="chevron-left" /></button>
                            <button onClick={() => changeMonth(1)} className="p-2 hover:bg-gray-200 rounded-full"><Icon name="chevron-right" /></button>
                        </div>
                    </div>
                    <div className="grid grid-cols-7 bg-gray-100 flex-1 overflow-auto">
                        {["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"].map(d => (
                            <div key={d} className="p-2 text-center text-sm font-bold text-gray-500 uppercase border-b bg-gray-50 sticky top-0">{d}</div>
                        ))}
                        {days.map((day, i) => {
                            const acts = getActsForDay(day);
                            return (
                                <div key={i}
                                    onClick={() => handleDayClick(day)}
                                    className={`min-h-[100px] border-r border-b p-2 hover:bg-blue-50 transition cursor-pointer flex flex-col ${!day ? 'bg-gray-50' : 'bg-white'}`}
                                >
                                    {day && (
                                        <>
                                            <span className={`text-sm font-semibold mb-1 w-7 h-7 flex items-center justify-center rounded-full ${day === today.getDate() && currentMonth === today.getMonth() && currentYear === today.getFullYear()
                                                ? 'bg-blue-600 text-white' : 'text-gray-700'
                                                }`}>{day}</span>
                                            <div className="flex-1 space-y-1 overflow-hidden">
                                                {acts.map(a => (
                                                    <div key={a.id} className={`text-[10px] px-1 py-0.5 rounded truncate text-white ${a.status === 'Programada' ? 'bg-orange-500' : 'bg-blue-500'}`}>
                                                        {a.title}
                                                    </div>
                                                ))}
                                            </div>
                                        </>
                                    )}
                                </div>
                            );
                        })}
                    </div>

                    {/* Quick Add Modal */}
                    {selectedDateModal && (
                        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
                                <div className="p-6 border-b flex justify-between items-center bg-gray-50 sticky top-0">
                                    <h3 className="text-xl font-bold">Actividad para {selectedDateModal}</h3>
                                    <button onClick={() => setSelectedDateModal(null)} className="p-2 hover:bg-gray-200 rounded-full text-gray-500"><Icon name="x" /></button>
                                </div>
                                <div className="p-6">
                                    <ActivityForm
                                        initialData={{
                                            title: '', description: '', beneficiaries: 0,
                                            cost: 0, costType: 'Institution',
                                            donor: '', collaborators: '',
                                            date: selectedDateModal, // Pre-fill date
                                            time: '12:00',
                                            images: [],
                                            status: new Date(selectedDateModal) > new Date() ? 'Programada' : 'Realizada' // Auto-detect status
                                        }}
                                        onSubmit={(data) => {
                                            addActivity(data);
                                            setSelectedDateModal(null);
                                        }}
                                        onCancel={() => setSelectedDateModal(null)}
                                    />
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const NewsView = () => {
            const { news, addNews, updateNews, deleteNews } = useContext(AppContext);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editingItem, setEditingItem] = useState(null);

            const [form, setForm] = useState({
                title: '', date: new Date().toISOString().split('T')[0],
                content: '', image: null, facebookLink: ''
            });

            const openModal = (item = null) => {
                if (item) {
                    setEditingItem(item);
                    setForm(item);
                } else {
                    setEditingItem(null);
                    setForm({
                        title: '', date: new Date().toISOString().split('T')[0],
                        content: '', image: null, facebookLink: ''
                    });
                }
                setIsModalOpen(true);
            };

            const handleImage = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                try {
                    const compressed = await compressImage(file, 800, 0.7);
                    setForm(prev => ({ ...prev, image: compressed }));
                } catch (err) {
                    console.error(err);
                }
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (editingItem) {
                    updateNews(form);
                } else {
                    addNews(form);
                }
                setIsModalOpen(false);
            };

            return (
                <div className="max-w-5xl mx-auto space-y-6">
                    <div className="flex justify-between items-center">
                        <div>
                            <h2 className="text-2xl font-bold text-gray-800">Noticias Institucionales</h2>
                            <p className="text-gray-500">Gestiona las novedades y comunicados.</p>
                        </div>
                        <button onClick={() => openModal()} className="bg-blue-600 text-white px-4 py-2 rounded-lg flex items-center space-x-2 shadow hover:bg-blue-700 transition">
                            <Icon name="plus" size={18} />
                            <span>Nueva Noticia</span>
                        </button>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        {news.length === 0 ? (
                            <div className="col-span-full text-center py-20 bg-white rounded-xl border border-dashed border-gray-300">
                                <Icon name="newspaper" size={48} className="mx-auto text-gray-300 mb-4" />
                                <p className="text-gray-500">No hay noticias registradas.</p>
                            </div>
                        ) : news.map(n => (
                            <div key={n.id} className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col group hover:shadow-md transition">
                                {n.image ? (
                                    <div className="h-48 overflow-hidden relative">
                                        <img src={n.image} className="w-full h-full object-cover group-hover:scale-105 transition duration-500" />
                                    </div>
                                ) : (
                                    <div className="h-48 bg-gradient-to-br from-blue-50 to-indigo-50 flex items-center justify-center">
                                        <Icon name="image" size={48} className="text-blue-200" />
                                    </div>
                                )}

                                <div className="p-6 flex-1 flex flex-col">
                                    <div className="flex justify-between items-start mb-2">
                                        <h3 className="font-bold text-lg text-gray-800 line-clamp-2 leading-tight">{n.title}</h3>
                                    </div>
                                    <span className="text-xs text-blue-600 font-bold uppercase tracking-wider mb-3 block">{n.date}</span>
                                    <p className="text-gray-600 text-sm line-clamp-3 mb-4 flex-1">{n.content}</p>

                                    {n.facebookLink && (
                                        <a href={n.facebookLink} target="_blank" rel="noopener noreferrer" className="inline-flex items-center text-blue-600 hover:text-blue-800 text-sm font-bold mb-4">
                                            <Icon name="facebook" size={16} className="mr-1" /> Ver en Facebook
                                        </a>
                                    )}

                                    <div className="flex space-x-2 border-t pt-4 mt-auto">
                                        <button onClick={() => openModal(n)} className="flex-1 py-2 text-sm font-bold text-blue-600 hover:bg-blue-50 border border-blue-100 rounded transition">Editar</button>
                                        <button onClick={() => { if (confirm('¿Borrar noticia?')) deleteNews(n.id) }} className="flex-1 py-2 text-sm font-bold text-red-600 hover:bg-red-50 border border-red-100 rounded transition">Eliminar</button>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>

                    {/* Modal */}
                    {isModalOpen && (
                        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto animate-fade-in">
                                <div className="p-6 border-b flex justify-between items-center bg-gray-50 sticky top-0">
                                    <h3 className="text-xl font-bold">{editingItem ? 'Editar Noticia' : 'Nueva Noticia'}</h3>
                                    <button onClick={() => setIsModalOpen(false)}><Icon name="x" /></button>
                                </div>
                                <form onSubmit={handleSubmit} className="p-6 space-y-4">
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">Título</label>
                                        <input required className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                            value={form.title} onChange={e => setForm({ ...form, title: e.target.value })} placeholder="Título de la noticia" />
                                    </div>

                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">Fecha</label>
                                        <input required type="date" className="w-full p-3 border rounded-lg"
                                            value={form.date} onChange={e => setForm({ ...form, date: e.target.value })} />
                                    </div>

                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">Contenido</label>
                                        <textarea required rows="4" className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                            value={form.content} onChange={e => setForm({ ...form, content: e.target.value })} placeholder="Descripción del evento o comunicado..." />
                                    </div>

                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">Imagen (Opcional)</label>
                                        <div className="border border-gray-300 rounded-lg p-2 flex items-center space-x-4">
                                            {form.image && <img src={form.image} className="h-12 w-12 object-cover rounded" />}
                                            <input type="file" onChange={handleImage} className="text-sm w-full" accept="image/*" />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">Enlace a Facebook (Opcional)</label>
                                        <div className="relative">
                                            <Icon name="facebook" className="absolute left-3 top-3.5 text-gray-400" size={18} />
                                            <input type="url" className="w-full p-3 pl-10 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                                value={form.facebookLink} onChange={e => setForm({ ...form, facebookLink: e.target.value })} placeholder="https://facebook.com/post..." />
                                        </div>
                                    </div>

                                    <div className="pt-4 flex justify-end space-x-3">
                                        <button type="button" onClick={() => setIsModalOpen(false)} className="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg">Cancelar</button>
                                        <button type="submit" className="px-6 py-2 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 transition">
                                            {editingItem ? 'Actualizar Noticia' : 'Guardar Noticia'}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const SettingsView = () => {
            const { user, exportData, importData } = useContext(AppContext);

            const handleExport = () => {
                exportData();
            };

            const handleImport = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    importData(event.target.result);
                    e.target.value = ''; // Reset input
                };
                reader.readAsText(file);
            };

            return (
                <div className="max-w-2xl mx-auto space-y-8 animate-fade-in">
                    <h2 className="text-2xl font-bold text-gray-800">Copia de Seguridad y Datos</h2>

                    <div className="bg-white p-8 rounded-xl shadow-lg border-l-4 border-blue-600">
                        <div className="flex items-start space-x-4">
                            <div className="p-3 bg-blue-100 rounded-full text-blue-600">
                                <Icon name="download" size={32} />
                            </div>
                            <div className="flex-1">
                                <h3 className="text-xl font-bold text-gray-800 mb-2">Exportar Datos</h3>
                                <p className="text-gray-600 mb-4">
                                    Descarga un archivo con toda tu información (Actividades, Documentos, Noticias, Perfil).
                                    Guarda este archivo en un lugar seguro o envíalo a tu celular.
                                </p>
                                <button onClick={handleExport} className="bg-blue-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-blue-700 transition w-full md:w-auto">
                                    Generar Respaldo
                                </button>
                            </div>
                        </div>
                    </div>

                    <div className="bg-white p-8 rounded-xl shadow-lg border-l-4 border-green-600">
                        <div className="flex items-start space-x-4">
                            <div className="p-3 bg-green-100 rounded-full text-green-600">
                                <Icon name="upload" size={32} />
                            </div>
                            <div className="flex-1">
                                <h3 className="text-xl font-bold text-gray-800 mb-2">Restaurar Datos</h3>
                                <p className="text-gray-600 mb-4">
                                    Sube el archivo de respaldo para complementar tu base de datos actual.
                                    <span className="text-blue-500 font-bold block mt-1">Sincronización: Los datos nuevos se añadirán y los existentes se actualizarán.</span>
                                </p>
                                <label className="block w-full md:w-auto">
                                    <span className="sr-only">Elegir archivo</span>
                                    <input type="file" accept=".json" onChange={handleImport}
                                        className="block w-full text-sm text-gray-500
                                        file:mr-4 file:py-2 file:px-4
                                        file:rounded-lg file:border-0
                                        file:text-sm file:font-semibold
                                        file:bg-green-50 file:text-green-700
                                        hover:file:bg-green-100 cursor-pointer"
                                    />
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            return (
                <AppProvider>
                    <MainRouter />
                </AppProvider>
            );
        };

        const MainRouter = () => {
            const { user } = useContext(AppContext);
            return user ? <Dashboard /> : <LoginScreen />;
        };

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);

        // Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker registrado con éxito:', reg.scope))
                    .catch(err => console.log('Fallo al registrar el Service Worker:', err));
            });
        }
    </script>
</body>

</html>
