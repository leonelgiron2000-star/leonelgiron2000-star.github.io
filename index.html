                                                    <input placeholder="Escolaridad" className="w-full p-2 border rounded text-sm" value={child.education} onChange={e => updateChild(index, 'education', e.target.value)} />
                                                </div>
                                                <button type="button" onClick={() => removeChild(index)} className="p-2 text-red-500 hover:bg-red-100 rounded">
                                                    <Icon name="trash-2" size={16} />
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}

                        <div className="mt-8 pt-4 border-t flex justify-end gap-3">
                            <button type="button" onClick={onCancel} className="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg transition font-medium">Cancelar</button>
                            <button type="submit" className="bg-blue-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-blue-700 transition shadow-lg">
                                Guardar Registro
                            </button>
                        </div>
                    </form>
                </div>
            );
        };

        // --- VIEWS ---


        const ActivityForm = ({ initialData, onSubmit, onCancel }) => {
            const [form, setForm] = useState(initialData || {
                title: '', description: '', beneficiaries: 0,
                beneficiariesMen: 0, beneficiariesWomen: 0, beneficiariesChildren: 0,
                cost: 0, costType: 'Institution',
                budgetLine: '', fundingSource: 'Fuentes Propias',
                snipCode: '', strategicAxis: '', physicalProgress: 0,
                community: '', donor: '', collaborators: '',
                date: new Date().toISOString().split('T')[0], time: '12:00',
                images: [], status: 'Realizada'
            });

            const handleImage = async (e) => {
                const files = Array.from(e.target.files);
                if (files.length > 0) {
                    try {
                        const compressedFiles = await Promise.all(
                            files.map(file => compressImage(file, 800, 0.7))
                        );
                        setForm(prev => ({ ...prev, images: [...prev.images, ...compressedFiles] }));
                    } catch (err) {
                        console.error("Error compression", err);
                    }
                }
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                // Ensure beneficiaries total is correct
                const total = (parseInt(form.beneficiariesMen) || 0) + (parseInt(form.beneficiariesWomen) || 0) + (parseInt(form.beneficiariesChildren) || 0);
                onSubmit({ ...form, beneficiaries: total > 0 ? total : form.beneficiaries });
            };

            return (
                <form onSubmit={handleSubmit} className="space-y-8">
                    {/* Section 1: Información General */}
                    <div className="bg-gray-50/50 p-6 rounded-xl border border-gray-100">
                        <h3 className="text-gray-900 font-bold mb-4 flex items-center gap-2">
                            <Icon name="info" size={18} className="text-blue-600" />
                            Información General de la Actividad
                        </h3>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div className="md:col-span-2">
                                <label className="block text-sm font-medium text-gray-700 mb-1">Nombre de la Actividad / Proyecto</label>
                                <input required className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                    value={form.title} onChange={e => setForm({ ...form, title: e.target.value })}
                                    placeholder="Nombre oficial del proyecto o actividad" />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Lugar / Comunidad (Puerto Barrios)</label>
                                <input required className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                    value={form.community} onChange={e => setForm({ ...form, community: e.target.value })}
                                    placeholder="Barrio, Aldea o Caserío" />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Fecha y Hora</label>
                                <div className="grid grid-cols-2 gap-2">
                                    <input required type="date" className="w-full p-3 border border-gray-300 rounded-lg"
                                        value={form.date} onChange={e => setForm({ ...form, date: e.target.value })} />
                                    <input required type="time" className="w-full p-3 border border-gray-300 rounded-lg"
                                        value={form.time} onChange={e => setForm({ ...form, time: e.target.value })} />
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Section 2: Transparencia y Presupuesto (CGC) */}
                    <div className="bg-blue-50/30 p-6 rounded-xl border border-blue-100">
                        <h3 className="text-blue-900 font-bold mb-4 flex items-center gap-2">
                            <Icon name="shield-check" size={18} className="text-blue-600" />
                            Transparencia y Ejecución Presupuestaria (CGC)
                        </h3>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Renglón Presupuestario</label>
                                <input required className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                    value={form.budgetLine} onChange={e => setForm({ ...form, budgetLine: e.target.value })}
                                    placeholder="Ej: 011, 189, 211" />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Fuente de Financiamiento</label>
                                <select className="w-full p-3 border border-gray-300 rounded-lg"
                                    value={form.fundingSource} onChange={e => setForm({ ...form, fundingSource: e.target.value })}>
                                    <option value="Fuentes Propias">Fuentes Propias / Ingresos Corrientes</option>
                                    <option value="Situado Constitucional">Situado Constitucional (Funcionamiento)</option>
                                    <option value="Situado Constitucional Inversión">Situado Constitucional (Inversión)</option>
                                    <option value="IVA-PAZ">IVA-PAZ</option>
                                    <option value="CODEDE">Aporte CODEDE</option>
                                    <option value="Donación">Donación Externa</option>
                                </select>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Estado de Ejecución</label>
                                <select className="w-full p-3 border border-gray-300 rounded-lg"
                                    value={form.status} onChange={e => setForm({ ...form, status: e.target.value })}>
                                    <option value="Realizada">Finalizada / Ejecutada</option>
                                    <option value="Programada">En Proceso / Programada</option>
                                </select>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Código SNIP (Si aplica)</label>
                                <input className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                    value={form.snipCode} onChange={e => setForm({ ...form, snipCode: e.target.value })}
                                    placeholder="Código de inversión" />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Eje Estratégico PDM-OT</label>
                                <input className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                    value={form.strategicAxis} onChange={e => setForm({ ...form, strategicAxis: e.target.value })}
                                    placeholder="Alineación estratégica" />
                            </div>
                            <div className="flex space-x-2">
                                <div className="flex-1">
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Costo (Q)</label>
                                    <input type="number" min="0" step="0.01" className="w-full p-3 border border-gray-300 rounded-lg"
                                        value={form.cost} onChange={e => setForm({ ...form, cost: parseFloat(e.target.value) })} />
                                </div>
                                <div className="w-24">
                                    <label className="block text-sm font-medium text-gray-700 mb-1">% Avance</label>
                                    <input type="number" min="0" max="100" className="w-full p-3 border border-gray-300 rounded-lg"
                                        value={form.physicalProgress} onChange={e => setForm({ ...form, physicalProgress: parseInt(e.target.value) })} />
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Section 3: Impacto Social y Beneficiarios */}
                    <div className="bg-emerald-50/30 p-6 rounded-xl border border-emerald-100">
                        <h3 className="text-emerald-900 font-bold mb-4 flex items-center gap-2">
                            <Icon name="users" size={18} className="text-emerald-600" />
                            Impacto Social y Beneficiarios (Metas)
                        </h3>
                        <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Hombres</label>
                                <input type="number" min="0" className="w-full p-3 border border-emerald-200 rounded-lg"
                                    value={form.beneficiariesMen} onChange={e => setForm({ ...form, beneficiariesMen: parseInt(e.target.value) })} />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Mujeres</label>
                                <input type="number" min="0" className="w-full p-3 border border-emerald-200 rounded-lg"
                                    value={form.beneficiariesWomen} onChange={e => setForm({ ...form, beneficiariesWomen: parseInt(e.target.value) })} />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Niños / Jóvenes</label>
                                <input type="number" min="0" className="w-full p-3 border border-emerald-200 rounded-lg"
                                    value={form.beneficiariesChildren} onChange={e => setForm({ ...form, beneficiariesChildren: parseInt(e.target.value) })} />
                            </div>
                            <div className="bg-emerald-100/50 p-3 rounded-lg flex flex-col justify-center text-center">
                                <span className="text-xs font-bold text-emerald-700 uppercase">Total Beneficiarios</span>
                                <span className="text-2xl font-black text-emerald-900">
                                    {(parseInt(form.beneficiariesMen) || 0) + (parseInt(form.beneficiariesWomen) || 0) + (parseInt(form.beneficiariesChildren) || 0)}
                                </span>
                            </div>
                        </div>
                        <div className="mt-4">
                            <label className="block text-sm font-medium text-gray-700 mb-1">Colaboradores / Instituciones de Apoyo</label>
                            <input className="w-full p-3 border border-emerald-200 rounded-lg"
                                placeholder="Ej: SESAN, MAGA, MSPAS, etc."
                                value={form.collaborators} onChange={e => setForm({ ...form, collaborators: e.target.value })} />
                        </div>
                    </div>

                    {/* Section 4: Descripción y Evidencia */}
                    <div className="space-y-4">
                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1 font-bold">Descripción Circunstanciada (Requerido por Auditoría)</label>
                            <textarea required rows="4" className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                placeholder="Describa de forma detallada el qué, cómo, cuándo y dónde de la actividad..."
                                value={form.description} onChange={e => setForm({ ...form, description: e.target.value })}></textarea>
                        </div>

                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1 font-bold">
                                Evidencia Fotográfica {form.status === 'Realizada' ? '(Mínimo 12 fotos sugeridas para CGC)' : '(Opcional)'}
                            </label>
                            <div className="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center hover:bg-gray-50 transition cursor-pointer relative shadow-inner">
                                <input type="file" multiple accept="image/*" onChange={handleImage} className="absolute inset-0 opacity-0 cursor-pointer z-10" />
                                <div className="pointer-events-none">
                                    <Icon name="upload-cloud" className="mx-auto text-blue-500 mb-2" size={32} />
                                    <p className="text-sm text-gray-500 font-medium">Cargar fotos de campo para transparencia</p>
                                    <p className="text-xs text-gray-400 mt-1">Soporta múltiples archivos a la vez</p>
                                </div>
                            </div>

                            {form.images && form.images.length > 0 && (
                                <div className="grid grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-2 mt-4">
                                    {form.images.map((img, idx) => (
                                        <div key={idx} className="relative aspect-square rounded-lg overflow-hidden border border-gray-200 group shadow-sm">
                                            <img src={img} className="w-full h-full object-cover" />
                                            <button
                                                type="button"
                                                onClick={() => setForm(prev => ({ ...prev, images: prev.images.filter((_, i) => i !== idx) }))}
                                                className="absolute top-1 right-1 bg-red-500 text-white p-1 rounded-full opacity-0 group-hover:opacity-100 transition shadow-sm z-20"
                                            >
                                                <Icon name="x" size={10} />
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>

                    <div className="flex justify-end space-x-3 pt-6 border-t">
                        {onCancel && (
                            <button type="button" onClick={onCancel} className="bg-gray-200 text-gray-700 px-6 py-3 rounded-lg font-bold hover:bg-gray-300 transition">
                                Cancelar
                            </button>
                        )}
                        <button type="submit" className="bg-blue-600 text-white px-10 py-3 rounded-lg font-extrabold hover:bg-blue-700 shadow-xl transition transform hover:scale-105">
                            {initialData ? 'Actualizar Registro CGC' : 'Finalizar Registro de Transparencia'}
                        </button>
                    </div>
                </form>
            );
        };

        const ActivitiesView = () => {
            const { activities, addActivity, updateActivity, deleteActivity } = useContext(AppContext);
            const [mode, setMode] = useState('list'); // list | create | edit
            const [editingActivity, setEditingActivity] = useState(null);

            const handleCreate = (formData) => {
                if (mode === 'edit') {
                    updateActivity(formData);
                } else {
                    addActivity(formData);
                }
                setMode('list');
                setEditingActivity(null);
            };

            const handleEdit = (act) => {
                setEditingActivity(act);
                setMode('edit');
            };

            const handleDelete = (id) => {
                if (confirm('¿Estás seguro de que deseas eliminar esta actividad?')) {
                    deleteActivity(id);
                }
            };

            return (
                <div className="max-w-6xl mx-auto">
                    <div className="flex justify-between items-center mb-6">
                        <h2 className="text-2xl font-bold text-gray-800">Cápitulo de Gestión</h2>
                        {mode === 'list' && (
                            <button onClick={() => setMode('create')} className="bg-blue-600 text-white px-4 py-2 rounded-lg flex items-center space-x-2 text-sm font-medium hover:bg-blue-700 shadow-lg">
                                <Icon name="plus" size={18} />
                                <span>Nueva Actividad</span>
                            </button>
                        )}
                        {(mode === 'create' || mode === 'edit') && (
                            <button onClick={() => { setMode('list'); setEditingActivity(null); }} className="text-gray-600 px-4 py-2 rounded-lg flex items-center space-x-2 text-sm font-medium hover:bg-gray-200">
                                <Icon name="arrow-left" size={18} />
                                <span>Volver a la lista</span>
                            </button>
                        )}
                    </div>

                    {mode === 'list' ? (
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            {activities.length === 0 ? (
                                <div className="col-span-full py-20 text-center text-gray-500 bg-white rounded-xl border border-dashed border-gray-300">
                                    <Icon name="clipboard-list" size={48} className="mx-auto mb-4 text-gray-300" />
                                    <p>No hay actividades registradas aún.</p>
                                </div>
                            ) : activities.map((act) => (
                                <div key={act.id} className={`bg-white rounded-xl shadow-sm hover:shadow-md transition overflow-hidden border border-gray-100 flex flex-col ${act.status === 'Programada' ? 'border-l-4 border-l-orange-400' : ''}`}>
                                    <div className="h-48 bg-gray-200 relative group">
                                        {act.images && act.images.length > 0 ? (
                                            <>
                                                <img src={act.images[0]} className="w-full h-full object-cover" />
                                                {act.images.length > 1 && (
                                                    <div className="absolute bottom-2 right-2 bg-black/60 text-white px-2 py-1 rounded text-xs font-bold flex items-center gap-1">
                                                        <Icon name="image" size={12} />
                                                        <span>+{act.images.length - 1}</span>
                                                    </div>
                                                )}
                                            </>
                                        ) : act.image ? (
                                            <img src={act.image} className="w-full h-full object-cover" />
                                        ) : (
                                            <div className="w-full h-full flex items-center justify-center text-gray-400 bg-gray-100">
                                                <div className="text-center">
                                                    <Icon name={act.status === 'Programada' ? 'calendar-clock' : 'image'} size={32} className="mx-auto mb-2 opacity-50" />
                                                    {act.status === 'Programada' && <span className="text-xs font-medium">Programada</span>}
                                                </div>
                                            </div>
                                        )}
                                        <div className="absolute top-2 right-2 bg-white/90 px-2 py-1 rounded text-xs font-bold shadow-sm">
                                            {act.date}
                                        </div>
                                    </div>
                                    <div className="p-5 flex-1 flex flex-col">
                                        <div className="flex justify-between items-start mb-2">
                                            <div>
                                                <h3 className="font-bold text-lg text-gray-800 leading-tight">{act.title}</h3>
                                                <div className="flex items-center gap-2 mt-1">
                                                    <span className="bg-blue-100 text-blue-700 text-[10px] font-bold px-2 py-0.5 rounded flex items-center gap-1">
                                                        <Icon name="tag" size={10} />
                                                        Renglón {act.budgetLine || '---'}
                                                    </span>
                                                    {act.community && (
                                                        <span className="text-gray-500 text-[10px] font-medium flex items-center gap-1">
                                                            <Icon name="map-pin" size={10} />
                                                            {act.community}
                                                        </span>
                                                    )}
                                                </div>
                                            </div>
                                            {act.status === 'Programada' && <span className="bg-orange-100 text-orange-700 text-[10px] font-bold px-2 py-1 rounded-full uppercase shrink-0">Programada</span>}
                                        </div>
                                        <p className="text-gray-600 text-sm mb-4 flex-1 line-clamp-2">{act.description}</p>

                                        {/* Progress Bar for Transparency */}
                                        <div className="mb-4">
                                            <div className="flex justify-between text-[10px] font-bold text-gray-400 mb-1 uppercase">
                                                <span>Avance Físico</span>
                                                <span>{act.physicalProgress || 0}%</span>
                                            </div>
                                            <div className="w-full bg-gray-100 rounded-full h-1.5 overflow-hidden">
                                                <div className="bg-blue-500 h-full transition-all duration-500" style={{ width: `${act.physicalProgress || 0}%` }}></div>
                                            </div>
                                        </div>

                                        <div className="flex justify-between items-center border-t pt-4">
                                            <div className="grid grid-cols-2 gap-x-4 gap-y-1 text-xs text-gray-500">
                                                <div className="flex items-center space-x-1">
                                                    <Icon name="users" size={12} />
                                                    <span>{act.beneficiaries || 0} Metas</span>
                                                </div>
                                                <div className="flex items-center space-x-1 text-emerald-600 font-medium">
                                                    <Icon name="banknote" size={12} />
                                                    <span>{act.costType === 'Free' ? 'Sin Costo' : `Q${(act.cost || 0).toLocaleString()}`}</span>
                                                </div>
                                                <div className="col-span-2 text-[10px] text-gray-400 truncate flex items-center gap-1">
                                                    <Icon name="wallet" size={10} />
                                                    {act.fundingSource || 'Fuente no especificada'}
                                                </div>
                                            </div>
                                            <div className="flex space-x-1 ml-2">
                                                <button onClick={() => handleEdit(act)} title="Editar Registro CGC" className="p-2 text-blue-600 hover:bg-blue-50 rounded-full transition"><Icon name="edit" size={16} /></button>
                                                <button onClick={() => handleDelete(act.id)} title="Eliminar" className="p-2 text-red-600 hover:bg-red-50 rounded-full transition"><Icon name="trash-2" size={16} /></button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    ) : (
                        <div className="bg-white rounded-xl shadow-lg p-6 md:p-8">
                            <ActivityForm initialData={editingActivity} onSubmit={handleCreate} onCancel={() => { setMode('list'); setEditingActivity(null); }} />
                        </div>
                    )}
                </div>
            );
        };

        const ReportView = () => {
            const { activities, user } = useContext(AppContext);

            // Date Filter State
            const [dateRange, setDateRange] = useState({
                start: new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString().split('T')[0],
                end: new Date().toISOString().split('T')[0]
            });

            // Filter Logic
            const filteredActivities = useMemo(() => {
                return activities.filter(a => a.date >= dateRange.start && a.date <= dateRange.end);
            }, [activities, dateRange]);

            // Calculate Stats
            const stats = useMemo(() => {
                const results = {
                    total: filteredActivities.length,
                    beneficiaries: filteredActivities.reduce((acc, curr) => acc + (curr.beneficiaries || 0), 0),
                    cost: filteredActivities.reduce((acc, curr) => acc + (curr.cost || 0), 0),
                    avgProgress: filteredActivities.length > 0
                        ? filteredActivities.reduce((acc, curr) => acc + (parseInt(curr.physicalProgress) || 0), 0) / filteredActivities.length
                        : 0,
                    men: filteredActivities.reduce((acc, curr) => acc + (parseInt(curr.beneficiariesMen) || 0), 0),
                    women: filteredActivities.reduce((acc, curr) => acc + (parseInt(curr.beneficiariesWomen) || 0), 0),
                    children: filteredActivities.reduce((acc, curr) => acc + (parseInt(curr.beneficiariesChildren) || 0), 0),
                };
                return results;
            }, [filteredActivities]);

            // Chart Data
            const chartData = useMemo(() => {
                const dates = {};
                filteredActivities.forEach(a => {
                    const d = a.date.substring(5); // MM-DD
                    dates[d] = (dates[d] || 0) + 1;
                });
                return Object.keys(dates).sort().map(k => ({ name: k, count: dates[k] }));
            }, [filteredActivities]);

            const fundingData = useMemo(() => {
                const sources = {};
                filteredActivities.forEach(a => {
                    const src = a.fundingSource || 'Otro / No esp.';
                    sources[src] = (sources[src] || 0) + (parseFloat(a.cost) || 0);
                });
                return Object.keys(sources).map(key => ({ name: key, value: sources[key] }));
            }, [filteredActivities]);

            const demographicData = [
                { name: 'Hombres', value: stats.men, fill: '#3b82f6' },
                { name: 'Mujeres', value: stats.women, fill: '#ec4899' },
                { name: 'Niños/Jóvenes', value: stats.children, fill: '#10b981' }
            ].filter(d => d.value > 0);

            const downloadPDF = () => {
                try {
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF();

                    // Header
                    if (user.institutionLogo) {
                        doc.addImage(user.institutionLogo, 'JPEG', 15, 10, 20, 20);
                    }
                    doc.setFontSize(18);
                    doc.text(user.institution, 40, 20);
                    doc.setFontSize(12);
                    doc.text("Reporte de Memoria de Labores", 40, 28);
                    doc.text(`Generado por: ${user.name}`, 40, 34);
                    doc.text(`Período: ${dateRange.start} al ${dateRange.end}`, 40, 40);
                    doc.text(`Institución: ${user.institution} | Oficina: ${user.office}`, 40, 46);

                    doc.line(15, 50, 195, 50);

                    // Stats
                    doc.text(`Total Actividades: ${stats.total}`, 15, 60);
                    doc.text(`Total Beneficiarios: ${stats.beneficiaries}`, 15, 66);
                    doc.text(`Total Inversión: Q${stats.cost.toLocaleString()}`, 15, 72);

                    // Table
                    const tableData = [];

                    filteredActivities.forEach(a => {
                        // Data Row
                        tableData.push([
                            a.date + ' ' + (a.time || ''),
                            {
                                content: `${a.title}\n\nLugar: ${a.community || "N/A"}\nDetalles: ${a.description || ""}\n\nTransparencia:\n- Renglón: ${a.budgetLine || "N/A"}\n- Fuente: ${a.fundingSource || "N/A"}\n- SNIP: ${a.snipCode || "N/A"}\n- Eje: ${a.strategicAxis || "N/A"}`,
                                styles: { fontSize: 8 }
                            },
                            { content: `${a.beneficiaries}\n(H:${a.beneficiariesMen || 0}/M:${a.beneficiariesWomen || 0}/N:${a.beneficiariesChildren || 0})`, styles: { fontSize: 8 } },
                            `Q${a.cost.toLocaleString()}\n(${a.physicalProgress || 0}% Avance)`,
                            a.costType
                        ]);

                        // Image Row with dynamic height
                        const imgs = a.images && a.images.length > 0 ? a.images : (a.image ? [a.image] : []);
                        if (imgs.length > 0) {
                            const imgW = 40;
                            const imgH = 30;
                            const perRow = 4;
                            const numRows = Math.ceil(imgs.length / perRow);
                            const rowH = (imgH + 5) * numRows + 5;

                            tableData.push([
                                {
                                    content: '',
                                    colSpan: 5,
                                    styles: { minCellHeight: rowH },
                                    _images: imgs,
                                    _config: { w: imgW, h: imgH, gap: 5, perRow: perRow }
                                }
                            ]);
                        }
                    });

                    doc.autoTable({
                        startY: 75,
                        head: [['Fecha', 'Actividad y Transparencia', 'Metas (H/M/N)', 'Inversión', 'Tipo']],
                        body: tableData,
                        didDrawCell: (data) => {
                            if (data.cell.raw && data.cell.raw._images && data.column.index === 0 && data.cell.section === 'body') {
                                const { _images, _config } = data.cell.raw;
                                _images.forEach((img, i) => {
                                    const rowIdx = Math.floor(i / _config.perRow);
                                    const colIdx = i % _config.perRow;
                                    const xPos = data.cell.x + 2 + colIdx * (_config.w + _config.gap);
                                    const yPos = data.cell.y + 2 + rowIdx * (_config.h + _config.gap);
                                    try {
                                        doc.addImage(img, 'JPEG', xPos, yPos, _config.w, _config.h);
                                    } catch (err) { console.error("Error adding image to PDF", err); }
                                });
                            }
                        }
                    });

                    doc.save(`memoria_labores_${dateRange.start}_${dateRange.end}.pdf`);
                } catch (e) {
                    alert("Error al generar PDF.");
                    console.error(e);
                }
            };

            const downloadExcel = () => {
                try {
                    const data = filteredActivities.map(a => ({
                        'Fecha': a.date,
                        'Hora': a.time || '',
                        'Lugar/Comunidad': a.community || '',
                        'Actividad': a.title,
                        'Renglón Presupuestario': a.budgetLine || '',
                        'Fuente Financiamiento': a.fundingSource || '',
                        'Código SNIP': a.snipCode || '',
                        'Eje PDM-OT': a.strategicAxis || '',
                        '% Avance Físico': a.physicalProgress || 0,
                        'Descripción': a.description || '',
                        'Beneficiarios Total': a.beneficiaries || 0,
                        'Hombres': a.beneficiariesMen || 0,
                        'Mujeres': a.beneficiariesWomen || 0,
                        'Niños/Jóvenes': a.beneficiariesChildren || 0,
                        'Costo (Q)': a.cost,
                        'Tipo Costo': a.costType,
                        'Donante': a.donor || '',
                        'Colaboradores': a.collaborators || '',
                        'Estado': a.status
                    }));
                    const ws = XLSX.utils.json_to_sheet(data);
                    const wb = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(wb, ws, "Actividades");
                    XLSX.writeFile(wb, `actividades_${dateRange.start}_${dateRange.end}.xlsx`);
                } catch (e) {
                    alert("Error al generar Excel.");
                    console.error(e);
                }
            };

            const downloadWord = async () => {
                try {
                    const docxLib = window.docx;
                    if (!docxLib) throw new Error("Librería de Word no cargada");
                    const { Document, Packer, Paragraph, TextRun, Table, TableRow, TableCell, WidthType } = docxLib;

                    const rows = [
                        new TableRow({
                            children: [
                                new TableCell({ children: [new Paragraph({ children: [new TextRun({ text: "Fecha/Lugar", bold: true })] })] }),
                                new TableCell({ children: [new Paragraph({ children: [new TextRun({ text: "Actividad / Transparencia", bold: true })] })] }),
                                new TableCell({ children: [new Paragraph({ children: [new TextRun({ text: "Metas / Impacto", bold: true })] })] }),
                                new TableCell({ children: [new Paragraph({ children: [new TextRun({ text: "Finanzas", bold: true })] })] }),
                            ],
                        }),
                    ];

                    filteredActivities.forEach(a => {
                        rows.push(new TableRow({
                            children: [
                                new TableCell({ children: [new Paragraph(`${a.date}\n${a.community || ""}`)] }),
                                new TableCell({
                                    children: [new Paragraph({
                                        children: [
                                            new TextRun({ text: a.title, bold: true }),
                                            new TextRun({ text: `\n\nRenglón: ${a.budgetLine || "N/A"}\nFuente: ${a.fundingSource || ""}\nSNIP: ${a.snipCode || ""}`, size: 18 })
                                        ]
                                    })]
                                }),
                                new TableCell({ children: [new Paragraph(`Total: ${a.beneficiaries}\n(H:${a.beneficiariesMen}/M:${a.beneficiariesWomen}/N:${a.beneficiariesChildren})`)] }),
                                new TableCell({ children: [new Paragraph(`Q${a.cost.toLocaleString()}\n${a.physicalProgress}% Avance\n(${a.costType})`)] }),
                            ],
                        }));
                    });

                    const doc = new Document({
                        sections: [{
                            properties: {
                                page: {
                                    margin: { top: 720, right: 720, bottom: 720, left: 720 },
                                },
                            },
                            children: [
                                new Paragraph({
                                    children: [new TextRun({ text: user.institution, bold: true, size: 32 })],
                                }),
                                new Paragraph({
                                    children: [new TextRun({ text: "Reporte de Actividades", bold: true, size: 28 })],
                                }),
                                new Paragraph({ text: `Período: ${dateRange.start} a ${dateRange.end}` }),
                                new Paragraph({ text: "" }),
                                new Table({
                                    width: { size: 100, type: WidthType.PERCENTAGE },
                                    rows: rows,
                                }),
                            ],
                        }],
                    });

                    const blob = await Packer.toBlob(doc);
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    a.href = url;
                    a.download = `actividades_${dateRange.start}_${dateRange.end}.docx`;
                    a.click();
                    URL.revokeObjectURL(url);
                } catch (e) {
                    alert("Error al generar Word: " + e.message);
                    console.error(e);
                }
            };

            return (
                <div className="space-y-6 max-w-6xl mx-auto">
                    <div className="flex flex-col md:flex-row justify-between items-end gap-4">
                        <div>
                            <h2 className="text-2xl font-bold text-gray-800">Resumen y Estadísticas CGC</h2>
                            <p className="text-sm text-gray-500">Indicadores de transparencia y gestión municipal</p>
                        </div>

                        <div className="flex items-center space-x-2 bg-white p-2 rounded-lg shadow-sm border">
                            <input type="date" value={dateRange.start} onChange={e => setDateRange({ ...dateRange, start: e.target.value })} className="border rounded p-1 text-sm" />
                            <span className="text-gray-400">-</span>
                            <input type="date" value={dateRange.end} onChange={e => setDateRange({ ...dateRange, end: e.target.value })} className="border rounded p-1 text-sm" />
                        </div>

                        <div className="flex items-center space-x-2">
                            <button onClick={downloadPDF} title="PDF" className="bg-red-600 text-white p-2 rounded-lg hover:bg-red-700 transition shadow-md">
                                <Icon name="file-text" size={20} />
                            </button>
                            <button onClick={downloadExcel} title="Excel" className="bg-emerald-600 text-white p-2 rounded-lg hover:bg-emerald-700 transition shadow-md">
                                <Icon name="file-spreadsheet" size={20} />
                            </button>
                            <button onClick={downloadWord} title="Word" className="bg-blue-600 text-white p-2 rounded-lg hover:bg-blue-700 transition shadow-md">
                                <Icon name="file-text" size={20} />
                            </button>
                            <span className="text-xs font-bold text-gray-500 uppercase ml-2">Exportar</span>
                        </div>
                    </div>

                    {/* Stats Grid */}
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                            <div className="flex items-center gap-4">
                                <div className="p-3 bg-blue-100 rounded-lg text-blue-600"><Icon name="activity" /></div>
                                <div>
                                    <p className="text-sm text-gray-500 font-medium whitespace-nowrap">Actividades</p>
                                    <p className="text-2xl font-bold text-gray-900">{stats.total}</p>
                                </div>
                            </div>
                        </div>
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                            <div className="flex items-center gap-4">
                                <div className="p-3 bg-emerald-100 rounded-lg text-emerald-600"><Icon name="users" /></div>
                                <div>
                                    <p className="text-sm text-gray-500 font-medium whitespace-nowrap">Beneficiarios</p>
                                    <p className="text-2xl font-bold text-gray-900">{stats.beneficiaries.toLocaleString()}</p>
                                </div>
                            </div>
                        </div>
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                            <div className="flex items-center gap-4">
                                <div className="p-3 bg-purple-100 rounded-lg text-purple-600"><Icon name="banknote" /></div>
                                <div>
                                    <p className="text-sm text-gray-500 font-medium whitespace-nowrap">Inversión (Q)</p>
                                    <p className="text-2xl font-bold text-gray-900">Q{stats.cost.toLocaleString()}</p>
                                </div>
                            </div>
                        </div>
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                            <div className="flex items-center gap-4">
                                <div className="p-3 bg-orange-100 rounded-lg text-orange-600"><Icon name="trending-up" /></div>
                                <div>
                                    <p className="text-sm text-gray-500 font-medium whitespace-nowrap">% Avance Físico</p>
                                    <p className="text-2xl font-bold text-gray-900">{Math.round(stats.avgProgress)}%</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Charts Grid */}
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        {/* Demo/Stats Chart */}
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                            <h3 className="font-bold text-gray-700 mb-6 flex items-center gap-2">
                                <Icon name="users" size={18} className="text-emerald-500" />
                                Impacto Demográfico (Metas)
                            </h3>
                            <div className="h-64 w-full">
                                <SafeResponsiveContainer width="100%" height="100%">
                                    <SafeBarChart data={demographicData}>
                                        <SafeCartesianGrid strokeDasharray="3 3" vertical={false} />
                                        <SafeXAxis dataKey="name" />
                                        <SafeYAxis />
                                        <SafeTooltip />
                                        <SafeBar dataKey="value" radius={[4, 4, 0, 0]} />
                                    </SafeBarChart>
                                </SafeResponsiveContainer>
                            </div>
                        </div>

                        {/* Funding Chart */}
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                            <h3 className="font-bold text-gray-700 mb-6 flex items-center gap-2">
                                <Icon name="pie-chart" size={18} className="text-blue-500" />
                                Distribución de Inversión por Fuente
                            </h3>
                            <div className="h-64 w-full">
                                <SafeResponsiveContainer width="100%" height="100%">
                                    <SafePieChart>
                                        <SafePie
                                            data={fundingData}
                                            innerRadius={60}
                                            outerRadius={80}
                                            paddingAngle={5}
                                            dataKey="value"
                                        >
                                            {fundingData.map((entry, index) => (
                                                <SafeCell key={`cell-${index}`} fill={['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6'][index % 5]} />
                                            ))}
                                        </SafePie>
                                        <SafeTooltip formatter={(val) => `Q${val.toLocaleString()}`} />
                                    </SafePieChart>
                                </SafeResponsiveContainer>
                            </div>
                            <div className="grid grid-cols-2 gap-2 mt-2">
                                {fundingData.map((d, i) => (
                                    <div key={i} className="flex items-center gap-2 text-[10px] text-gray-500">
                                        <div className="w-2 h-2 rounded-full" style={{ backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6'][i % 5] }}></div>
                                        <span className="truncate">{d.name}: Q{d.value.toLocaleString()}</span>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Original Timeline Chart - Full Width */}
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100 lg:col-span-2">
                            <h3 className="font-bold text-gray-700 mb-6 flex items-center gap-2">
                                <Icon name="calendar" size={18} className="text-blue-600" />
                                Frecuencia de Actividades por Fecha

        const NotesView = () => {
            const { notes, addNote, updateNote, deleteNote } = useContext(AppContext);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editingNote, setEditingNote] = useState(null);
            const [search, setSearch] = useState('');

            const colors = [
                { name: 'Amarillo', bg: 'bg-yellow-100', border: 'border-yellow-200', text: 'text-yellow-800' },
                { name: 'Azul', bg: 'bg-blue-100', border: 'border-blue-200', text: 'text-blue-800' },
                { name: 'Verde', bg: 'bg-emerald-100', border: 'border-emerald-200', text: 'text-emerald-800' },
                { name: 'Rosa', bg: 'bg-rose-100', border: 'border-rose-200', text: 'text-rose-800' },

            const [form, setForm] = useState({
                content: '',
                color: colors[0].bg,
                pinned: false

            const filteredNotes = useMemo(() => {
                const results = notes.filter(n =>
                    n.content.toLowerCase().includes(search.toLowerCase())

                }
                setIsModalOpen(true);

                e.preventDefault();
                if (editingNote) {
                    updateNote(form);
                } else {
                    addNote(form);

                    </div>

                    {isModalOpen && (

                                        <textarea
                                            required
                                            autoFocus
                                            rows="6"

                                                    title={c.name}

                                        <button
                                            type="button"

                                        >
                                            <Icon name="pin" size={18} />

                                        </button>
                                    </div>

                                    <div className="pt-4 flex gap-3">
                                        <button type="button" onClick={() => setIsModalOpen(false)} className="flex-1 py-3 text-gray-600 font-bold hover:bg-gray-100 rounded-xl transition">
                                            Cancelar
                                        </button>
                                        <button type="submit" className="flex-1 py-3 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 transition shadow-lg">
                                            {editingNote ? 'Actualizar' : 'Guardar'}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const CalendarView = () => {
            const { activities, addActivity } = useContext(AppContext);
            const today = new Date();
            const [currentMonth, setCurrentMonth] = useState(today.getMonth());
            const [currentYear, setCurrentYear] = useState(today.getFullYear());
            const [selectedDateModal, setSelectedDateModal] = useState(null);

            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            const firstDay = new Date(currentYear, currentMonth, 1).getDay(); // 0 = Sun

            const days = [];
            for (let i = 0; i < firstDay; i++) days.push(null);
            for (let i = 1; i <= daysInMonth; i++) days.push(i);

            const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

            const getActsForDay = (day) => {
                if (!day) return [];
                const dStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                return activities.filter(a => a.date === dStr);
            };

            const changeMonth = (delta) => {
                let newM = currentMonth + delta;
                let newY = currentYear;
                if (newM < 0) { newM = 11; newY--; }
                if (newM > 11) { newM = 0; newY++; }
                setCurrentMonth(newM);
                setCurrentYear(newY);
            };

            const handleDayClick = (day) => {
                if (!day) return;
                const dStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                setSelectedDateModal(dStr);
            };

            return (
                <div className="bg-white rounded-xl shadow-lg overflow-hidden h-full flex flex-col relative">
                    <div className="p-4 bg-gray-50 border-b flex justify-between items-center">
                        <h2 className="text-xl font-bold text-gray-800 capitalize">{monthNames[currentMonth]} {currentYear}</h2>
                        <div className="space-x-2">
                            <button onClick={() => changeMonth(-1)} className="p-2 hover:bg-gray-200 rounded-full"><Icon name="chevron-left" /></button>
                            <button onClick={() => changeMonth(1)} className="p-2 hover:bg-gray-200 rounded-full"><Icon name="chevron-right" /></button>
                        </div>
                    </div>
                    <div className="grid grid-cols-7 bg-gray-100 flex-1 overflow-auto">
                        {["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"].map(d => (
                            <div key={d} className="p-2 text-center text-sm font-bold text-gray-500 uppercase border-b bg-gray-50 sticky top-0">{d}</div>
                        ))}
                        {days.map((day, i) => {
                            const acts = getActsForDay(day);
                            return (
                                <div key={i}
                                    onClick={() => handleDayClick(day)}
                                    className={`min-h-[100px] border-r border-b p-2 hover:bg-blue-50 transition cursor-pointer flex flex-col ${!day ? 'bg-gray-50' : 'bg-white'}`}
                                >
                                    {day && (
                                        <>
                                            <span className={`text-sm font-semibold mb-1 w-7 h-7 flex items-center justify-center rounded-full ${day === today.getDate() && currentMonth === today.getMonth() && currentYear === today.getFullYear()
                                                ? 'bg-blue-600 text-white' : 'text-gray-700'
                                                }`}>{day}</span>
                                            <div className="flex-1 space-y-1 overflow-hidden">
                                                {acts.map(a => (
                                                    <div key={a.id} className={`text-[10px] px-1 py-0.5 rounded truncate text-white ${a.status === 'Programada' ? 'bg-orange-500' : 'bg-blue-500'}`}>
                                                        {a.title}
                                                    </div>
                                                ))}
                                            </div>
                                        </>
                                    )}
                                </div>
                            );
                        })}
                    </div>

                    {/* Quick Add Modal */}
                    {selectedDateModal && (
                        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
                                <div className="p-6 border-b flex justify-between items-center bg-gray-50 sticky top-0">
                                    <h3 className="text-xl font-bold">Actividad para {selectedDateModal}</h3>
                                    <button onClick={() => setSelectedDateModal(null)} className="p-2 hover:bg-gray-200 rounded-full text-gray-500"><Icon name="x" /></button>
                                </div>
                                <div className="p-6">
                                    <ActivityForm
                                        initialData={{
                                            title: '', description: '', beneficiaries: 0,
                                            cost: 0, costType: 'Institution',
                                            donor: '', collaborators: '',
                                            date: selectedDateModal, // Pre-fill date
                                            time: '12:00',
                                            images: [],
                                            status: new Date(selectedDateModal) > new Date() ? 'Programada' : 'Realizada' // Auto-detect status
                                        }}
                                        onSubmit={(data) => {
                                            addActivity(data);
                                            setSelectedDateModal(null);
                                        }}
                                        onCancel={() => setSelectedDateModal(null)}
                                    />
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const NewsView = () => {
            const { news, addNews, updateNews, deleteNews } = useContext(AppContext);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editingItem, setEditingItem] = useState(null);

            const [form, setForm] = useState({
                title: '', date: new Date().toISOString().split('T')[0],
                content: '', image: null, facebookLink: ''

                if (item) {
                    setEditingItem(item);
                    setForm(item);

                    setEditingItem(null);
                    setForm({
                        title: '', date: new Date().toISOString().split('T')[0],
                        content: '', image: null, facebookLink: ''
                    });
                }
                setIsModalOpen(true);
            };

            const handleImage = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                try {
                    const compressed = await compressImage(file, 800, 0.7);
                    setForm(prev => ({ ...prev, image: compressed }));
                } catch (err) {
                    console.error(err);
                }
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (editingItem) {
                    updateNews(form);
                } else {
                    addNews(form);

                setIsModalOpen(false);
            };

            return (
                <div className="max-w-5xl mx-auto space-y-6">

                        </div>
                        <button onClick={() => openModal()} className="bg-blue-600 text-white px-4 py-2 rounded-lg flex items-center space-x-2 shadow hover:bg-blue-700 transition">

                            </div>

                                        <h3 className="font-bold text-lg text-gray-800 line-clamp-2 leading-tight">{n.title}</h3>
                                    </div>
                                    <span className="text-xs text-blue-600 font-bold uppercase tracking-wider mb-3 block">{n.date}</span>
                                    <p className="text-gray-600 text-sm line-clamp-3 mb-4 flex-1">{n.content}</p>

                                    {n.facebookLink && (
                                        <a href={n.facebookLink} target="_blank" rel="noopener noreferrer" className="inline-flex items-center text-blue-600 hover:text-blue-800 text-sm font-bold mb-4">
                                            <Icon name="facebook" size={16} className="mr-1" /> Ver en Facebook
                                        </a>
                                    )}

                                    <div className="flex space-x-2 border-t pt-4 mt-auto">
                                        <button onClick={() => openModal(n)} className="flex-1 py-2 text-sm font-bold text-blue-600 hover:bg-blue-50 border border-blue-100 rounded transition">Editar</button>
                                        <button onClick={() => { if (confirm('¿Borrar noticia?')) deleteNews(n.id) }} className="flex-1 py-2 text-sm font-bold text-red-600 hover:bg-red-50 border border-red-100 rounded transition">Eliminar</button>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>

                    {/* Modal */}
                    {isModalOpen && (
                        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto animate-fade-in">
                                <div className="p-6 border-b flex justify-between items-center bg-gray-50 sticky top-0">
                                    <h3 className="text-xl font-bold">{editingItem ? 'Editar Noticia' : 'Nueva Noticia'}</h3>
                                    <button onClick={() => setIsModalOpen(false)}><Icon name="x" /></button>
                                </div>
                                <form onSubmit={handleSubmit} className="p-6 space-y-4">
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">Título</label>
                                        <input required className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                            value={form.title} onChange={e => setForm({ ...form, title: e.target.value })} placeholder="Título de la noticia" />
                                    </div>

                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">Fecha</label>
                                        <input required type="date" className="w-full p-3 border rounded-lg"
                                            value={form.date} onChange={e => setForm({ ...form, date: e.target.value })} />
                                    </div>

                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">Contenido</label>
                                        <textarea required rows="4" className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                            value={form.content} onChange={e => setForm({ ...form, content: e.target.value })} placeholder="Descripción del evento o comunicado..." />
                                    </div>

                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">Imagen (Opcional)</label>
                                        <div className="border border-gray-300 rounded-lg p-2 flex items-center space-x-4">
                                            {form.image && <img src={form.image} className="h-12 w-12 object-cover rounded" />}
                                            <input type="file" onChange={handleImage} className="text-sm w-full" accept="image/*" />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">Enlace a Facebook (Opcional)</label>
                                        <div className="relative">
                                            <Icon name="facebook" className="absolute left-3 top-3.5 text-gray-400" size={18} />
                                            <input type="url" className="w-full p-3 pl-10 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                                value={form.facebookLink} onChange={e => setForm({ ...form, facebookLink: e.target.value })} placeholder="https://facebook.com/post..." />
                                        </div>
                                    </div>

                                    <div className="pt-4 flex justify-end space-x-3">
                                        <button type="button" onClick={() => setIsModalOpen(false)} className="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg">Cancelar</button>
                                        <button type="submit" className="px-6 py-2 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 transition">
                                            {editingItem ? 'Actualizar Noticia' : 'Guardar Noticia'}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const SettingsView = () => {
            const { user, exportData } = useContext(AppContext);

            const handleExport = () => {
                exportData();
            };

            const handleImport = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                if (!confirm('ADVERTENCIA: Esto reemplazará todos los datos actuales con los del archivo de respaldo. ¿Deseas continuar?')) {
                    e.target.value = '';
                    return;
                }

                const reader = new FileReader();
                reader.onload = async (event) => {
                    try {
                        const data = JSON.parse(event.target.result);

                        // Clear current DB
                        // Note: This is a simplistic approach. Ideally we might merge or be more careful.
                        // For this use case (moving devices), overwrite is usually expected.
                        // We do need to handle clearing stores properly.
                        // A quick way is to delete/re-add items, or clear object stores if we expose a clear method.

                        // Since we don't have a clear() in our DB wrapper, we can just put() overwrites if IDs match,
                        // but to truly clear we'd need to fetch all IDs and delete.
                        // Let's rely on overwriting for now, or just assume the user is okay with merging by ID.
                        // Actually, for a clean restore, we should probably clear.
                        // Let's extend DB wrapper slightly or just iterate deletes.

                        // Extended DB logic for import:
                        const db = await DB.open();
                        const tx = db.transaction(['users', 'activities', 'documents', 'news', 'beneficiaries'], 'readwrite');

                        // Helper to clear store
                        const clearStore = (storeName) => {
                            const store = tx.objectStore(storeName);
                            store.clear();
                        };

                        clearStore('users');
                        clearStore('activities');
                        clearStore('documents');
                        clearStore('news');
                        clearStore('beneficiaries');

                        // Helper to add items
                        const addItems = (storeName, items) => {
                            if (!items) return;
                            const store = tx.objectStore(storeName);
                            items.forEach(item => store.put(item));
                        };

                        addItems('users', data.users);
                        addItems('activities', data.activities);
                        addItems('documents', data.documents);
                        addItems('news', data.news);
                        addItems('beneficiaries', data.beneficiaries);

                        tx.oncomplete = () => {
                            alert('Datos restaurados correctamente. La página se recargará.');
                            window.location.reload();
                        };

                        tx.onerror = () => {
                            throw new Error('Transaction failed');
                        };

                    } catch (err) {
                        console.error(err);
                        alert('Error al importar el archivo. Asegúrate de que seat un respaldo válido.');
                    }
                };
                reader.readAsText(file);
            };

            return (
                <div className="max-w-2xl mx-auto space-y-8 animate-fade-in">
                    <h2 className="text-2xl font-bold text-gray-800">Copia de Seguridad y Datos</h2>

                    <div className="bg-white p-8 rounded-xl shadow-lg border-l-4 border-blue-600">
                        <div className="flex items-start space-x-4">
                            <div className="p-3 bg-blue-100 rounded-full text-blue-600">
                                <Icon name="download" size={32} />
                            </div>
                            <div className="flex-1">
                                <h3 className="text-xl font-bold text-gray-800 mb-2">Exportar Datos</h3>
                                <p className="text-gray-600 mb-4">
                                    Descarga un archivo con toda tu información (Actividades, Documentos, Noticias, Perfil).
                                    Guarda este archivo en un lugar seguro o envíalo a tu celular.
                                </p>
                                <button onClick={handleExport} className="bg-blue-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-blue-700 transition w-full md:w-auto">
                                    Generar Respaldo
                                </button>
                            </div>
                        </div>
                    </div>

                    <div className="bg-white p-8 rounded-xl shadow-lg border-l-4 border-green-600">
                        <div className="flex items-start space-x-4">
                            <div className="p-3 bg-green-100 rounded-full text-green-600">
                                <Icon name="upload" size={32} />
                            </div>
                            <div className="flex-1">
                                <h3 className="text-xl font-bold text-gray-800 mb-2">Restaurar Datos</h3>
                                <p className="text-gray-600 mb-4">
                                    Sube el archivo de respaldo que descargaste previamente.
                                    <span className="text-red-500 font-bold block mt-1">¡Cuidado! Esto borrará los datos actuales de este dispositivo.</span>
                                </p>
                                <label className="block w-full md:w-auto">
                                    <span className="sr-only">Elegir archivo</span>
                                    <input type="file" accept=".json" onChange={handleImport}
                                        className="block w-full text-sm text-gray-500
                                        file:mr-4 file:py-2 file:px-4
                                        file:rounded-lg file:border-0
                                        file:text-sm file:font-semibold
                                        file:bg-green-50 file:text-green-700
                                        hover:file:bg-green-100 cursor-pointer"
                                    />
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            return (
                <AppProvider>
                    <MainRouter />
                </AppProvider>
            );
        };

        const MainRouter = () => {
            const { user } = useContext(AppContext);
            return user ? <Dashboard /> : <LoginScreen />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
