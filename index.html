                                    <input className="w-full p-3 border rounded-lg" value={formData.contactEmail || ''} onChange={e => setFormData({ ...formData, contactEmail: e.target.value })} placeholder="correo@ejemplo.com" />
                                </div>
                            </div>

                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Facebook (URL/Nombre)</label>
                                    <input className="w-full p-3 border rounded-lg" value={formData.facebook || ''} onChange={e => setFormData({ ...formData, facebook: e.target.value })} placeholder="fb.com/usuario" />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Instagram (Usuario)</label>
                                    <input className="w-full p-3 border rounded-lg" value={formData.instagram || ''} onChange={e => setFormData({ ...formData, instagram: e.target.value })} placeholder="@usuario" />
                                </div>
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Logo Institucional</label>
                                <div className="flex items-center space-x-4 border rounded-lg p-3">
                                    {formData.institutionLogo && <img src={formData.institutionLogo} className="h-12 w-12 object-contain" />}
                                    <input type="file" onChange={e => handleFile(e, 'institutionLogo')} className="text-sm text-gray-500" />
                                </div>
                            </div>
                        </div>

                        <div className="pt-4 flex justify-end">
                            <button type="submit" className="bg-blue-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-blue-700 transition shadow-lg">
                                Guardar Cambios
                            </button>
                        </div>
                    </form>
                </div>
            );
        };


        // --- APP SHELL ---
        const Dashboard = () => {
            const { user, logout, isGeneratingPost } = useContext(AppContext);
            const [view, setView] = useState('home'); // home, activities, report, calendar, news, profile, documents, settings
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

            // Re-render icons when DOM updates
            useEffect(() => { lucide.createIcons(); });

            const NavItem = ({ id, label, icon }) => {
                const isActive = view === id;
                return (
                    <button
                        onClick={() => { setView(id); setIsMobileMenuOpen(false); }}
                        className={`flex items-center space-x-3 w-full p-3 rounded-xl transition-all duration-200 mb-1 group relative ${isActive ? 'bg-blue-600/20 text-blue-400 font-bold' : 'text-slate-400 hover:bg-white/5 hover:text-white'}`}
                    >
                        {isActive && <div className="absolute left-0 top-2 bottom-2 w-1 bg-blue-500 rounded-r-full" />}
                        <Icon name={icon} size={20} className={`${isActive ? 'text-blue-500' : 'group-hover:scale-110 transition-transform text-slate-400 group-hover:text-white'}`} />
                        <span className="text-sm">{label}</span>
                    </button>
                );
            };

            const NavGroup = ({ title, children }) => (
                <div className="mb-6">
                    <h3 className="px-4 text-[10px] font-bold text-slate-500 uppercase tracking-[0.15em] mb-2">{title}</h3>
                    {children}
                </div>
            );

            return (
                <div className="flex h-screen overflow-hidden bg-[#f8fafc]">
                    {/* Sidebar */}
                    <aside className={`fixed inset-y-0 left-0 z-50 w-64 bg-[#0f172a] border-r border-white/5 text-white transform transition-transform duration-300 md:relative md:translate-x-0 flex flex-col ${isMobileMenuOpen ? 'translate-x-0' : '-translate-x-full'}`}>
                        <div className="p-8 flex flex-col items-center border-b border-white/5 cursor-pointer bg-black/10 hover:bg-black/20 transition-colors" onClick={() => setView('home')}>
                            <div className="relative mb-3">
                                {user.institutionLogo ?
                                    <img src={user.institutionLogo} className="h-20 w-20 object-contain rounded-2xl bg-white p-2 shadow-2xl ring-4 ring-blue-500/20" /> :
                                    <div className="h-20 w-20 bg-slate-800 rounded-2xl flex items-center justify-center shadow-xl ring-4 ring-blue-500/20"><Icon name="building-2" size={32} /></div>
                                }
                            </div>
                            <h2 className="font-extrabold text-center leading-tight text-sm uppercase tracking-wider text-slate-300">{user.institution}</h2>
                        </div>

                        <nav className="flex-1 p-4 overflow-y-auto custom-scrollbar">
                            <NavGroup title="Principal">
                                <NavItem id="home" label="Inicio" icon="home" />
                                <NavItem id="advisor" label="Asesor AI" icon="shield-check" />
                                <NavItem id="calendar" label="Calendario" icon="calendar" />
                            </NavGroup>

                            <NavGroup title="Gestión de Datos">
                                <NavItem id="activities" label="Actividades POA" icon="list" />
                                <NavItem id="report" label="Reportes de Auditoría" icon="file-spreadsheet" />
                                <NavItem id="inventory" label="Inventario / Activos" icon="package" />
                                <NavItem id="documents" label="Biblioteca Digital" icon="book-open" />
                                <NavItem id="beneficiaries" label="Beneficiarios" icon="users" />
                            </NavGroup>

                            <NavGroup title="Control Institucional">
                                <NavItem id="laip" label="LAIP (Información)" icon="info" />
                                <NavItem id="cocodes" label="COCODES / Ciudadanía" icon="handshake" />
                                <NavItem id="vehicle_logs" label="Bitácora Vehicular" icon="truck" />
                                <NavItem id="social" label="Redes Sociales" icon="share-2" />
                            </NavGroup>

                            <NavGroup title="Comunicación">
                                <NavItem id="news" label="Noticias" icon="bell" />
                                <NavItem id="notes" label="Bloc de Notas" icon="edit-3" />
                                <NavItem id="directory" label="Directorio" icon="phone" />
                            </NavGroup>

                            <NavGroup title="Sistema">
                                <NavItem id="settings" label="Configuración" icon="settings" />
                            </NavGroup>
                        </nav>

                        <div className="p-4 border-t border-white/5 bg-black/40">
                            <button onClick={() => setView('profile')} className={`flex items-center space-x-3 w-full p-3 hover:bg-white/5 rounded-2xl transition-all duration-300 mb-3 group ${view === 'profile' ? 'bg-white/10 ring-1 ring-white/10' : ''}`}>
                                <div className="relative">
                                    {user.userPhoto ?
                                        <img src={user.userPhoto} className="w-10 h-10 rounded-xl object-cover ring-2 ring-blue-500/40" /> :
                                        <div className="bg-blue-600 rounded-xl p-2 w-10 h-10 flex items-center justify-center shadow-lg"><Icon name="user" size={20} /></div>
                                    }
                                    <div className="absolute -bottom-1 -right-1 w-3 h-3 bg-green-500 border-2 border-[#0f172a] rounded-full"></div>
                                </div>
                                <div className="flex-1 text-left overflow-hidden">
                                    <p className="text-sm font-bold truncate text-slate-200 group-hover:text-white">{user.name}</p>
                                    <p className="text-[10px] text-blue-400 font-bold uppercase tracking-tight">Mi Perfil</p>
                                </div>
                            </button>
                            <button onClick={logout} className="flex items-center justify-center space-x-2 text-slate-400 hover:text-red-400 hover:bg-red-400/10 w-full py-2.5 rounded-xl text-xs font-bold transition-all duration-300">
                                <Icon name="log-out" size={14} />
                                <span>Cerrar Sesión</span>
                            </button>
                            <div className="text-[9px] text-slate-600 text-center uppercase tracking-[0.2em] mt-4 font-bold opacity-50">
                                Versión {APP_VERSION}
                            </div>
                        </div>
                    </aside>

                    {/* Main Content */}
                    <div className="flex-1 flex flex-col h-screen overflow-hidden relative">
                        {/* Header */}
                        <header className="bg-white shadow-sm h-16 flex items-center justify-between px-6 z-10 md:hidden">
                            <span className="font-bold text-gray-800 text-lg">Memoria de Labores</span>
                            <button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} className="p-2 bg-gray-100 rounded-lg text-gray-600">
                                <Icon name="menu" />
                            </button>
                        </header>

                        <main className="flex-1 overflow-y-auto p-4 md:p-8 bg-[#f8fafc]">
                            {view === 'home' && <HomeView />}
                            {view === 'profile' && <ProfileView />}
                            {view === 'activities' && <ActivitiesView />}
                            {view === 'report' && <ReportView />}
                            {view === 'calendar' && <CalendarView />}
                            {view === 'beneficiaries' && <BeneficiariesView />}
                            {view === 'documents' && <DocumentsView />}
                            {view === 'news' && <NewsView />}
                            {view === 'notes' && <NotesView />}
                            {view === 'directory' && <DirectoryView />}
                            {view === 'settings' && <SettingsView />}
                            {view === 'advisor' && <AdvisorView />}
                            {view === 'inventory' && <InventoryView />}
                            {view === 'laip' && <LAIPView />}
                            {view === 'cocodes' && <CocodesView />}
                            {view === 'vehicle_logs' && <VehicleLogView />}
                            {view === 'social' && <SocialMediaView />}

                            {/* Global AI Post Generation Overlay */}
                            {isGeneratingPost && (
                                <div className="fixed bottom-10 right-10 bg-white shadow-2xl rounded-2xl p-6 border-b-4 border-blue-600 z-[100] animate-bounce flex items-center gap-4">
                                    <div className="bg-blue-100 p-3 rounded-xl text-blue-600 animate-spin">
                                        <Icon name="sparkles" />
                                    </div>
                                    <div>
                                        <p className="font-black text-gray-800 text-sm">IA GENERANDO POST</p>
                                        <p className="text-[10px] text-gray-500 font-bold uppercase tracking-tight">Estamos analizando tu actividad...</p>
                                    </div>
                                </div>
                            )}
                        </main>
                        <FloatingAssistant onClick={() => setView('advisor')} />
                    </div>

                    {/* Mobile Overlay */}
                    {isMobileMenuOpen && (
                        <div className="fixed inset-0 bg-black/50 z-40 md:hidden" onClick={() => setIsMobileMenuOpen(false)}></div>
                    )}
                </div>
            );
        };

        const DocumentsView = () => {
            const { documents, addDocument, deleteDocument } = useContext(AppContext);

            const handleUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                if (file.size > 2 * 1024 * 1024) { // 2MB Limit
                    alert("El archivo es demasiado grande. El límite es 2MB para evitar saturar el almacenamiento local.");
                    return;
                }

                if (file.type !== 'application/pdf') {
                    alert("Solo se permiten archivos PDF.");
                    return;
                }

                const reader = new FileReader();
                reader.onload = () => {
                    addDocument({
                        name: file.name,
                        size: (file.size / 1024).toFixed(0) + ' KB',
                        data: reader.result
                    });
                };
                reader.readAsDataURL(file);
            };

            const openPdf = (data) => {
                const win = window.open();
                win.document.write('<iframe src="' + data + '" frameborder="0" style="border:0; top:0px; left:0px; bottom:0px; right:0px; width:100%; height:100%;" allowfullscreen></iframe>');
            };

            return (
                <div className="max-w-5xl mx-auto space-y-6">
                    <div className="flex justify-between items-center">
                        <div>
                            <h2 className="text-2xl font-bold text-gray-800">Documentos de Referencia</h2>
                            <p className="text-gray-500 text-sm">Sube guías, normativas o formatos PDF (Máx 2MB)</p>
                        </div>
                        <div className="relative">
                            <input type="file" accept="application/pdf" onChange={handleUpload} className="absolute inset-0 opacity-0 cursor-pointer w-full h-full" />
                            <button className="bg-blue-600 text-white px-4 py-2 rounded-lg flex items-center space-x-2 shadow hover:bg-blue-700 transition">
                                <Icon name="upload" size={18} />
                                <span>Subir PDF</span>
                            </button>
                        </div>
                    </div>

                    {documents.length === 0 ? (
                        <div className="text-center py-20 bg-white rounded-xl border border-dashed border-gray-300">
                            <Icon name="file-text" size={48} className="mx-auto text-gray-300 mb-4" />
                            <p className="text-gray-500">No hay documentos subidos.</p>
                        </div>
                    ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            {documents.map(doc => (
                                <div key={doc.id} className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 hover:shadow-md transition flex flex-col justify-between">
                                    <div className="flex items-start space-x-4 mb-4">
                                        <div className="bg-red-100 p-3 rounded-lg text-red-600">
                                            <Icon name="file-text" size={24} />
                                        </div>
                                        <div className="overflow-hidden">
                                            <h3 className="font-bold text-gray-800 truncate" title={doc.name}>{doc.name}</h3>
                                            <p className="text-xs text-gray-500">{doc.date} • {doc.size}</p>
                                        </div>
                                    </div>
                                    <div className="flex space-x-2 border-t pt-3">
                                        <button onClick={() => openPdf(doc.data)} className="flex-1 text-blue-600 hover:bg-blue-50 py-2 rounded text-sm font-medium transition">
                                            Abrir
                                        </button>
                                        <button onClick={() => { if (confirm('¿Borrar archivo?')) deleteDocument(doc.id) }} className="flex-1 text-red-600 hover:bg-red-50 py-2 rounded text-sm font-medium transition">
                                            Eliminar
                                        </button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        const BeneficiariesView = () => {
            const { beneficiaries, addBeneficiary, updateBeneficiary, deleteBeneficiary, user } = useContext(AppContext);
            const [viewMode, setViewMode] = useState('list'); // list | form
            const [editingItem, setEditingItem] = useState(null);

            const downloadPDF = () => {
                try {
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF();

                    // Header
                    if (user.institutionLogo) {
                        doc.addImage(user.institutionLogo, 'JPEG', 15, 10, 20, 20);
                    }
                    doc.setFontSize(18);
                    doc.text(user.institution, 40, 20);
                    doc.setFontSize(12);
                    doc.text("Reporte de Beneficiarios", 40, 28);
                    doc.text(`Generado por: ${user.name}`, 40, 34);
                    doc.text(`Fecha: ${new Date().toLocaleDateString()}`, 40, 40);

                    doc.line(15, 45, 195, 45);

                    const tableData = [];
                    beneficiaries.forEach(b => {
                        const familyData = `Esposa: ${b.spouseName || "N/A"}${b.spouseAge ? " (" + b.spouseAge + " años)" : ""}\nHijos: ${b.children?.length > 0 ? b.children.map(c => `${c.name} (${c.age})`).join(", ") : "Ninguno"}`;
                        const observations = b.observations ? `\n\nOBS: ${b.observations}` : "";

                        tableData.push([
                            b.churchName,
                            { content: `Pastor: ${b.pastorName}\nTel: ${b.pastorPhone}\nEdad: ${b.pastorAge || "N/A"}\nDenom: ${b.denomination}`, styles: { fontSize: 9 } },
                            { content: familyData + observations, styles: { fontSize: 8 } },
                            b.address
                        ]);

                        const imgs = [...(b.photos || [])];
                        if (b.pastorPhoto) imgs.push(b.pastorPhoto);

                        if (imgs.length > 0) {
                            const imgW = 40;
                            const imgH = 30;
                            const perRow = 4;
                            const numRows = Math.ceil(imgs.length / perRow);
                            const rowH = (imgH + 5) * numRows + 5;

                            tableData.push([
                                {
                                    content: '',
                                    colSpan: 4,
                                    styles: { minCellHeight: rowH },
                                    _images: imgs,
                                    _config: { w: imgW, h: imgH, gap: 5, perRow: perRow }
                                }
                            ]);
                        }
                    });

                    doc.autoTable({
                        startY: 55,
                        head: [['Iglesia', 'Pastor / Denom', 'Familia / Observaciones', 'Dirección']],
                        body: tableData,
                        didDrawCell: (data) => {
                            if (data.cell.raw && data.cell.raw._images && data.column.index === 0 && data.cell.section === 'body') {
                                const { _images, _config } = data.cell.raw;
                                _images.forEach((img, i) => {
                                    const rowIdx = Math.floor(i / _config.perRow);
                                    const colIdx = i % _config.perRow;
                                    const xPos = data.cell.x + 2 + colIdx * (_config.w + _config.gap);
                                    const yPos = data.cell.y + 2 + rowIdx * (_config.h + _config.gap);
                                    try {
                                        doc.addImage(img, 'JPEG', xPos, yPos, _config.w, _config.h);
                                    } catch (err) { console.error("PDF image error", err); }
                                });
                            }
                        }
                    });

                    doc.save(`reporte_beneficiarios.pdf`);
                } catch (e) {
                    alert("Error al generar el PDF de beneficiarios.");
                    console.error(e);
                }
            };

            const downloadExcel = () => {
                try {
                    const data = [];
                    beneficiaries.forEach(b => {
                        // Flat row for basic info
                        const row = {
                            'Iglesia': b.churchName,
                            'Dirección': b.address,
                            'Denominación': b.denomination,
                            'Pastor': b.pastorName,
                            'Tel Pastor': b.pastorPhone,
                            'Edad Pastor': b.pastorAge,
                            'Esposa': b.spouseName,
                            'Edad Esposa': b.spouseAge,
                            'Tel Esposa': b.spousePhone,
                            'Observaciones': b.observations,
                            'Hijos': b.children?.map(c => `${c.name} (${c.age} años - ${c.education})`).join('; ') || ''
                        };
                        data.push(row);
                    });
                    const ws = XLSX.utils.json_to_sheet(data);
                    const wb = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(wb, ws, "Beneficiarios");
                    XLSX.writeFile(wb, `beneficiarios.xlsx`);
                } catch (e) {
                    alert("Error al generar Excel.");
                    console.error(e);
                }
            };

            const downloadWord = async () => {
                try {
                    const docxLib = window.docx;
                    if (!docxLib) throw new Error("Librería de Word no cargada");
                    const { Document, Packer, Paragraph, TextRun, Table, TableRow, TableCell, WidthType } = docxLib;

                    const childrenTableContents = (children) => {
                        if (!children || children.length === 0) return [new Paragraph("Sin hijos registrados")];

                        const tableRows = [
                            new TableRow({
                                children: [
                                    new TableCell({ children: [new Paragraph({ children: [new TextRun({ text: "Nombre", bold: true })] })] }),
                                    new TableCell({ children: [new Paragraph({ children: [new TextRun({ text: "Edad", bold: true })] })] }),
                                    new TableCell({ children: [new Paragraph({ children: [new TextRun({ text: "Escolaridad", bold: true })] })] }),
                                ]
                            })
                        ];

                        children.forEach(c => {
                            tableRows.push(new TableRow({
                                children: [
                                    new TableCell({ children: [new Paragraph(c.name || "")] }),
                                    new TableCell({ children: [new Paragraph(c.age ? c.age.toString() : "")] }),
                                    new TableCell({ children: [new Paragraph(c.education || "")] }),
                                ]
                            }));
                        });

                        return [new Table({ width: { size: 100, type: WidthType.PERCENTAGE }, rows: tableRows })];
                    };

                    const docChildren = [
                        new Paragraph({ children: [new TextRun({ text: "INFORME DETALLADO DE BENEFICIARIOS", bold: true, size: 36 })] }),
                        new Paragraph({ text: `Generado por: ${user.name}` }),
                        new Paragraph({ text: "" }),
                    ];

                    beneficiaries.forEach(b => {
                        docChildren.push(
                            new Paragraph({ children: [new TextRun({ text: b.churchName, bold: true, size: 28, color: "2563eb" })] }),
                            new Paragraph({ text: `Dirección: ${b.address}` }),
                            new Paragraph({ text: `Denominación: ${b.denomination || "N/A"}` }),
                            new Paragraph({ text: "" }),
                            new Paragraph({ children: [new TextRun({ text: "DATOS DEL PASTOR", bold: true })] }),
                            new Paragraph({ text: `Nombre: ${b.pastorName} (${b.pastorAge || "?"} años)` }),
                            new Paragraph({ text: `Teléfono: ${b.pastorPhone}` }),
                            new Paragraph({ text: "" }),
                            new Paragraph({ children: [new TextRun({ text: "DATOS FAMILIARES", bold: true })] }),
                            new Paragraph({ text: `Esposa: ${b.spouseName || "N/A"} (${b.spouseAge || "?"} años) - Tel: ${b.spousePhone || "N/A"}` }),
                            new Paragraph({ text: "Hijos:" }),
                            ...childrenTableContents(b.children),
                            new Paragraph({ text: "" }),
                            new Paragraph({ children: [new TextRun({ text: "OBSERVACIONES", bold: true })] }),
                            new Paragraph({ text: b.observations || "Sin observaciones" }),
                            new Paragraph({ text: "_________________________________________________________________________" }),
                            new Paragraph({ text: "" })
                        );
                    });

                    const doc = new Document({
                        sections: [{
                            properties: {},
                            children: docChildren
                        }]
                    });

                    const blob = await Packer.toBlob(doc);
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    a.href = url;
                    a.download = `beneficiarios.docx`;
                    a.click();
                    URL.revokeObjectURL(url);
                } catch (e) {
                    alert("Error al generar Word: " + e.message);
                    console.error(e);
                }
            };

            const handleEdit = (item) => {
                setEditingItem(item);
                setViewMode('form');
            };

            const handleDelete = (id) => {
                if (confirm('¿Está seguro de eliminar este registro?')) {
                    deleteBeneficiary(id);
                }
            };

            if (viewMode === 'form') {
                return (
                    <BeneficiaryForm
                        initialData={editingItem}
                        onSubmit={(data) => {
                            if (editingItem) updateBeneficiary(data);
                            else addBeneficiary(data);
                            setViewMode('list');
                            setEditingItem(null);
                        }}
                        onCancel={() => {
                            setViewMode('list');
                            setEditingItem(null);
                        }}
                    />
                );
            }

            return (
                <div className="space-y-6">
                    <div className="flex justify-between items-center">
                        <div>
                            <h2 className="text-2xl font-bold text-gray-800">Registro de Beneficiarios (Iglesias)</h2>
                            <p className="text-gray-500">Censo y control de iglesias y pastores</p>
                        </div>
                        <div className="flex space-x-2">
                            <div className="flex bg-slate-800 rounded-lg p-1">
                                <button onClick={() => downloadPDF()} title="PDF" className="text-white p-2 hover:bg-red-600 rounded transition">
                                    <Icon name="file-text" size={18} />
                                </button>
                                <button onClick={() => downloadExcel()} title="Excel" className="text-white p-2 hover:bg-emerald-600 rounded transition">
                                    <Icon name="file-spreadsheet" size={18} />
                                </button>
                                <button onClick={() => downloadWord()} title="Word" className="text-white p-2 hover:bg-blue-600 rounded transition">
                                    <Icon name="file-text" size={18} />
                                </button>
                            </div>
                            <button onClick={() => { setEditingItem(null); setViewMode('form'); }} className="bg-blue-600 text-white px-4 py-2 rounded-lg flex items-center space-x-2 shadow hover:bg-blue-700 transition">
                                <Icon name="plus" size={18} />
                                <span>Nuevo Registro</span>
                            </button>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        {beneficiaries.map(b => (
                            <div key={b.id} className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-md transition">
                                <div className="h-32 bg-gray-200 relative">
                                    {b.photos && b.photos.length > 0 ? (
                                        <img src={b.photos[0]} className="w-full h-full object-cover" />
                                    ) : (
                                        <div className="flex items-center justify-center h-full text-gray-400">
                                            <Icon name="image" size={40} />
                                        </div>
                                    )}
                                    <div className="absolute top-2 right-2 bg-white/90 p-1 rounded-lg backdrop-blur text-xs font-bold shadow-sm">
                                        ID: {b.id.slice(-4)}
                                    </div>
                                </div>
                                <div className="p-5">
                                    <h3 className="font-bold text-lg text-gray-800 mb-1">{b.churchName}</h3>
                                    <p className="text-sm text-gray-500 mb-4 flex items-center gap-1"><Icon name="map-pin" size={12} /> {b.address}</p>

                                    <div className="space-y-2 text-sm text-gray-600">
                                        <div className="flex justify-between">
                                            <span className="font-medium">Pastor:</span>
                                            <span>{b.pastorName}</span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span className="font-medium">Teléfono:</span>
                                            <span>{b.pastorPhone}</span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span className="font-medium">Denominación:</span>
                                            <span>{b.denomination}</span>
                                        </div>
                                    </div>

                                    <div className="mt-4 pt-4 border-t flex justify-between items-center">
                                        {b.location && b.location.lat ? (
                                            <a href={`https://www.google.com/maps?q=${b.location.lat},${b.location.lng}`} target="_blank" className="text-blue-600 text-xs font-bold flex items-center gap-1 hover:underline">
                                                <Icon name="map" size={12} /> Ver Mapa
                                            </a>
                                        ) : <span className="text-gray-400 text-xs">Sin ubicación</span>}

                                        <div className="flex space-x-2">
                                            <button onClick={() => handleEdit(b)} title="Editar" className="p-2 text-blue-600 hover:bg-blue-50 rounded-full transition"><Icon name="edit" size={16} /></button>
                                            <button onClick={() => handleDelete(b.id)} title="Eliminar" className="p-2 text-red-600 hover:bg-red-50 rounded-full transition"><Icon name="trash-2" size={16} /></button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const BeneficiaryForm = ({ initialData, onSubmit, onCancel }) => {
            const [form, setForm] = useState(initialData || {
                churchName: '', address: '', denomination: '',
                location: { lat: null, lng: null },
                pastorName: '', pastorPhone: '', pastorAge: '', pastorPhoto: null,
                spouseName: '', spouseAge: '', spousePhone: '',
                children: [], // { name, age, education }
                photos: [],
                observations: ''
            });

            // Tabs: 'church', 'pastor', 'family'
            const [activeTab, setActiveTab] = useState('church');

            const handleLocation = () => {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(position => {
                        setForm(prev => ({
                            ...prev,
                            location: {
                                lat: position.coords.latitude,
                                lng: position.coords.longitude
                            }
                        }));
                        alert("Ubicación capturada correctamente.");
                    }, (err) => {
                        alert("Error obteniendo ubicación. Asegúrese de dar permisos.");
                        console.error(err);
                    });
                } else {
                    alert("Su navegador no soporta geolocalización.");
                }
            };

            const handlePhotos = async (e) => {
                const files = Array.from(e.target.files);
                if (files.length > 0) {
                    const compressed = await Promise.all(files.map(f => compressImage(f, 800, 0.7)));
                    setForm(prev => ({ ...prev, photos: [...prev.photos, ...compressed] }));
                }
            };

            const handlePastorPhoto = async (e) => {
                const file = e.target.files[0];
                if (file) {
                    const compressed = await compressImage(file, 600, 0.6);
                    setForm(prev => ({ ...prev, pastorPhoto: compressed }));
                }
            };

            const addChild = () => {
                setForm(prev => ({ ...prev, children: [...prev.children, { name: '', age: '', education: '' }] }));
            };

            const updateChild = (index, field, value) => {
                const newChildren = [...form.children];
                newChildren[index][field] = value;
                setForm(prev => ({ ...prev, children: newChildren }));
            };

            const removeChild = (index) => {
                const newChildren = form.children.filter((_, i) => i !== index);
                setForm(prev => ({ ...prev, children: newChildren }));
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                onSubmit(form);
            };

            const TabButton = ({ id, label, icon }) => (
                <button type="button" onClick={() => setActiveTab(id)}
                    className={`flex-1 p-3 text-sm font-bold flex items-center justify-center gap-2 border-b-2 transition ${activeTab === id ? 'border-blue-600 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700'}`}>
                    <Icon name={icon} size={16} /> {label}
                </button>
            );

            return (
                <div className="max-w-4xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden">
                    <div className="bg-gray-50 p-4 border-b flex justify-between items-center">
                        <h2 className="font-bold text-gray-800 text-lg">
                            {initialData ? 'Editar Registro' : 'Nuevo Registro de Beneficiario'}
                        </h2>
                        <button onClick={onCancel} className="text-gray-500 hover:text-gray-700"><Icon name="x" /></button>
                    </div>

                    <div className="flex border-b">
                        <TabButton id="church" label="Datos Iglesia" icon="home" />
                        <TabButton id="pastor" label="Datos Pastor" icon="user" />
                        <TabButton id="family" label="Familia" icon="users" />
                    </div>

                    <form onSubmit={handleSubmit} className="p-6">
                        {activeTab === 'church' && (
                            <div className="space-y-4 animate-fade-in">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Nombre de la Iglesia</label>
                                    <input required className="w-full p-2 border rounded-lg" value={form.churchName} onChange={e => setForm({ ...form, churchName: e.target.value })} />
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">Dirección</label>
                                        <input required className="w-full p-2 border rounded-lg" value={form.address} onChange={e => setForm({ ...form, address: e.target.value })} />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">Denominación</label>
                                        <input className="w-full p-2 border rounded-lg" value={form.denomination} onChange={e => setForm({ ...form, denomination: e.target.value })} />
                                    </div>
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Ubicación GPS</label>
                                    <div className="flex items-center space-x-3">
                                        <button type="button" onClick={handleLocation} className="bg-green-600 text-white px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-2 hover:bg-green-700 transition">
                                            <Icon name="map-pin" size={16} /> Capturar Ubicación
                                        </button>
                                        {form.location.lat && <span className="text-sm text-green-600 font-medium">Lat: {form.location.lat.toFixed(5)}, Lng: {form.location.lng.toFixed(5)}</span>}
                                    </div>
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Fotos de la Iglesia</label>
                                    <div className="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center cursor-pointer hover:bg-gray-50 relative">
                                        <input type="file" multiple onChange={handlePhotos} className="absolute inset-0 opacity-0 cursor-pointer" />
                                        <Icon name="camera" className="mx-auto text-gray-400 mb-2" />
                                        <p className="text-sm text-gray-500">Click para subir fotos</p>
                                    </div>
                                    {form.photos.length > 0 && (
                                        <div className="flex gap-2 mt-2 overflow-x-auto pb-2">
                                            {form.photos.map((p, i) => (
                                                <img key={i} src={p} className="h-20 w-20 object-cover rounded shadow-md border" />
                                            ))}
                                        </div>
                                    )}
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Observaciones Generales</label>
                                    <textarea className="w-full p-2 border rounded-lg h-24" value={form.observations} onChange={e => setForm({ ...form, observations: e.target.value })}></textarea>
                                </div>
                            </div>
                        )}

                        {activeTab === 'pastor' && (
                            <div className="space-y-4 animate-fade-in">
                                <div className="flex items-start gap-6">
                                    <div className="text-center">
                                        <div className="relative group w-32 h-32 mx-auto bg-gray-200 rounded-full overflow-hidden mb-2">
                                            {form.pastorPhoto ?
                                                <img src={form.pastorPhoto} className="w-full h-full object-cover" /> :
                                                <div className="flex items-center justify-center h-full text-gray-400"><Icon name="user" size={48} /></div>
                                            }
                                            <input type="file" onChange={handlePastorPhoto} className="absolute inset-0 opacity-0 cursor-pointer" />
                                            <div className="absolute inset-0 bg-black/30 flex items-center justify-center opacity-0 group-hover:opacity-100 transition text-white text-xs pointer-events-none">Cambiar</div>
                                        </div>
                                        <span className="text-sm text-gray-500">Foto Pastor</span>
                                    </div>
                                    <div className="flex-1 space-y-4">
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">Nombre Completo del Pastor</label>
                                            <input required className="w-full p-2 border rounded-lg" value={form.pastorName} onChange={e => setForm({ ...form, pastorName: e.target.value })} />
                                        </div>
                                        <div className="grid grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-sm font-medium text-gray-700 mb-1">Número de Celular</label>
                                                <input className="w-full p-2 border rounded-lg" value={form.pastorPhone} onChange={e => setForm({ ...form, pastorPhone: e.target.value })} />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-medium text-gray-700 mb-1">Edad</label>
                                                <input type="number" className="w-full p-2 border rounded-lg" value={form.pastorAge} onChange={e => setForm({ ...form, pastorAge: e.target.value })} />
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div className="border-t pt-4">
                                    <h3 className="font-bold text-gray-800 mb-3 flex items-center gap-2"><Icon name="heart" size={16} /> Datos de la Esposa</h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">Nombre Completo</label>
                                            <input className="w-full p-2 border rounded-lg" value={form.spouseName} onChange={e => setForm({ ...form, spouseName: e.target.value })} />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">Edad</label>
                                            <input type="number" className="w-full p-2 border rounded-lg" value={form.spouseAge} onChange={e => setForm({ ...form, spouseAge: e.target.value })} />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">Celular</label>
                                            <input className="w-full p-2 border rounded-lg" value={form.spousePhone} onChange={e => setForm({ ...form, spousePhone: e.target.value })} />
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'family' && (
                            <div className="space-y-4 animate-fade-in">
                                <div className="flex justify-between items-center mb-2">
                                    <h3 className="font-bold text-gray-800">Hijos del Pastor</h3>
                                    <button type="button" onClick={addChild} className="text-blue-600 font-bold text-sm flex items-center gap-1 hover:underline">
                                        <Icon name="plus" size={16} /> Agregar Hijo
                                    </button>
                                </div>

                                {form.children.length === 0 ? (
                                    <div className="text-center py-8 bg-gray-50 rounded-lg text-gray-400 text-sm">
                                        No se han registrado hijos
                                    </div>
                                ) : (
                                    <div className="space-y-3">
                                        {form.children.map((child, index) => (
                                            <div key={index} className="flex gap-2 items-start bg-gray-50 p-2 rounded-lg">
                                                <div className="flex-1">
                                                    <input placeholder="Nombre Completo" className="w-full p-2 border rounded text-sm mb-1" value={child.name} onChange={e => updateChild(index, 'name', e.target.value)} />
                                                </div>
                                                <div className="w-20">
                                                    <input type="number" placeholder="Edad" className="w-full p-2 border rounded text-sm" value={child.age} onChange={e => updateChild(index, 'age', e.target.value)} />
                                                </div>
                                                <div className="w-1/3">
                                                    <input placeholder="Escolaridad" className="w-full p-2 border rounded text-sm" value={child.education} onChange={e => updateChild(index, 'education', e.target.value)} />
                                                </div>
                                                <button type="button" onClick={() => removeChild(index)} className="p-2 text-red-500 hover:bg-red-100 rounded">
                                                    <Icon name="trash-2" size={16} />
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}

                        <div className="mt-8 pt-4 border-t flex justify-end gap-3">
                            <button type="button" onClick={onCancel} className="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg transition font-medium">Cancelar</button>
                            <button type="submit" className="bg-blue-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-blue-700 transition shadow-lg">
                                Guardar Registro
                            </button>
                        </div>
                    </form>
                </div>
            );
        };

        // --- VIEWS ---


        const ActivityForm = ({ initialData, onSubmit, onCancel }) => {
            const [form, setForm] = useState(initialData || {
                title: '', description: '', beneficiaries: 0,
                beneficiariesMen: 0, beneficiariesWomen: 0, beneficiariesChildren: 0,
                cost: 0, costType: 'Institution',
                budgetLine: '', fundingSource: 'Fuentes Propias',
                snipCode: '', nogNpg: '', strategicAxis: '', physicalProgress: 0,
                community: '', donor: '', collaborators: '',
                responsiblePerson: '',
                date: new Date().toISOString().split('T')[0], time: '12:00',
                images: [], status: 'Realizada'
            });

            const handleImage = async (e) => {
                const files = Array.from(e.target.files);
                if (files.length > 0) {
                    try {
                        const compressedFiles = await Promise.all(
                            files.map(file => compressImage(file, 800, 0.7))
                        );
                        setForm(prev => ({ ...prev, images: [...prev.images, ...compressedFiles] }));
                    } catch (err) {
                        console.error("Error compression", err);
                    }
                }
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                // Ensure beneficiaries total is correct
                const total = (parseInt(form.beneficiariesMen) || 0) + (parseInt(form.beneficiariesWomen) || 0) + (parseInt(form.beneficiariesChildren) || 0);
                onSubmit({ ...form, beneficiaries: total > 0 ? total : form.beneficiaries });
            };

            return (
                <form onSubmit={handleSubmit} className="space-y-8">
                    {/* Section 1: Información General */}
                    <div className="bg-gray-50/50 p-6 rounded-xl border border-gray-100">
                        <h3 className="text-gray-900 font-bold mb-4 flex items-center gap-2">
                            <Icon name="info" size={18} className="text-blue-600" />
                            Información General de la Actividad
                        </h3>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div className="md:col-span-2">
                                <label className="block text-sm font-medium text-gray-700 mb-1">Nombre de la Actividad / Proyecto</label>
                                <input required className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                    value={form.title} onChange={e => setForm({ ...form, title: e.target.value })}
                                    placeholder="Nombre oficial del proyecto o actividad" />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Lugar / Comunidad (Puerto Barrios)</label>
                                <input required className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                    value={form.community} onChange={e => setForm({ ...form, community: e.target.value })}
                                    placeholder="Barrio, Aldea o Caserío" />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Fecha y Hora</label>
                                <div className="grid grid-cols-2 gap-2">
                                    <input required type="date" className="w-full p-3 border border-gray-300 rounded-lg"
                                        value={form.date} onChange={e => setForm({ ...form, date: e.target.value })} />
                                    <input required type="time" className="w-full p-3 border border-gray-300 rounded-lg"
                                        value={form.time} onChange={e => setForm({ ...form, time: e.target.value })} />
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Section 2: Transparencia y Presupuesto (CGC) */}
                    <div className="bg-blue-50/30 p-6 rounded-xl border border-blue-100">
                        <h3 className="text-blue-900 font-bold mb-4 flex items-center gap-2">
                            <Icon name="shield-check" size={18} className="text-blue-600" />
                            Transparencia y Ejecución Presupuestaria (CGC)
                        </h3>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Renglón Presupuestario</label>
                                <input required className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                    value={form.budgetLine} onChange={e => setForm({ ...form, budgetLine: e.target.value })}
                                    placeholder="Ej: 011, 189, 211" />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Fuente de Financiamiento</label>
                                <select className="w-full p-3 border border-gray-300 rounded-lg"
                                    value={form.fundingSource} onChange={e => setForm({ ...form, fundingSource: e.target.value })}>
                                    <option value="Fuentes Propias">Fuentes Propias / Ingresos Corrientes</option>
                                    <option value="Situado Constitucional">Situado Constitucional (Funcionamiento)</option>
                                    <option value="Situado Constitucional Inversión">Situado Constitucional (Inversión)</option>
                                    <option value="IVA-PAZ">IVA-PAZ</option>
                                    <option value="CODEDE">Aporte CODEDE</option>
                                    <option value="Donación">Donación (Interna / Externa)</option>
                                    <option value="Cooperación Internacional">Cooperación Internacional</option>
                                    <option value="Crédito Público">Crédito Público / Préstamos</option>
                                    <option value="Alianzas Público-Privadas">Alianzas Público-Privadas</option>
                                    <option value="Gobierno Central">Aportes del Gobierno Central (Otros)</option>
                                </select>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Estado de Ejecución</label>
                                <select className="w-full p-3 border border-gray-300 rounded-lg"
                                    value={form.status} onChange={e => setForm({ ...form, status: e.target.value })}>
                                    <option value="Realizada">Finalizada / Ejecutada</option>
                                    <option value="Programada">En Proceso / Programada</option>
                                </select>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Código SNIP (Si aplica)</label>
                                <input className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                    value={form.snipCode} onChange={e => setForm({ ...form, snipCode: e.target.value })}
                                    placeholder="Código de inversión" />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">NOG / NPG (Guatecompras)</label>
                                <input className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                    value={form.nogNpg} onChange={e => setForm({ ...form, nogNpg: e.target.value })}
                                    placeholder="Número de Operación" />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Eje Estratégico PDM-OT</label>
                                <select className="w-full p-3 border border-gray-300 rounded-lg"
                                    value={form.strategicAxis} onChange={e => setForm({ ...form, strategicAxis: e.target.value })}>
                                    <option value="">-- Seleccione Eje K'atun 2032 --</option>
                                    <option value="Guatemala urbana y rural">1. Guatemala urbana y rural (Gestión Territorial)</option>
                                    <option value="Bienestar para la gente">2. Bienestar para la gente (Desarrollo Humano)</option>
                                    <option value="Riqueza para todos y todas">3. Riqueza para todos y todas (Desarrollo Económico)</option>
                                    <option value="Recursos naturales para hoy y para el futuro">4. Recursos naturales para hoy y para el futuro (Ambiente)</option>
                                    <option value="Estado garante de los derechos humanos y conductor del desarrollo">5. Estado garante de los derechos humanos y conductor del desarrollo (Institucionalidad)</option>
                                </select>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Responsable de la Actividad</label>
                                <input className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                    value={form.responsiblePerson} onChange={e => setForm({ ...form, responsiblePerson: e.target.value })}
                                    placeholder="Nombre del funcionario" />
                            </div>
                            {form.fundingSource === 'Donación' && (
                                <div className="animate-fade-in">
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Nombre del Donante</label>
                                    <input required className="w-full p-3 border border-blue-300 bg-blue-50 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                        value={form.donor} onChange={e => setForm({ ...form, donor: e.target.value })}
                                        placeholder="Persona o Institución" />
                                </div>
                            )}
                            <div className="flex space-x-2">
                                <div className="flex-1">
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Costo (Q)</label>
                                    <input type="number" min="0" step="0.01" className="w-full p-3 border border-gray-300 rounded-lg"
                                        value={form.cost} onChange={e => setForm({ ...form, cost: parseFloat(e.target.value) })} />
                                </div>
                                <div className="w-24">
                                    <label className="block text-sm font-medium text-gray-700 mb-1">% Avance</label>
                                    <input type="number" min="0" max="100" className="w-full p-3 border border-gray-300 rounded-lg"
                                        value={form.physicalProgress} onChange={e => setForm({ ...form, physicalProgress: parseInt(e.target.value) })} />
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Section 3: Impacto Social y Beneficiarios */}
                    <div className="bg-emerald-50/30 p-6 rounded-xl border border-emerald-100">
                        <h3 className="text-emerald-900 font-bold mb-4 flex items-center gap-2">
                            <Icon name="users" size={18} className="text-emerald-600" />
                            Impacto Social y Beneficiarios (Metas)
                        </h3>
                        <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Hombres</label>
                                <input type="number" min="0" className="w-full p-3 border border-emerald-200 rounded-lg"
                                    value={form.beneficiariesMen} onChange={e => setForm({ ...form, beneficiariesMen: parseInt(e.target.value) })} />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Mujeres</label>
                                <input type="number" min="0" className="w-full p-3 border border-emerald-200 rounded-lg"
                                    value={form.beneficiariesWomen} onChange={e => setForm({ ...form, beneficiariesWomen: parseInt(e.target.value) })} />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Niños / Jóvenes</label>
                                <input type="number" min="0" className="w-full p-3 border border-emerald-200 rounded-lg"
                                    value={form.beneficiariesChildren} onChange={e => setForm({ ...form, beneficiariesChildren: parseInt(e.target.value) })} />
                            </div>
                            <div className="bg-emerald-100/50 p-3 rounded-lg flex flex-col justify-center text-center">
                                <span className="text-xs font-bold text-emerald-700 uppercase">Total Beneficiarios</span>
                                <span className="text-2xl font-black text-emerald-900">
                                    {(parseInt(form.beneficiariesMen) || 0) + (parseInt(form.beneficiariesWomen) || 0) + (parseInt(form.beneficiariesChildren) || 0)}
                                </span>
                            </div>
                        </div>
                        <div className="mt-4">
                            <label className="block text-sm font-medium text-gray-700 mb-1">Colaboradores / Instituciones de Apoyo</label>
                            <input className="w-full p-3 border border-emerald-200 rounded-lg"
                                placeholder="Ej: SESAN, MAGA, MSPAS, etc."
                                value={form.collaborators} onChange={e => setForm({ ...form, collaborators: e.target.value })} />
                        </div>
                    </div>

                    {/* Section 4: Descripción y Evidencia */}
                    <div className="space-y-4">
                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1 font-bold">Descripción Circunstanciada (Requerido por Auditoría)</label>
                            <textarea required rows="4" className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                placeholder="Describa de forma detallada el qué, cómo, cuándo y dónde de la actividad..."
                                value={form.description} onChange={e => setForm({ ...form, description: e.target.value })}></textarea>
                        </div>

                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1 font-bold">
                                Evidencia Fotográfica {form.status === 'Realizada' ? '(Mínimo 12 fotos sugeridas para CGC)' : '(Opcional)'}
                            </label>
                            <div className="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center hover:bg-gray-50 transition cursor-pointer relative shadow-inner">
                                <input type="file" multiple accept="image/*" onChange={handleImage} className="absolute inset-0 opacity-0 cursor-pointer z-10" />
                                <div className="pointer-events-none">
                                    <Icon name="upload-cloud" className="mx-auto text-blue-500 mb-2" size={32} />
                                    <p className="text-sm text-gray-500 font-medium">Cargar fotos de campo para transparencia</p>
                                    <p className="text-xs text-gray-400 mt-1">Soporta múltiples archivos a la vez</p>
                                </div>
                            </div>

                            {form.images && form.images.length > 0 && (
                                <div className="grid grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-2 mt-4">
                                    {form.images.map((img, idx) => (
                                        <div key={idx} className="relative aspect-square rounded-lg overflow-hidden border border-gray-200 group shadow-sm">
                                            <img src={img} className="w-full h-full object-cover" />
                                            <button
                                                type="button"
                                                onClick={() => setForm(prev => ({ ...prev, images: prev.images.filter((_, i) => i !== idx) }))}
                                                className="absolute top-1 right-1 bg-red-500 text-white p-1 rounded-full opacity-0 group-hover:opacity-100 transition shadow-sm z-20"
                                            >
                                                <Icon name="x" size={10} />
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>

                    <div className="flex justify-end space-x-3 pt-6 border-t">
                        {onCancel && (
                            <button type="button" onClick={onCancel} className="bg-gray-200 text-gray-700 px-6 py-3 rounded-lg font-bold hover:bg-gray-300 transition">
                                Cancelar
                            </button>
                        )}
                        <button type="submit" className="bg-blue-600 text-white px-10 py-3 rounded-lg font-extrabold hover:bg-blue-700 shadow-xl transition transform hover:scale-105">
                            {initialData ? 'Actualizar Registro CGC' : 'Finalizar Registro de Transparencia'}
                        </button>
                    </div>
                </form>
            );
        };

        const ActivityCard = ({ activity, onEdit, onDelete }) => {
            const { generateSocialPost } = useContext(AppContext);
            const getStatusColor = (s) => s === 'Realizada' ? 'bg-green-100 text-green-700' : 'bg-blue-100 text-blue-700';

            return (
                <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-md transition">
                    <div className="h-48 bg-gray-200 relative">
                        {activity.images && activity.images.length > 0 ? (
                            <img src={activity.images[0]} className="w-full h-full object-cover" />
                        ) : (
                            <div className="flex items-center justify-center h-full text-gray-400 bg-slate-100">
                                <Icon name="image" size={48} />
                            </div>
                        )}
                        <div className={`absolute top-3 right-3 px-3 py-1 rounded-full text-[10px] font-bold uppercase shadow-sm ${getStatusColor(activity.status)}`}>
                            {activity.status}
                        </div>
                    </div>

                    <div className="p-6">
                        <div className="flex justify-between items-start mb-2">
                            <span className="text-[10px] font-black text-blue-600 uppercase tracking-widest">{activity.strategicAxis || 'Eje no definido'}</span>
                            <span className="text-xs text-gray-400 font-medium">{activity.date}</span>
                        </div>

                        <h3 className="font-bold text-gray-800 text-lg mb-2 leading-tight">{activity.title}</h3>
                        <p className="text-gray-500 text-sm line-clamp-2 mb-4">{activity.description}</p>

                        <div className="grid grid-cols-2 gap-4 mb-4 p-3 bg-gray-50 rounded-xl">
                            <div className="text-center">
                                <p className="text-[10px] text-gray-400 font-bold uppercase">Beneficiarios</p>
                                <p className="text-sm font-black text-gray-800">{activity.beneficiaries || 0}</p>
                            </div>
                            <div className="text-center">
                                <p className="text-[10px] text-gray-400 font-bold uppercase">Costo (Q)</p>
                                <p className="text-sm font-black text-blue-600">{(activity.cost || 0).toLocaleString()}</p>
                            </div>
                        </div>

                        <div className="flex items-center justify-between pt-4 border-t border-gray-100">
                            <div className="flex items-center gap-2">
                                <div className="w-10 bg-gray-200 h-1.5 rounded-full overflow-hidden">
                                    <div className="bg-blue-600 h-full" style={{ width: `${activity.physicalProgress || 0}%` }}></div>
                                </div>
                                <span className="text-[10px] font-bold text-gray-500">{activity.physicalProgress || 0}%</span>
                            </div>
                            <div className="flex space-x-1">
                                <button onClick={onEdit} className="p-2 text-blue-600 hover:bg-blue-50 rounded-lg transition"><Icon name="edit" size={18} /></button>
                                <button onClick={() => generateSocialPost(activity)} className="p-2 text-indigo-600 hover:bg-indigo-50 rounded-lg transition" title="Generar Post Social"><Icon name="share-2" size={18} /></button>
                                <button onClick={onDelete} className="p-2 text-red-600 hover:bg-red-50 rounded-lg transition"><Icon name="trash-2" size={18} /></button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const ActivitiesView = () => {
            const { activities, addActivity, updateActivity, deleteActivity } = useContext(AppContext);
            const [mode, setMode] = useState('list'); // list | create | edit
            const [editingActivity, setEditingActivity] = useState(null);

            const handleCreate = (formData) => {
                if (mode === 'edit') {
                    updateActivity(formData);
                } else {
                    addActivity(formData);
                }
                setMode('list');
                setEditingActivity(null);
            };

            const handleEdit = (act) => {
                setEditingActivity(act);
                setMode('edit');
            };

            const handleDelete = (id) => {
                if (confirm('¿Estás seguro de que deseas eliminar esta actividad?')) {
                    deleteActivity(id);
                }
            };

            return (
                <div className="max-w-6xl mx-auto">
                    <div className="flex justify-between items-center mb-6">
                        <h2 className="text-2xl font-bold text-gray-800">Cápitulo de Gestión</h2>
                        {mode === 'list' && (
                            <button onClick={() => setMode('create')} className="bg-blue-600 text-white px-4 py-2 rounded-lg flex items-center space-x-2 text-sm font-medium hover:bg-blue-700 shadow-lg transition transform hover:scale-105">
                                <Icon name="plus" size={18} />
                                <span>Nueva Actividad</span>
                            </button>
                        )}
                        {(mode === 'create' || mode === 'edit') && (
                            <button onClick={() => { setMode('list'); setEditingActivity(null); }} className="text-gray-600 px-4 py-2 rounded-lg flex items-center space-x-2 text-sm font-medium hover:bg-gray-200 transition">
                                <Icon name="arrow-left" size={18} />
                                <span>Volver al Listado</span>
                            </button>
                        )}
                    </div>

                    {mode === 'list' ? (
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            {activities.sort((a, b) => new Date(b.date) - new Date(a.date)).map(act => (
                                <ActivityCard key={act.id} activity={act} onEdit={() => handleEdit(act)} onDelete={() => handleDelete(act.id)} />
                            ))}
                        </div>
                    ) : (
                        <div className="bg-white p-8 rounded-2xl shadow-xl border border-gray-100">
                            <ActivityForm initialData={editingActivity} onSubmit={handleCreate} onCancel={() => { setMode('list'); setEditingActivity(null); }} />
                        </div>
                    )}
                </div>
            );
        };

        const InventoryView = () => {
            const { inventory, addInventory, updateInventory, deleteInventory } = useContext(AppContext);
            const [mode, setMode] = useState('list');
            const [editingItem, setEditingItem] = useState(null);

            const handleSave = (item) => {
                if (editingItem) updateInventory(item);
                else addInventory(item);
                setMode('list');
                setEditingItem(null);
            };

            if (mode === 'form') {
                return (
                    <div className="max-w-4xl mx-auto bg-white p-8 rounded-2xl shadow-xl border border-gray-100">
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-xl font-bold text-gray-800">{editingItem ? 'Editar Activo' : 'Nuevo Activo Institucional'}</h2>
                            <button onClick={() => setMode('list')} className="text-gray-500 hover:text-gray-700"><Icon name="x" /></button>
                        </div>
