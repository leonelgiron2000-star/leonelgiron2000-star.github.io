<body class="bg-gray-50 text-slate-800 font-sans antialiased">
    <div id="global-error"
        style="display:none; position:fixed; top:0; left:0; right:0; background:#ef4444; color:white; padding:1rem; z-index:9999;">

    <script type="text/babel">
        const { useState, useEffect, useMemo, createContext, useContext } = React;
        const APP_VERSION = "1.2.0-merge-safe"; // Updated version to track sync fixes

        // Safe Recharts import
        const R = window.Recharts || {};
        const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, BarChart, Bar, PieChart, Pie, Cell } = R;
        // Mock components if Recharts fails
        const SafeBarChart = BarChart || (() => null);
        const SafeBar = Bar || (() => null);
        const SafeXAxis = XAxis || (() => null);
        const SafeYAxis = YAxis || (() => null);
        const SafeTooltip = Tooltip || (() => null);
        const SafeCartesianGrid = CartesianGrid || (() => null);
        const SafeResponsiveContainer = ResponsiveContainer || (({ children }) => <div>{children}</div>);
        const SafePieChart = PieChart || (() => null);
        const SafePie = Pie || (() => null);
        const SafeCell = Cell || (() => null);

        // --- ICONS WRAPPER ---

        // --- ICONS WRAPPER ---
        // Lucide icons are injected globally by the script, but for React we usually need components.
        // We will create a helper component to render Lucide icons dynamically.
        const Icon = ({ name, size = 24, className = "" }) => {
            const ref = React.useRef(null);

            useEffect(() => {
                if (ref.current) {
                    // Force Lucide to only replace the <i> tag inside THIS component
                    lucide.createIcons({
                        root: ref.current,
                        nameAttr: 'data-lucide',
                        attrs: {
                            class: className,
                            width: size,
                            height: size
                        }
                    });
                }
            }, [name, size, className]);

            // React renders a SPAN. Inside is an I tag on first render.
            // Lucide replaces the I tag with SVG.
            // React still controls the SPAN, so it can safely remove the SPAN when unmounting.
            return (
                <span ref={ref} className="inline-flex items-center justify-center">
                    <i data-lucide={name}></i>
                </span>
            );
        };

        // --- MOCK DATA / STORAGE UTILS ---
        const Storage = {
            get: (key, def) => {
                try {
                    const item = localStorage.getItem(key);
                    return item ? JSON.parse(item) : def;
                } catch (e) { return def; }
            },
            set: (key, val) => {
                try {
                    localStorage.setItem(key, JSON.stringify(val));
                } catch (e) {
                    if (e.name === 'QuotaExceededError' || e.code === 22) {
                        alert("¡Espacio lleno! No se pueden guardar más datos o imágenes grandes. Intenta borrar algunas actividades antiguas o usar imágenes más pequeñas.");
                    } else {
                        console.error("Storage Error:", e);
                    }
                }
            }
        };

        const compressImage = (file, maxWidth = 800, quality = 0.7) => {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > maxWidth) {
                                height *= maxWidth / width;
                                width = maxWidth;
                            }
                        } else {
                            if (height > maxWidth) {
                                width *= maxWidth / height;
                                height = maxWidth;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                };
                reader.readAsDataURL(file);
            });
        };



        // --- STORAGE (IndexedDB) ---
        const DB_NAME = 'MemoriaLaboresDB';
        const DB_VERSION = 6; // Incremented for Social Posts

        const DB = {
            open: () => {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(DB_NAME, DB_VERSION);
                    request.onerror = () => reject(request.error);
                    request.onsuccess = () => resolve(request.result);
                    request.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains('users')) db.createObjectStore('users', { keyPath: 'id' });
                        if (!db.objectStoreNames.contains('activities')) db.createObjectStore('activities', { keyPath: 'id' });
                        if (!db.objectStoreNames.contains('documents')) db.createObjectStore('documents', { keyPath: 'id' });
                        if (!db.objectStoreNames.contains('news')) db.createObjectStore('news', { keyPath: 'id' });
                        if (!db.objectStoreNames.contains('beneficiaries')) db.createObjectStore('beneficiaries', { keyPath: 'id' });
                        if (!db.objectStoreNames.contains('notes')) db.createObjectStore('notes', { keyPath: 'id' });
                        if (!db.objectStoreNames.contains('inventory')) db.createObjectStore('inventory', { keyPath: 'id' });
                        if (!db.objectStoreNames.contains('laip')) db.createObjectStore('laip', { keyPath: 'id' });
                        if (!db.objectStoreNames.contains('cocodes')) db.createObjectStore('cocodes', { keyPath: 'id' });
                        if (!db.objectStoreNames.contains('vehicle_logs')) db.createObjectStore('vehicle_logs', { keyPath: 'id' });
                        if (!db.objectStoreNames.contains('social_posts')) db.createObjectStore('social_posts', { keyPath: 'id' });
                    };
                });
            },
            getAll: async (storeName) => {
                const db = await DB.open();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(storeName, 'readonly');
                    const store = tx.objectStore(storeName);
                    const request = store.getAll();
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
            },
            put: async (storeName, data) => {
                const db = await DB.open();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(storeName, 'readwrite');
                    const store = tx.objectStore(storeName);
                    const request = store.put(data);
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
            },
            delete: async (storeName, id) => {
                const db = await DB.open();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(storeName, 'readwrite');
                    const store = tx.objectStore(storeName);
                    const request = store.delete(id);
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
            }
        };

        // --- CONTEXT ---
        const AppContext = React.createContext();

        const AppProvider = ({ children }) => {
            const [user, setUser] = useState(null);
            const [activities, setActivities] = useState([]);
            const [documents, setDocuments] = useState([]);
            const [news, setNews] = useState([]);
            const [beneficiaries, setBeneficiaries] = useState([]);
            const [notes, setNotes] = useState([]);
            const [inventory, setInventory] = useState([]);
            const [laip, setLaip] = useState([]);
            const [cocodes, setCocodes] = useState([]);
            const [vehicleLogs, setVehicleLogs] = useState([]);
            const [socialPosts, setSocialPosts] = useState([]);
            const [usersDB, setUsersDB] = useState([]);
            const [advisorMessages, setAdvisorMessages] = useState([
                { id: '1', role: 'assistant', content: '¡Hola! Soy tu Asesor Legal experto en administración pública guatemalteca. ¿En qué puedo ayudarte hoy?', date: new Date().toISOString() }
            ]);
            const [isGeneratingPost, setIsGeneratingPost] = useState(false);
            const [loading, setLoading] = useState(true);

            // Initial Load
            useEffect(() => {
                const initData = async () => {
                    try {
                        // Ensure DB is open/upgraded first
                        await DB.open();

                        const [loadedUsers, loadedActivities, loadedDocs, loadedNews, loadedBeneficiaries, loadedNotes, loadedInventory, loadedLaip, loadedCocodes, loadedVehicleLogs, loadedSocialPosts] = await Promise.all([
                            DB.getAll('users'),
                            DB.getAll('activities'),
                            DB.getAll('documents'),
                            DB.getAll('news'),
                            DB.getAll('beneficiaries'),
                            DB.getAll('notes'),
                            DB.getAll('inventory'),
                            DB.getAll('laip'),
                            DB.getAll('cocodes'),
                            DB.getAll('vehicle_logs'),
                            DB.getAll('social_posts')
                        ]);
                        setUsersDB(loadedUsers || []);
                        setActivities(loadedActivities || []);
                        setDocuments(loadedDocs || []);
                        setNews(loadedNews || []);
                        setBeneficiaries(loadedBeneficiaries || []);
                        setNotes(loadedNotes || []);
                        setInventory(loadedInventory || []);
                        setLaip(loadedLaip || []);
                        setCocodes(loadedCocodes || []);
                        setVehicleLogs(loadedVehicleLogs || []);
                        setSocialPosts(loadedSocialPosts || []);

                        // Auto-login last active user if needed, or just persist session in simpler way
                        // For now we just load the DB. User needs to login.
                        // Ideally we check localStorage for a 'lastUserId'
                        const lastUserId = localStorage.getItem('lastUserId');
                        if (lastUserId && loadedUsers) {
                            const currentUser = loadedUsers.find(u => u.id === lastUserId);
                            if (currentUser) setUser(currentUser);
                        }
                    } catch (err) {
                        console.error("DB Init Error:", err);
                    } finally {
                        setLoading(false);
                    }
                };
                initData();
            }, []);

            // Simple hash function for security
            const simpleHash = (str) => {
                let hash = 0;
                for (let i = 0; i < str.length; i++) {
                    const char = str.charCodeAt(i);
                    hash = ((hash << 5) - hash) + char;
                    hash = hash & hash;
                }
                return hash.toString(36);
            };

            const login = async (username, authData, method = 'password') => {
                // Try to find user by username first (new system)
                let found = usersDB.find(u => u.username === username);

                // If not found, try to find by email (legacy system compatibility)
                if (!found && method === 'password') {
                    found = usersDB.find(u => u.email === username);
                }

                if (!found) return false;

                // Verify authentication based on method
                if (method === 'password') {
                    const hashedPassword = simpleHash(authData);

                    // Check new system (hashed password)
                    if (found.passwordHash === hashedPassword) {
                        setUser(found);
                        localStorage.setItem('lastUserId', found.id);
                        return true;
                    }

                    // Check legacy system (plain text password) and migrate
                    if (found.password === authData) {
                        // Migrate user to new system
                        const migratedUser = {
                            ...found,
                            username: found.username || found.email, // Use email as username if no username
                            passwordHash: hashedPassword,
                            authMethod: 'password'
                        };
                        // Remove old password field
                        delete migratedUser.password;

                        // Update in database
                        await DB.put('users', migratedUser);
                        setUsersDB(prev => prev.map(u => u.id === migratedUser.id ? migratedUser : u));
                        setUser(migratedUser);
                        localStorage.setItem('lastUserId', migratedUser.id);
                        return true;
                    }
                } else if (method === 'pattern') {
                    const hashedPattern = simpleHash(authData);
                    if (found.patternHash === hashedPattern) {
                        setUser(found);
                        localStorage.setItem('lastUserId', found.id);
                        return true;
                    }
                } else if (method === 'face') {
                    // Simple face comparison (in production, use proper face recognition library)
                    if (found.faceData && authData) {
                        // Compare face data (simplified - just check if data exists)
                        setUser(found);
                        localStorage.setItem('lastUserId', found.id);
                        return true;
                    }
                }
                return false;
            };

            const register = async (userData, authData, method = 'password') => {
                if (usersDB.find(u => u.username === userData.username)) return false;

                const newUser = {
                    ...userData,
                    id: Date.now().toString(),
                    authMethod: method
                };

                // Store authentication data based on method
                if (method === 'password') {
                    newUser.passwordHash = simpleHash(authData);
                } else if (method === 'pattern') {
                    newUser.patternHash = simpleHash(authData);
                } else if (method === 'face') {
                    newUser.faceData = authData;
                }

                await DB.put('users', newUser);
                setUsersDB([...usersDB, newUser]);
                setUser(newUser);
                localStorage.setItem('lastUserId', newUser.id);
                return true;
            };

            const logout = () => {
                setUser(null);
                localStorage.removeItem('lastUserId');
            };

            const addActivity = async (act) => {
                const newAct = { ...act, id: Date.now().toString(), dateCreated: new Date().toISOString() };
                await DB.put('activities', newAct);
                setActivities(prev => [...prev, newAct]);
            };

            const updateActivity = async (act) => {
                await DB.put('activities', act);
                setActivities(prev => prev.map(a => a.id === act.id ? act : a));
            };

            const deleteActivity = async (id) => {
                await DB.delete('activities', id);
                setActivities(prev => prev.filter(a => a.id !== id));
            };

            const addDocument = async (doc) => {
                const newDoc = { ...doc, id: Date.now().toString(), date: new Date().toISOString().split('T')[0] };
                await DB.put('documents', newDoc);
                setDocuments(prev => [...prev, newDoc]);
            };

            const deleteDocument = async (id) => {
                await DB.delete('documents', id);
                setDocuments(prev => prev.filter(d => d.id !== id));
            };

            const handleUpdateUser = async (updatedData) => {
                await DB.put('users', updatedData);
                setUser(updatedData);
                setUsersDB(prev => prev.map(u => u.id === updatedData.id ? updatedData : u));
            };

            const addNews = async (item) => {
                const newItem = { ...item, id: Date.now().toString(), date: new Date().toISOString().split('T')[0] };
                await DB.put('news', newItem);
                setNews(prev => [...prev, newItem]);
            };

            const updateNews = async (item) => {
                await DB.put('news', item);
                setNews(prev => prev.map(n => n.id === item.id ? item : n));
            };

            const deleteNews = async (id) => {
                await DB.delete('news', id);
                setNews(prev => prev.filter(n => n.id !== id));
            };

            const addBeneficiary = async (item) => {
                const newItem = { ...item, id: Date.now().toString(), dateCreated: new Date().toISOString() };
                await DB.put('beneficiaries', newItem);
                setBeneficiaries(prev => [...prev, newItem]);
            };

            const updateBeneficiary = async (item) => {
                await DB.put('beneficiaries', item);
                setBeneficiaries(prev => prev.map(b => b.id === item.id ? item : b));
            };

            const deleteBeneficiary = async (id) => {
                await DB.delete('beneficiaries', id);
                setBeneficiaries(prev => prev.filter(b => b.id !== id));
            };

            // NOTES CRUD
            const addNote = async (note) => {
                const newNote = { ...note, id: Date.now().toString(), date: new Date().toISOString() };
                await DB.put('notes', newNote);
                setNotes(prev => [newNote, ...prev]);
            };

            const updateNote = async (note) => {
                await DB.put('notes', note);
                setNotes(prev => prev.map(n => n.id === note.id ? note : n));
            };

            const deleteNote = async (id) => {
                await DB.delete('notes', id);
                setNotes(prev => prev.filter(n => n.id !== id));
            };

            const addInventory = async (item) => {
                const newItem = { ...item, id: Date.now().toString(), dateCreated: new Date().toISOString() };
                await DB.put('inventory', newItem);
                setInventory(prev => [...prev, newItem]);
            };
            const updateInventory = async (item) => {
                await DB.put('inventory', item);
                setInventory(prev => prev.map(i => i.id === item.id ? item : i));
            };
            const deleteInventory = async (id) => {
                await DB.delete('inventory', id);
                setInventory(prev => prev.filter(i => i.id !== id));
            };

            const addLaip = async (item) => {
                const newItem = { ...item, id: Date.now().toString(), dateCreated: new Date().toISOString() };
                await DB.put('laip', newItem);
                setLaip(prev => [...prev, newItem]);
            };
            const updateLaip = async (item) => {
                await DB.put('laip', item);
                setLaip(prev => prev.map(l => l.id === item.id ? item : l));
            };
            const deleteLaip = async (id) => {
                await DB.delete('laip', id);
                setLaip(prev => prev.filter(l => l.id !== id));
            };

            const addCocodes = async (item) => {
                const newItem = { ...item, id: Date.now().toString(), dateCreated: new Date().toISOString() };
                await DB.put('cocodes', newItem);
                setCocodes(prev => [...prev, newItem]);
            };
            const updateCocodes = async (item) => {
                await DB.put('cocodes', item);
                setCocodes(prev => prev.map(c => c.id === item.id ? item : c));
            };
            const deleteCocodes = async (id) => {
                await DB.delete('cocodes', id);
                setCocodes(prev => prev.filter(c => c.id !== id));
            };

            const addVehicleLog = async (item) => {
                const newItem = { ...item, id: Date.now().toString(), dateCreated: new Date().toISOString() };
                await DB.put('vehicle_logs', newItem);
                setVehicleLogs(prev => [...prev, newItem]);
            };
            const updateVehicleLog = async (item) => {
                await DB.put('vehicle_logs', item);
                setVehicleLogs(prev => prev.map(v => v.id === item.id ? item : v));
            };
            const deleteVehicleLog = async (id) => {
                await DB.delete('vehicle_logs', id);
                setVehicleLogs(prev => prev.filter(v => v.id !== id));
            };

            const addSocialPost = async (post) => {
                const newPost = { ...post, id: Date.now().toString(), dateCreated: new Date().toISOString() };
                await DB.put('social_posts', newPost);
                setSocialPosts(prev => [newPost, ...prev]);
            };

            const deleteSocialPost = async (id) => {
                await DB.delete('social_posts', id);
                setSocialPosts(prev => prev.filter(p => p.id !== id));
            };

            const generateSocialPost = async (activity) => {
                setIsGeneratingPost(true);
                return new Promise((resolve) => {
                    setTimeout(async () => {
                        const postContent = `📢 ¡Impacto en nuestra comunidad! 🇬🇹\n\nNos complace informar sobre la actividad: "${activity.title}".\n\n📌 Lugar: ${activity.community || 'Puerto Barrios'}\n📝 Detalle: ${activity.description}\n🎯 Beneficiariarios atendidos: ${activity.beneficiaries}\n✅ Avance: ${activity.physicalProgress}%\n\n#GestiónMunicipal #Transparencia #PuertoBarrios #${activity.strategicAxis?.replace(/\s/g, '') || 'K\'atun2032'}`;

                        await addSocialPost({
                            activityId: activity.id,
                            activityTitle: activity.title,
                            content: postContent,
                            images: activity.images || [],
                            date: new Date().toISOString()
                        });
                        setIsGeneratingPost(false);
                        alert("✨ ¡Post generado con éxito! Puedes verlo en la sección de Redes Sociales.");
                        resolve();
                    }, 1500);
                });
            };

            const exportData = async () => {
                try {
                    const [users, activities, documents, news, beneficiaries, notes, inventory, laip, cocodes, vehicleLogs, socialPosts] = await Promise.all([
                        DB.getAll('users'),
                        DB.getAll('activities'),
                        DB.getAll('documents'),
                        DB.getAll('news'),
                        DB.getAll('beneficiaries'),
                        DB.getAll('notes'),
                        DB.getAll('inventory'),
                        DB.getAll('laip'),
                        DB.getAll('cocodes'),
                        DB.getAll('vehicle_logs'),
                        DB.getAll('social_posts')
                    ]);

                    const data = {
                        timestamp: new Date().toISOString(),
                        version: 3,
                        users, activities, documents, news, beneficiaries, notes,
                        inventory, laip, cocodes, vehicleLogs, socialPosts
                    };

                    const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `backup_memoria_labores_${new Date().toISOString().split('T')[0]}.json`;
                    a.click();
                    URL.revokeObjectURL(url);
                    alert('Copia de seguridad descargada exitosamente.');
                } catch (err) {
                    console.error(err);
                    alert('Error al exportar datos.');
                }
            };

            const importData = async (jsonData) => {
                if (!confirm(`Sincronización (Versión ${APP_VERSION}):\n\n¿Deseas complementar tus datos actuales con la información de este respaldo?\n\n- Los registros nuevos se añadirán.\n- Los registros con el mismo ID se actualizarán.\n- NADA se eliminará.`)) {
                    return;
                }

                try {
                    const data = JSON.parse(jsonData);
                    if (!data.users || !data.activities) {
                        throw new Error("Formato de archivo inválido");
                    }

                    setLoading(true);

                    // Import to IndexedDB (Merge/Complement)
                    const db = await DB.open();
                    const tx = db.transaction(['users', 'activities', 'documents', 'news', 'beneficiaries', 'notes', 'inventory', 'laip', 'cocodes', 'vehicle_logs', 'social_posts'], 'readwrite');

                    const addOrUpdate = (storeName, items) => {
                        const store = tx.objectStore(storeName);
                        // Removed store.clear() to allow merging
                        if (items && Array.isArray(items)) {
                            items.forEach(item => store.put(item));
                        }
                    };

                    addOrUpdate('users', data.users);
                    addOrUpdate('activities', data.activities);
                    addOrUpdate('documents', data.documents);
                    addOrUpdate('news', data.news);
                    addOrUpdate('beneficiaries', data.beneficiaries);
                    addOrUpdate('notes', data.notes);
                    addOrUpdate('inventory', data.inventory);
                    addOrUpdate('laip', data.laip);
                    addOrUpdate('cocodes', data.cocodes);
                    addOrUpdate('vehicle_logs', data.vehicle_logs);
                    addOrUpdate('social_posts', data.socialPosts);

                    tx.oncomplete = async () => {
                        // Refresh state
                        const [loadedUsers, loadedActivities, loadedDocs, loadedNews, loadedBeneficiaries, loadedNotes, loadedInventory, loadedLaip, loadedCocodes, loadedVehicleLogs, loadedSocialPosts] = await Promise.all([
                            DB.getAll('users'),
                            DB.getAll('activities'),
                            DB.getAll('documents'),
                            DB.getAll('news'),
                            DB.getAll('beneficiaries'),
                            DB.getAll('notes'),
                            DB.getAll('inventory'),
                            DB.getAll('laip'),
                            DB.getAll('cocodes'),
                            DB.getAll('vehicle_logs'),
                            DB.getAll('social_posts')
                        ]);
                        setUsersDB(loadedUsers || []);
                        setActivities(loadedActivities || []);
                        setDocuments(loadedDocs || []);
                        setNews(loadedNews || []);
                        setBeneficiaries(loadedBeneficiaries || []);
                        setNotes(loadedNotes || []);
                        setInventory(loadedInventory || []);
                        setLaip(loadedLaip || []);
                        setCocodes(loadedCocodes || []);
                        setVehicleLogs(loadedVehicleLogs || []);
                        setSocialPosts(loadedSocialPosts || []);

                        if (user) {
                            const updatedUser = loadedUsers.find(u => u.id === user.id);
                            if (updatedUser) setUser(updatedUser);
                        }

                        setLoading(false);
                        alert('¡Datos sincronizados y complementados con éxito!');
                    };

                    tx.onerror = (err) => {
                        console.error("Transaction Error:", err);
                        setLoading(false);
                        alert('Error al procesar la base de datos.');
                    };

                } catch (err) {
                    setLoading(false);
                    console.error("Import Error:", err);
                    alert('Error al importar datos. Asegúrate de seleccionar el archivo de respaldo correcto.');
                }
            };

            const sendAdvisorMessage = async (content) => {
                const userMsg = { id: Date.now().toString(), role: 'user', content, date: new Date().toISOString() };
                setAdvisorMessages(prev => [...prev, userMsg]);

                // Simulated AI Response with Guatemalan Legal Context
                setTimeout(() => {
                    let response = "Entendido. Según el Código Municipal y la Ley de Contrataciones del Estado de Guatemala, es fundamental asegurar que este proceso esté debidamente respaldado por el renglón presupuestario correspondiente.";

                    if (content.toLowerCase().includes('auditor') || content.toLowerCase().includes('cgc')) {
                        response = "Para la Contraloría General de Cuentas (CGC), es vital que cada actividad tenga su código SNIP y el respaldo de la meta física alcanzada. ¿Deseas que auditemos tus registros actuales?";
                    } else if (content.toLowerCase().includes('donación') || content.toLowerCase().includes('donante')) {
                        response = "En el caso de donaciones, recuerda que deben ser registradas oficialmente y reportadas en el portal de transparencia para evitar hallazgos en futuras auditorías.";
                    }

                    const assistantMsg = { id: (Date.now() + 1).toString(), role: 'assistant', content: response, date: new Date().toISOString() };
                    setAdvisorMessages(prev => [...prev, assistantMsg]);
                }, 1000);
            };

            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gray-100 flex-col">
                        <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mb-4"></div>
                        <p className="text-gray-600">Cargando base de datos...</p>
                    </div>
                );
            }

            return (
                <AppContext.Provider value={{
                    user, activities, documents, news,
                    login, register, logout,
                    addActivity, updateActivity, deleteActivity, updateUser: handleUpdateUser,
                    addDocument, deleteDocument,
                    addNews, updateNews, deleteNews,
                    beneficiaries, addBeneficiary, updateBeneficiary, deleteBeneficiary,
                    notes, addNote, updateNote, deleteNote,
                    inventory, addInventory, updateInventory, deleteInventory,
                    laip, addLaip, updateLaip, deleteLaip,
                    cocodes, addCocodes, updateCocodes, deleteCocodes,
                    vehicleLogs, addVehicleLog, updateVehicleLog, deleteVehicleLog,
                    socialPosts, addSocialPost, deleteSocialPost, generateSocialPost, isGeneratingPost,
                    advisorMessages, sendAdvisorMessage,
                    exportData, importData, loading
                }}>
                    {children}
                </AppContext.Provider>
            );
        };

        // --- COMPONENTS: AUTH ---
        const LoginScreen = () => {
            const { login, register } = useContext(AppContext);
            const [isRegister, setIsRegister] = useState(false);
            const [authMethod, setAuthMethod] = useState('password'); // 'password', 'pattern', 'face'
            const [error, setError] = useState('');

            // Password auth state
            const [passwordData, setPasswordData] = useState({
                username: '',
                password: '',
                name: '',
                institution: '',
                showPassword: false
            });

            // Pattern auth state
            const [pattern, setPattern] = useState([]);
            const [confirmPattern, setConfirmPattern] = useState([]);
            const [isDrawing, setIsDrawing] = useState(false);
            const [patternData, setPatternData] = useState({
                username: '',
                name: '',
                institution: ''
            });

            // Face auth state
            const [faceData, setFaceData] = useState({
                username: '',
                name: '',
                institution: '',
                capturedFaces: []
            });
            const [stream, setStream] = useState(null);
            const [isCameraActive, setIsCameraActive] = useState(false);
            const videoRef = React.useRef(null);
            const canvasRef = React.useRef(null);

            // Pattern lock grid (3x3)
            const patternGrid = [
                [0, 1, 2],
                [3, 4, 5],
                [6, 7, 8]
            ];

            // Start camera for face recognition
            const startCamera = async () => {
                try {
                    const mediaStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: 'user', width: 640, height: 480 }
                    });
                    setStream(mediaStream);
                    if (videoRef.current) {
                        videoRef.current.srcObject = mediaStream;
                    }
                    setIsCameraActive(true);
                    setError('');
                } catch (err) {
                    setError('No se pudo acceder a la cámara. Verifica los permisos.');
                    console.error('Camera error:', err);
                }
            };

            // Stop camera
            const stopCamera = () => {
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                    setStream(null);
                    setIsCameraActive(false);
                }
            };

            // Capture face photo
            const captureFace = () => {
                if (!videoRef.current || !canvasRef.current) return;

                const canvas = canvasRef.current;
                const video = videoRef.current;
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0);

                const faceImage = canvas.toDataURL('image/jpeg', 0.7);

                if (isRegister) {
                    setFaceData(prev => ({
                        ...prev,
                        capturedFaces: [...prev.capturedFaces, faceImage]
                    }));
                } else {
                    setFaceData(prev => ({ ...prev, capturedFaces: [faceImage] }));
                }
            };

            // Handle pattern dot press
            const handlePatternDot = (dotIndex) => {
                if (!pattern.includes(dotIndex)) {
                    setPattern(prev => [...prev, dotIndex]);
                }
            };

            // Reset pattern
            const resetPattern = () => {
                setPattern([]);
                setConfirmPattern([]);
            };

            // Handle password login
            const handlePasswordSubmit = async (e) => {
                e.preventDefault();
                setError('');

                if (isRegister) {
                    if (passwordData.password.length < 4) {
                        setError('La contraseña debe tener al menos 4 caracteres');
                        return;
                    }
                    const success = await register({
                        username: passwordData.username,
                        name: passwordData.name,
                        institution: passwordData.institution
                    }, passwordData.password, 'password');

                    if (success) {
                        setError('');
                    } else {
                        setError('El nombre de usuario ya existe');
                    }
                } else {
                    const success = await login(passwordData.username, passwordData.password, 'password');
                    if (!success) {
                        setError('Usuario o contraseña incorrectos');
                    }
                }
            };

            // Handle pattern login
            const handlePatternSubmit = async () => {
                setError('');

                if (pattern.length < 4) {
                    setError('El patrón debe tener al menos 4 puntos');
                    return;
                }

                if (isRegister) {
                    if (confirmPattern.length === 0) {
                        setConfirmPattern([...pattern]);
                        setPattern([]);
                        setError('Confirma tu patrón dibujándolo nuevamente');
                        return;
                    }

                    if (JSON.stringify(pattern) !== JSON.stringify(confirmPattern)) {
                        setError('Los patrones no coinciden. Intenta de nuevo.');
                        resetPattern();
                        return;
                    }

                    const patternString = pattern.join('-');
                    const success = await register({
                        username: patternData.username,
                        name: patternData.name,
                        institution: patternData.institution
                    }, patternString, 'pattern');

                    if (success) {
                        resetPattern();
                    } else {
                        setError('El nombre de usuario ya existe');
                    }
                } else {
                    const patternString = pattern.join('-');
                    const success = await login(patternData.username, patternString, 'pattern');
                    if (!success) {
                        setError('Usuario o patrón incorrectos');
                        resetPattern();
                    }
                }
            };

            // Handle face login
            const handleFaceSubmit = async () => {
                setError('');

                if (faceData.capturedFaces.length === 0) {
                    setError('Debes capturar al menos una foto');
                    return;
                }

                if (isRegister && faceData.capturedFaces.length < 3) {
                    setError('Captura 3 fotos para mejor precisión');
                    return;
                }

                const faceDataString = faceData.capturedFaces.join('|');

                if (isRegister) {
                    const success = await register({
                        username: faceData.username,
                        name: faceData.name,
                        institution: faceData.institution
                    }, faceDataString, 'face');

                    if (success) {
                        stopCamera();
                        setFaceData(prev => ({ ...prev, capturedFaces: [] }));
                    } else {
                        setError('El nombre de usuario ya existe');
                    }
                } else {
                    const success = await login(faceData.username, faceDataString, 'face');
                    if (!success) {
                        setError('Usuario no encontrado o rostro no reconocido');
                        setFaceData(prev => ({ ...prev, capturedFaces: [] }));
                    }
                    stopCamera();
                }
            };

            // Cleanup camera on unmount
            React.useEffect(() => {
                return () => stopCamera();
            }, []);

            return (
                <div className="min-h-screen bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-500 flex items-center justify-center p-4">
                    <div className="bg-white rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden">
                        {/* Header */}
                        <div className="bg-gradient-to-r from-indigo-600 to-purple-600 p-6 text-white text-center">
                            <h1 className="text-3xl font-bold mb-2">
                                {isRegister ? '📝 Registro' : '🔐 Iniciar Sesión'}
                            </h1>
                            <p className="text-indigo-100">Memoria de Labores Digital</p>
                        </div>

                        {/* Tab Navigation */}
                        <div className="flex border-b border-gray-200">
                            <button
                                onClick={() => setAuthMethod('password')}
                                className={`flex-1 py-4 px-4 text-sm font-bold transition ${authMethod === 'password'
                                    ? 'bg-indigo-50 text-indigo-600 border-b-2 border-indigo-600'
                                    : 'text-gray-500 hover:bg-gray-50'
                                    }`}
                            >
                                🔑 Contraseña
                            </button>
                            <button
                                onClick={() => setAuthMethod('pattern')}
                                className={`flex-1 py-4 px-4 text-sm font-bold transition ${authMethod === 'pattern'
                                    ? 'bg-purple-50 text-purple-600 border-b-2 border-purple-600'
                                    : 'text-gray-500 hover:bg-gray-50'
                                    }`}
                            >
                                🔲 Patrón
                            </button>
                            <button
                                onClick={() => setAuthMethod('face')}
                                className={`flex-1 py-4 px-4 text-sm font-bold transition ${authMethod === 'face'
                                    ? 'bg-pink-50 text-pink-600 border-b-2 border-pink-600'
                                    : 'text-gray-500 hover:bg-gray-50'
                                    }`}
                            >
                                📸 Facial
                            </button>
                        </div>

                        <div className="p-8">
                            {/* Error Message */}
                            {error && (
                                <div className="mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-red-600 text-sm">
                                    {error}
                                </div>
                            )}

                            {/* PASSWORD METHOD */}
                            {authMethod === 'password' && (
                                <form onSubmit={handlePasswordSubmit} className="space-y-4">
                                    {isRegister && (
                                        <>
                                            <input
                                                required
                                                className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                                placeholder="Nombre Completo"
                                                value={passwordData.name}
                                                onChange={e => setPasswordData({ ...passwordData, name: e.target.value })}
                                            />
                                            <input
                                                required
                                                className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                                placeholder="Institución"
                                                value={passwordData.institution}
                                                onChange={e => setPasswordData({ ...passwordData, institution: e.target.value })}
                                            />
                                        </>
                                    )}
                                    <input
                                        required
                                        className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                        placeholder="Nombre de Usuario"
                                        value={passwordData.username}
                                        onChange={e => setPasswordData({ ...passwordData, username: e.target.value })}
                                    />
                                    <div className="relative">
                                        <input
                                            required
                                            type={passwordData.showPassword ? 'text' : 'password'}
                                            className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent pr-12"
                                            placeholder="Contraseña"
                                            value={passwordData.password}
                                            onChange={e => setPasswordData({ ...passwordData, password: e.target.value })}
                                        />
                                        <button
                                            type="button"
                                            onClick={() => setPasswordData({ ...passwordData, showPassword: !passwordData.showPassword })}
                                            className="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600"
                                        >
                                            <Icon name={passwordData.showPassword ? 'eye-off' : 'eye'} size={20} />
                                        </button>
                                    </div>
                                    <button
                                        type="submit"
                                        className="w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white p-3 rounded-lg font-bold hover:from-indigo-700 hover:to-purple-700 transition shadow-lg"
                                    >
                                        {isRegister ? 'Registrarse' : 'Entrar'}
                                    </button>
                                </form>
                            )}

                            {/* PATTERN METHOD */}
                            {authMethod === 'pattern' && (
                                <div className="space-y-4">
                                    {isRegister && (
                                        <>
                                            <input
                                                required
                                                className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                                placeholder="Nombre Completo"
                                                value={patternData.name}
                                                onChange={e => setPatternData({ ...patternData, name: e.target.value })}
                                            />
                                            <input
                                                required
                                                className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                                placeholder="Institución"
                                                value={patternData.institution}
                                                onChange={e => setPatternData({ ...patternData, institution: e.target.value })}
                                            />
                                        </>
                                    )}
                                    <input
                                        required
                                        className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                        placeholder="Nombre de Usuario"
                                        value={patternData.username}
                                        onChange={e => setPatternData({ ...patternData, username: e.target.value })}
                                    />

                                    <div className="text-center text-sm text-gray-600 mb-2">
                                        {isRegister && confirmPattern.length === 0 && 'Dibuja tu patrón (mínimo 4 puntos)'}
                                        {isRegister && confirmPattern.length > 0 && 'Confirma tu patrón'}
                                        {!isRegister && 'Dibuja tu patrón para ingresar'}
                                    </div>

                                    {/* Pattern Grid */}
                                    <div className="bg-purple-50 p-8 rounded-xl">
                                        <div className="grid grid-cols-3 gap-8 max-w-xs mx-auto">
                                            {patternGrid.flat().map(dotIndex => (
                                                <button
                                                    key={dotIndex}
                                                    type="button"
                                                    onMouseDown={() => {
                                                        setIsDrawing(true);
                                                        handlePatternDot(dotIndex);
                                                    }}
                                                    onMouseEnter={() => {
                                                        if (isDrawing) handlePatternDot(dotIndex);
                                                    }}
                                                    onMouseUp={() => setIsDrawing(false)}
                                                    onTouchStart={() => {
                                                        setIsDrawing(true);
                                                        handlePatternDot(dotIndex);
                                                    }}
                                                    onTouchMove={(e) => {
                                                        if (isDrawing) {
                                                            const touch = e.touches[0];
                                                            const element = document.elementFromPoint(touch.clientX, touch.clientY);
                                                            if (element && element.dataset.dot) {
                                                                handlePatternDot(parseInt(element.dataset.dot));
                                                            }
                                                        }
                                                    }}
                                                    onTouchEnd={() => setIsDrawing(false)}
                                                    data-dot={dotIndex}
                                                    className={`w-16 h-16 rounded-full border-4 transition-all ${pattern.includes(dotIndex)
                                                        ? 'bg-purple-600 border-purple-700 scale-110'
                                                        : 'bg-white border-purple-300 hover:border-purple-500'
                                                        }`}
                                                >
                                                    {pattern.includes(dotIndex) && (
                                                        <span className="text-white font-bold">{pattern.indexOf(dotIndex) + 1}</span>
                                                    )}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="flex gap-2">
                                        <button
                                            type="button"
                                            onClick={resetPattern}
                                            className="flex-1 bg-gray-200 text-gray-700 p-3 rounded-lg font-bold hover:bg-gray-300 transition"
                                        >
                                            Limpiar
                                        </button>
                                        <button
                                            type="button"
                                            onClick={handlePatternSubmit}
                                            disabled={pattern.length < 4 || !patternData.username}
                                            className="flex-1 bg-gradient-to-r from-purple-600 to-pink-600 text-white p-3 rounded-lg font-bold hover:from-purple-700 hover:to-pink-700 transition shadow-lg disabled:opacity-50 disabled:cursor-not-allowed"
                                        >
                                            {isRegister ? 'Registrar' : 'Entrar'}
                                        </button>
                                    </div>
                                </div>
                            )}

                            {/* FACE METHOD */}
                            {authMethod === 'face' && (
                                <div className="space-y-4">
                                    {isRegister && (
                                        <>
                                            <input
                                                required
                                                className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-500 focus:border-transparent"
                                                placeholder="Nombre Completo"
                                                value={faceData.name}
                                                onChange={e => setFaceData({ ...faceData, name: e.target.value })}
                                            />
                                            <input
                                                required
                                                className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-500 focus:border-transparent"
                                                placeholder="Institución"
                                                value={faceData.institution}
                                                onChange={e => setFaceData({ ...faceData, institution: e.target.value })}
                                            />
                                        </>
                                    )}
                                    <input
                                        required
                                        className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-500 focus:border-transparent"
                                        placeholder="Nombre de Usuario"
                                        value={faceData.username}
                                        onChange={e => setFaceData({ ...faceData, username: e.target.value })}
                                    />

                                    <div className="text-center text-sm text-gray-600 mb-2">
                                        {isRegister ? `Captura 3 fotos (${faceData.capturedFaces.length}/3)` : 'Captura tu rostro para ingresar'}
                                    </div>

                                    {/* Camera Preview */}
                                    <div className="bg-pink-50 p-4 rounded-xl">
                                        {!isCameraActive ? (
                                            <div className="text-center py-12">
                                                <Icon name="camera" size={48} className="mx-auto text-pink-400 mb-4" />
                                                <button
                                                    type="button"
                                                    onClick={startCamera}
                                                    className="bg-pink-600 text-white px-6 py-3 rounded-lg font-bold hover:bg-pink-700 transition"
                                                >
                                                    Activar Cámara
                                                </button>
                                            </div>
                                        ) : (
                                            <div className="space-y-3">
                                                <video
                                                    ref={videoRef}
                                                    autoPlay
                                                    playsInline
                                                    className="w-full rounded-lg"
                                                />
                                                <canvas ref={canvasRef} className="hidden" />
                                                <button
                                                    type="button"
                                                    onClick={captureFace}
                                                    disabled={isRegister && faceData.capturedFaces.length >= 3}
                                                    className="w-full bg-pink-600 text-white p-3 rounded-lg font-bold hover:bg-pink-700 transition disabled:opacity-50 disabled:cursor-not-allowed"
                                                >
                                                    📸 Capturar Foto
                                                </button>
                                            </div>
                                        )}
                                    </div>

                                    {/* Captured faces preview */}
                                    {faceData.capturedFaces.length > 0 && (
                                        <div className="grid grid-cols-3 gap-2">
                                            {faceData.capturedFaces.map((face, idx) => (
                                                <img
                                                    key={idx}
                                                    src={face}
                                                    alt={`Captura ${idx + 1}`}
                                                    className="w-full h-24 object-cover rounded-lg border-2 border-pink-300"
                                                />
                                            ))}
                                        </div>
                                    )}

                                    <button
                                        type="button"
                                        onClick={handleFaceSubmit}
                                        disabled={faceData.capturedFaces.length === 0 || !faceData.username || (isRegister && faceData.capturedFaces.length < 3)}
                                        className="w-full bg-gradient-to-r from-pink-600 to-rose-600 text-white p-3 rounded-lg font-bold hover:from-pink-700 hover:to-rose-700 transition shadow-lg disabled:opacity-50 disabled:cursor-not-allowed"
                                    >
                                        {isRegister ? 'Registrar' : 'Entrar'}
                                    </button>
                                </div>
                            )}

                            {/* Toggle Register/Login */}
                            <div className="mt-6 text-center">
                                <button
                                    onClick={() => {
                                        setIsRegister(!isRegister);
                                        setError('');
                                        resetPattern();
                                        setFaceData(prev => ({ ...prev, capturedFaces: [] }));
                                        stopCamera();
                                    }}
                                    className="text-indigo-600 hover:underline font-medium"
                                >
                                    {isRegister ? '¿Ya tienes cuenta? Inicia sesión' : '¿No tienes cuenta? Regístrate'}
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const BIBLE_PROMISES = [
            { text: "Porque yo sé los pensamientos que tengo acerca de vosotros, dice Jehová, pensamientos de paz, y no de mal, para daros el fin que esperáis.", ref: "Jeremías 29:11" },
            { text: "Mira que te mando que te esfuerces y seas valiente; no temas ni desmayes, porque Jehová tu Dios estará contigo en dondequiera que vayas.", ref: "Josué 1:9" },
            { text: "Todo lo puedo en Cristo que me fortalece.", ref: "Filipenses 4:13" },
            { text: "Y sabemos que a los que aman a Dios, todas las cosas les ayudan a bien.", ref: "Romanos 8:28" },
            { text: "Jehová es mi pastor; nada me faltará.", ref: "Salmos 23:1" },
            { text: "Fíate de Jehová de todo tu corazón, Y no te apoyes en tu propia prudencia.", ref: "Proverbios 3:5" },
            { text: "No temas, porque yo estoy contigo; no desmayes, porque yo soy tu Dios que te esfuerzo.", ref: "Isaías 41:10" }
        ];

        const StatCard = ({ icon, label, value, color, sub }) => (
            <div className={`bg-white p-6 rounded-3xl shadow-sm border border-gray-100 flex items-center space-x-4 hover:shadow-md transition cursor-default`}>
                <div className={`bg-${color}-100 p-4 rounded-2xl text-${color}-600`}>
                    <Icon name={icon} size={28} />
                </div>
                <div>
                    <p className="text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">{label}</p>
                    <div className="flex items-baseline space-x-2">
                        <p className="text-2xl font-black text-gray-800">{value}</p>
                        {sub && <span className="text-[10px] font-bold text-gray-400 uppercase">{sub}</span>}
                    </div>
                </div>
            </div>
        );

        const HomeView = () => {
            const { user, activities, inventory, laip, cocodes, exportData, importData } = useContext(AppContext);
            const today = new Date().toLocaleDateString('es-GT', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            const verse = useMemo(() => BIBLE_PROMISES[Math.floor(Math.random() * BIBLE_PROMISES.length)], []);

            const stats = {
                activities: activities.length,
                pendingLaip: laip.filter(l => l.status !== 'Entregada').length,
                inventoryItems: inventory.length,
                cocodeProjects: cocodes.length
            };

            return (
                <div className="max-w-6xl mx-auto space-y-8 animate-in fade-in duration-700">
                    <div className="flex flex-col md:flex-row gap-6">
                        <div className="bg-gradient-to-r from-blue-600 to-indigo-700 rounded-2xl p-8 text-white shadow-xl relative overflow-hidden flex-1">
                            <div className="relative z-10">
                                <h1 className="text-4xl font-bold mb-2">¡Bienvenido, {user.name.split(' ')[0]}!</h1>
                                <p className="text-blue-100 text-lg mb-6 capitalize">{today}</p>
                                <p className="max-w-xl text-blue-50 opacity-90 mb-6 font-medium">
                                    Gestión Institucional de {user.institution}. Use los nuevos módulos para un control total.
                                </p>
                                <div className="flex flex-wrap gap-3">
                                    <a href={`tel:${user.phone || "79480785"}`} className="bg-white/20 hover:bg-white/30 backdrop-blur-md text-white px-6 py-2 rounded-xl font-bold flex items-center gap-2 border border-white/20 transition shadow-lg">
                                        <Icon name="phone" size={18} />
                                        Llamar
                                    </a>
                                    <a href={`https://wa.me/${(user.whatsapp || "50279480785").replace(/[^0-9]/g, '')}`} target="_blank" className="bg-emerald-500 hover:bg-emerald-600 text-white px-6 py-2 rounded-xl font-bold flex items-center gap-2 transition shadow-lg">
                                        <Icon name="message-circle" size={18} />
                                        WhatsApp
                                    </a>
                                    <a href={`mailto:${user.contactEmail || "informacion@munipuertobarrios.gob.gt"}`} className="bg-red-500 hover:bg-red-600 text-white px-6 py-2 rounded-xl font-bold flex items-center gap-2 transition shadow-lg">
                                        <Icon name="mail" size={18} />
                                        Correo
                                    </a>
                                </div>
                            </div>
                            <div className="absolute right-0 bottom-0 opacity-10 transform translate-x-10 translate-y-10">
                                <Icon name="building-2" size={200} />
                            </div>
                        </div>

                        <div className="flex flex-col gap-4 w-full md:w-80">
                            <div className="bg-white rounded-xl shadow-lg border-l-4 border-green-500 p-6 flex flex-col justify-center items-center text-center flex-1">
                                <h3 className="font-bold text-gray-800 text-sm mb-2">Respaldo de Datos</h3>
                                <div className="grid grid-cols-1 gap-2 w-full">
                                    <button onClick={exportData} className="bg-green-600 text-white px-4 py-2 rounded-lg text-xs font-bold hover:bg-green-700 transition shadow-sm flex items-center justify-center gap-2">
                                        <Icon name="download" size={14} />
                                        Exportar
                                    </button>
                                    <label className="bg-blue-600 text-white px-4 py-2 rounded-lg text-xs font-bold hover:bg-blue-700 transition shadow-sm flex items-center justify-center gap-2 cursor-pointer">
                                        <Icon name="upload" size={14} />
                                        Importar
                                        <input type="file" accept=".json" className="hidden" onChange={(e) => {
                                            const file = e.target.files[0];
                                            if (file) {
                                                const reader = new FileReader();
                                                reader.onload = (event) => importData(event.target.result);
                                                reader.readAsText(file);
                                            }
                                        }} />
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Quick Stats Grid */}
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                        <StatCard icon="clipboard-check" label="Actividades POA" value={stats.activities} color="blue" />
                        <StatCard icon="info" label="Alertas LAIP" value={stats.pendingLaip} color="emerald" sub="Pendientes" />
                        <StatCard icon="package" label="Activos / Inv." value={stats.inventoryItems} color="amber" />
                        <StatCard icon="handshake" label="Compromisos" value={stats.cocodeProjects} color="orange" sub="Comunitarios" />
                    </div>

                    <div className="bg-white rounded-xl shadow-lg border-l-4 border-amber-400 p-8 relative overflow-hidden">
                        <div className="absolute top-0 right-0 p-4 opacity-5">
                            <Icon name="sun" size={100} className="text-amber-500" />
                        </div>
                        <h3 className="text-amber-600 font-bold uppercase tracking-wide text-xs mb-3 flex items-center gap-2">
                            <Icon name="sparkles" size={16} />
                            Palabra Diaria
                        </h3>
                        <blockquote className="text-xl font-serif text-gray-700 italic mb-4 relative z-10">
                            "{verse.text}"
                        </blockquote>
                        <p className="text-right font-bold text-gray-900">— {verse.ref}</p>
                    </div>
                </div>
            );
        };

        const ProfileView = () => {
            const { user, updateUser } = useContext(AppContext);
            const [formData, setFormData] = useState({ ...user });
            const [isSaved, setIsSaved] = useState(false);

            const handleFile = async (e, field) => {
                const file = e.target.files[0];
                if (!file) return;
                try {
                    const compressed = await compressImage(file, 600, 0.6);
                    setFormData(prev => ({ ...prev, [field]: compressed }));
                } catch (err) {
                    console.error("Error compression", err);
                }
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                await updateUser(formData);
                setIsSaved(true);
                alert("Perfil actualizado correctamente");
                setTimeout(() => setIsSaved(false), 3000);
            };

            return (
                <div className="max-w-2xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden">
                    <div className="bg-gray-50 p-6 border-b flex justify-between items-center">
                        <h2 className="text-xl font-bold text-gray-800">Editar Perfil</h2>
                        {isSaved && <span className="text-green-600 text-sm font-bold flex items-center gap-1"><Icon name="check" size={16} /> Guardado</span>}
                    </div>
                    <form onSubmit={handleSubmit} className="p-8 space-y-6">
                        <div className="flex items-center space-x-6 mb-6">
                            <div className="relative group cursor-pointer">
                                {formData.userPhoto ?
                                    <img src={formData.userPhoto} className="w-24 h-24 rounded-full object-cover border-4 border-white shadow-md" /> :
                                    <div className="w-24 h-24 rounded-full bg-gray-200 flex items-center justify-center text-gray-400"><Icon name="user" size={40} /></div>
                                }
                                <input type="file" onChange={e => handleFile(e, 'userPhoto')} className="absolute inset-0 opacity-0 cursor-pointer z-20" />
                                <div className="absolute inset-0 bg-black/30 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition text-white text-xs pointer-events-none z-10">Cambiar</div>
                            </div>
                            <div className="flex-1">
                                <label className="block text-sm font-medium text-gray-700 mb-1">Nombre Completo</label>
                                <input required className="w-full p-3 border rounded-lg" value={formData.name} onChange={e => setFormData({ ...formData, name: e.target.value })} />
                            </div>
                        </div>

                        <div className="grid grid-cols-2 gap-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Correo Electrónico</label>
                                <input required type="email" className="w-full p-3 border rounded-lg bg-gray-50" value={formData.email} disabled />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                                <input required type="password" className="w-full p-3 border rounded-lg" value={formData.password} onChange={e => setFormData({ ...formData, password: e.target.value })} />
                            </div>
                        </div>

                        <hr className="border-dashed" />

                        <div className="space-y-4">
                            <h3 className="font-bold text-gray-900">Información Institucional</h3>

                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Nombre Institución</label>
                                <input required className="w-full p-3 border rounded-lg" value={formData.institution} onChange={e => setFormData({ ...formData, institution: e.target.value })} />
                            </div>

                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Dirección / Área</label>
                                    <input required className="w-full p-3 border rounded-lg" value={formData.direction} onChange={e => setFormData({ ...formData, direction: e.target.value })} />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Oficina</label>
                                    <input required className="w-full p-3 border rounded-lg" value={formData.office} onChange={e => setFormData({ ...formData, office: e.target.value })} />
                                </div>
                            </div>

                            <div className="grid grid-cols-3 gap-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Teléfono</label>
                                    <input className="w-full p-3 border rounded-lg" value={formData.phone || ''} onChange={e => setFormData({ ...formData, phone: e.target.value })} placeholder="7948-XXXX" />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">WhatsApp</label>
                                    <input className="w-full p-3 border rounded-lg" value={formData.whatsapp || ''} onChange={e => setFormData({ ...formData, whatsapp: e.target.value })} placeholder="502XXXXXXXX" />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Correo Contacto</label>
